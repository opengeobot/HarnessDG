# HarnessDG 本地开发环境
# 功能：PostgreSQL + AGE + pgvector 统一数据库服务
# 时间：2026-05-07
# 作者：AxeXie

services:
  postgres:
    image: apache/age:release_PG16_1.6.0
    container_name: harnessdg-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: harnessdg
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness_dev
    volumes:
      - pg_data:/var/lib/postgresql/data
    command: >
      bash -c "
        apt-get update -qq && apt-get install -y -qq postgresql-16-pgvector &&
        docker-entrypoint.sh postgres
      "
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d harnessdg"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pg_data:
    driver: local
