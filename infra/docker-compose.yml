# HarnessDG 本地开发环境
# 功能：PostgreSQL + AGE + pgvector 统一数据库服务
# 时间：2026-05-07
# 作者：AxeXie

name: harnessdg

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: harnessdg-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: harnessdg
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness_dev
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d harnessdg"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pg_data:
    driver: local
