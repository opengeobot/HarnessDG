        应用服务 requirePermission 先行）；仅 notification:read 主体登录落地 /assets 由
        RouteGuard 渲染 403「缺少访问权限」且资产表格 count=0（profile.spec.ts AC-P0B-UI-002
        口径在用例中复验，全量 101 passed 含该用例）。
      scenarioCategory: denial
    - scenarioId: AC-DST-DETAIL-003
      assertion: >-
        E2（PreviewApplicationServiceRenderTest，13 项，mvnw verify 776 全过内）：
        403 先于一切存储与仓储访问（fail-closed）；版本属于其他资产 → 与未知版本同一 404（防枚举）；
        artifact 不属于该版本 → 同一 404；非 PUBLISHED → 409 且不触达存储（先权限后状态防探测）；
        白名单外 mediaType（参数化含 image/svg+xml、text/csv）→ 415；mediaType 缺失且扩展名
        不可识别 → 415；元数据 size 超限 → 413 预检（零存储调用）；元数据偏小但流式超限 → 413
        双保险；对象缺失 → 404 PREVIEW_SOURCE_UNAVAILABLE 不伪造空图；IO 失败 → 同 404 不泄露内部错误。
      scenarioCategory: denial
    - scenarioId: AC-DST-DETAIL-003
      assertion: >-
        E2：新端点为受保护业务读接口、不新增匿名面——SecurityConfig 未改动（不在 allowedPaths），
        既有 JWT 过滤器对 /api/v1/** 全局 fail-closed 由既存 Security 测试与 e2e 未登录重定向
        用例复验；本端点无 permitAll 例外。
      scenarioCategory: denial
    - scenarioId: AC-DST-DETAIL-001
