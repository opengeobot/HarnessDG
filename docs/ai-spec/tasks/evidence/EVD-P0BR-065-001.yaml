limitations:
  skippedTests: []
  assumptions:
    - >-
      闭环正向缺口：版本状态机无 HTTP 推进入口，DRAFT→PENDING_REVIEW 依赖
      UPLOAD_MATERIALIZE/VERSION_VALIDATE 作业，而二者在运行态无入队方——
      验收栈内不存在（本卡也不制造）真实 PENDING_REVIEW 版本；
      「提交→审批→决策成功」正向 E4 链路因此不可达，由 E2（ReviewPage.test.tsx
      mock 后端）证明前端会话内闭环行为，并以后端实测 500/403 固化断链证据。
      修复入队链属后续后端卡，不在本卡范围（backend 冻结）。
    - >-
      卡面 AC-P0B-UI-002「无 asset:publish 的主体提交审批决策被 403」依赖先持有
      真实 requestId（见上条），端到端不可达；决策端授权语义已由 064 的
      E4（APPROVE 200/READER 提交 403）与后端测试覆盖，本卡不重复取证。
    - >-
      vitest 5s 默认超时对 CPU 负载敏感：本卡早期轮次在与 e2e 并行时出现过
      2 项超时抖动；本轮（终值采集轮）在同一并行负载下 85/85 全过，
      定性为资源性抖动而非功能缺陷；全局超时配置调整属工程基线后续项。
    - >-
      050 夹具资产曾被目录分页（limit=10，创建时间倒序）挤出首屏导致 e2e 间歇失败：
      本卡顺带以 support.ts 真实搜索路径修复（用户本来的操作路径，非放宽断言）。
  environmentDifferences:
    - >-
      Playwright 走主机 vite 5173（webServer）而非 nginx 8080 容器前端
      （nginx 的 location /assets/ 静态规则遮蔽 SPA 深链，属既有基础设施缺陷，
      见 EVD-P0BR-050-001 limitations）；API 流量仍经真实 nginx 8080 转发。
    - >-
      /upload 直连的 RouteGuard 拒绝路径无独立 e2e 断言（本卡证明 /review 直连拒绝
      与 /upload 导航可见性，另有 navigation.test.ts 路由表口径一致性断言）；
      /upload 与 /review 共用同一 guarded(scope) 实现，守卫逻辑无分支差异。

