        「Back to Asset Catalog」——D6 硬编码整改的 locale 正向证据。
        既有 E4（i18n.spec.ts 5 条，全量 36 跑内复验）：登录页切换、刷新保持、
        登录后导航语言、请求 Accept-Language 一致、后端错误按 i18nKey 渲染。
        403 页 guard.* 双语文案由本卡 RouteGuard i18n 化提供键（zh/en.json），
        由用例 3 在中文态断言可见、用例 5 语言切换路径复验导航文案。
      scenarioCategory: happy
    - scenarioId: AC-P0B-UI-005
      assertion: >-
        E2：notFound.*、guard.*、nav.review 新文案 zh.json/en.json 双份齐备；
