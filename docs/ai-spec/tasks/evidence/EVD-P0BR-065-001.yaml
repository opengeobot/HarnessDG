        publishVersion，后端无映射恒 404）已从 api.ts 与调用点删除，
        审查页全部动作对应 OpenAPI 既有真实端点。
      scenarioCategory: happy
    - scenarioId: AC-P0B-UI-006
      assertion: >-
        E4（跨挂载刷新竞态修复，§2 缺陷事实 7）：AuthProvider 启动静默刷新改为
