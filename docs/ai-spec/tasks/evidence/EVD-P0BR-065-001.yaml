coverage:
  proven:
    - scenarioId: AC-P0B-UI-006
      assertion: >-
        E4（review-workflow.spec.ts 用例 1-3）：持 asset:manage 的夹具作者登录真实栈后
        侧边导航可见「发布审批」「上传中心」；仅持 asset:read 的主体逐项过滤生效——
        资产目录可见而发布审批/上传中心 count=0（逐项判定，非整体开关）；
        后者直连 /review 被 RouteGuard 拒绝（403 页「缺少访问权限」可见、审批页标题不渲染）。
        asset:write 幽灵码修复前后对照：修复前 /review、/upload、资产设置的路由守卫要求
        一个 Permissions.java 从未注册、任何主体永不可能持有的 scope，凡入口必 403。
      scenarioCategory: happy
    - scenarioId: AC-P0B-UI-006
      assertion: >-
        E2（navigation.test.ts 065 新增 2 条 + 既有全套）：发布审批入口存在且
        requiredScopes 声明 asset:manage；遍历 NAV_ITEMS 断言全站导航不再出现
        asset:write 幽灵码（防回归守卫）；导航-路由权限口径一致性断言。
      scenarioCategory: boundary
    - scenarioId: AC-P0B-UI-003
      assertion: >-
        E4（review-workflow.spec.ts 用例 4）：夹具作者经真实导航打开 /review——可达、
        未查询时显示诚实提示（「输入资产 ID 后查询版本」「本会话暂未提交发布请求」）；
        查询真实夹具资产（仅 DRAFT 1.0.0）后显示「该资产暂无待审批版本」，
        「提交发布」按钮 count=0——修复前该页渲染捏造的 pub_* requestId、
        冻结摘要与提交人行，现在任何非会话内真实数据一律不出现。
      scenarioCategory: happy
    - scenarioId: AC-P0B-UI-003
      assertion: >-
        E4（review-workflow.spec.ts 用例 7-8）：后端独立授权实证——仅 asset:read 的
        主体直连 POST /versions/{id}/publish-requests 返回 403
        AUTH_PERMISSION_DENIED（UI 不是安全边界）；持 asset:manage 的主体对 DRAFT 版本
        提交发布请求实测 500 INTERNAL_ERROR（业务状态机要求 PENDING_REVIEW，而
        PENDING_REVIEW 运行态不可达——闭环断链的直接证据），且 UI 侧无错误态假成功渲染
        （alert count=0、「发布请求已提交」count=0）。
      scenarioCategory: failure
    - scenarioId: AC-P0B-UI-003
      assertion: >-
        E2（ReviewPage.test.tsx 4 项，新增）：初始诚实态断言（无 pub_*/冻结摘要/提交人、
        listVersions 未调用）；提交按钮仅 PENDING_REVIEW 版本开放（DRAFT/PUBLISHED 不渲染）；
        以 mock 后端驱动真实提交→会话内真实 requestId→APPROVE 决策入队
        （断言 /versions/ver-1/publish-requests 与 /publish-requests/req-real-1/decisions
        真实调用形状）；查询失败显示 alert+重试且不捏造行。
        正向审批闭环（含决策成功态表单收敛）由该 E2 证明；E4 层因运行态断链不可达，
        如实记入 limitations 第 1/2 条。
      scenarioCategory: happy
    - scenarioId: AC-P0B-UI-002
      assertion: >-
        E4：权限可见性与守卫口径——asset:manage 主体可见并可进入发布审批入口（用例 1、4），
        无 asset:manage 主体导航不可见且直连 /review 被拒（用例 2、3）；
        E2（routes.tsx/navigation.test.ts）：/review、/upload、资产设置的 guarded scopes
        与导航 requiredScopes 共用 asset:manage 单一口径，幽灵 asset:write 全灭。
        卡面「无 asset:publish 决策被 403」一行因闭环断链物理不可达，记 limitations 第 2 条；
        /upload 直连守卫无独立 e2e 断言，记 limitations 第 6 条。
      scenarioCategory: happy
    - scenarioId: AC-P0B-UI-005
      assertion: >-
        E4（review-workflow.spec.ts 用例 5-6）：/review 标题「发布审批」→切 English 后
