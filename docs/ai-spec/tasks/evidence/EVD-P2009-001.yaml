    - scenarioId: AC-DST-CLI-001
      assertion: >-
        E4：同 Principal 下 `aih dataset search p2009-e4 --output json` 与 REST
        GET /assets?type=DATASET&keyword=p2009-e4 结果条目数与字段一致（EQ 3 3）；
        CLI 输出经信封解包后为稳定 JSON；stderr 无任何 token 片段。
      scenarioCategory: normal
    - scenarioId: AC-DST-CLI-004
      assertion: >-
        E4：无效 token → rc=2（{"error":{"code":"2","message":"Authentication
        failed (HTTP 401)"}}）；未知 asset → rc=3（HTTP 404）；pull 目标已存在
        .part 校验失败/票据失败后无半写残留文件（find 断言 0 命中）；三处错误输出
        均不含 accessToken/口令明文。
      scenarioCategory: unauthorized
    - scenarioId: AC-DST-CLI-005
      assertion: >-
        E4：`dataset create`（DEC-011 必填 ownerTeamId=unmapped_team/visibility
        校验前置）→ `dataset version`（SemVer 语法前置校验：v 前缀被 CLI 提示、
        服务端 ASSET_VERSION_SYNTAX_INVALID 实证）→ `dataset push` 7MB fixture
        2-part multipart：Session 创建、逐 part PUT、complete、状态轮询至
        COMPLETED（session=upl_01m4fhzxt58qx4bjbk9ehhksk5）；服务端回查
        parts 2/2 COMPLETED、artifacts 3 条 sha256/dvcFile/dvcHash 完整落库、
        整版 GIT_DVC 下载票据含 gitCloneUrl+revision——create/push 全程会话与
        工作器状态可追踪。
      scenarioCategory: normal
    - scenarioId: AC-DST-CLI-006
      assertion: >-
        E4：同 AIH_IDEMPOTENCY_KEY + 同 body 两次 create → 均 rc=0 且返回同一
        assetId（ast_01m4fhzxgx7pk73pnc86dkq40q，重放语义）；同键异 body → HTTP
        409 IDEMPOTENCY_KEY_CONFLICT → CLI rc=4 且 stderr 携带服务端错误详情
        （冲突确定性）。幂等键由 CLI 自动生成 uuid v4 或经环境变量注入并转发
        Idempotency-Key 头（冒烟面 14/14 佐证键生成形态）。
      scenarioCategory: idempotency
    - assertion: >-
        E4 附带登录面：`aih login --password-stdin` rc=0 且 token 持久化
        ~/.aih/token；口令仅经 stdin/env 传入、全程不入 argv、任何输出不含口令明文
        （crossCutting SECRETS 断言通过）。
      scenarioCategory: security
    - assertion: >-
        E4 迭代暴露并修复的 CLI 缺陷（本轮产品码变更，均在 allowedPaths
        scripts/aih 内）：①main() 对单词命令（login）固定 shift 2 把 --username
        当 action 吞掉→改条件化 shift；②search 查询参数名 query 与服务端 keyword
        失配致过滤静默失效→改 keyword；③curl -D - 响应头 ETag 含尾部 \r 注入
        complete JSON 体致服务端 Jackson CTRL-CHAR 13 500→awk gsub 剥 \r；
        ④create 缺 DEC-011 必填 ownerTeamId/visibility 通道→补 --owner-team/
        --visibility 并前置校验；⑤版本语法 v 前缀非法→usage/提示对齐服务端 SemVer 契约。
      scenarioCategory: defect-fix
  notProven:
