  proven:
    - scenarioId: AC-P0B-JOB-001
      assertion: >-
        真实 Compose 栈上 POST /api/v1/assets 返回 201（修复前为 500 INTERNAL_ERROR），
        资产主链路恢复。脚本断言 "AC-P0B-JOB-001 asset create 201 (was 500)" PASS。
