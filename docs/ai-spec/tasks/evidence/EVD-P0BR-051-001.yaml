    - scenarioId: AC-P0B-JOB-001
      assertion: >-
        创建后 job_task 中 type='REPOSITORY_PROVISION' 的行数恰好 +1，
        且该行 asset_id 等于本次创建的 assetId（列/占位符/参数逐一对齐，参数未错位）。
      scenarioCategory: normal
    - scenarioId: AC-P0B-JOB-001
      assertion: >-
        任务行读取回实测：created_at 非空、updated_at 非空、row_version 为非负整数、
        payload 为 jsonb 且包含 assetId 键、principal_id 为真实 principal（prn_ 前缀）。
      scenarioCategory: normal
    - scenarioId: AC-P0B-JOB-001
      assertion: >-
        后端日志门禁 PASS：5 分钟内无 "column index is out of range"、
        无 "Can't infer the SQL type"（修复前每个创建请求都会产生前者）。
      scenarioCategory: normal
    - scenarioId: AC-P0B-JOB-001
      assertion: >-
        E2 静态门禁：JdbcJobRepositoryInsertSqlTest 从源码抽取 INSERT INTO job_task 的
        列清单与 VALUES 占位符，断言两者数量一致且列清单完整（2/2 通过）。
        负例对照：把 VALUES 占位符减为 15 时该测试失败并报
        "expected: 16 but was: 15"，证明门禁具备真实鉴别力。
      scenarioCategory: failure
    - scenarioId: AC-P0B-JOB-001
      assertion: >-
        E3 仓储回归测试：JdbcJobRepositoryIT 用真实 PostgreSQL 容器执行 insert 并读回
        全部绑定列、验证 claimNext 可领取且 principal/asset/trace 未错位、
        以 information_schema 断言 NOT NULL 无默认值列集合（3 项）。
      scenarioCategory: normal
    - scenarioId: AC-P0B-JOB-001
      assertion: >-
        权限未放宽的反证：TASK-P0BR-053 的 verify.ps1 V09 仍然 PASS——
        最小权限主体访问 /api/v1/system/jobs 返回 403 AUTH_PERMISSION_DENIED，
        修复插入语句未触及任务端点权限判定。
      scenarioCategory: denial
  notProven:
    - scenarioId: AC-P0B-UI-004
      assertion: >-
        「提交后回读资产详情，治理字段与所选 itemCode 一致」未闭环：
        GET /api/v1/assets/{id} 返回 500。根因已定位（见 E4 日志中的
        BadSqlGrammarException）：MyBatis-Plus 依 AssetModelEntity 的
        @TableField 注解（列名 precision 被 MySQL 风格反引号包裹）生成
        SELECT asset_id,framework,...,parameter_scale,`precision`,weight_format,... FROM asset_model，
        PostgreSQL 不认反引号，报 "syntax error at or near \",\" Position: 72"。
        该实体不在本卡 allowedPaths 内，且在 baseCommit 之前即存在，
        已作为独立既存缺陷另行上报，未在本卡内修复。
    - scenarioId: AC-P0B-UI-004
      assertion: >-
        「DATASET 类型资产经同一弹窗提交成功」未在本卡内单独执行：
        弹窗交互与受控字典项已由 EVD-P0BR-048-001（E4 浏览器证据）覆盖，
        本卡的 E4 取 REST 入口证明主链路（job_task 插入）恢复。
    - scenarioId: AC-P0B-JOB-001
      assertion: >-
        JdbcJobRepositoryIT / JdbcIdempotencyStoreIT 在本机执行时全部 Skipped：
        Testcontainers 无法连接本机 Docker（npipe 三种端点均返回 400 BadRequest），
        既存的 17 个 IT 同样全部 Skipped，属本机环境问题而非产品缺陷。
        本卡的 E4 结论由真实 Compose 栈独立取得，不依赖这些 IT。

