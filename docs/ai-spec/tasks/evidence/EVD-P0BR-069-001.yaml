        为该缺陷的浏览器级实证入口。处置：提请验证权威另立 backend 卡（updateMetadata
        契约对齐 + rename 别名唯一键路径 + 错误映射 4xx 化）；库内坏夹具
        ast_01m3qzgjehtr7fc54xncvz2ymv（display_name 被置 NULL）建议随该卡一并清理。
    - scenarioId: AC-P0B-UI-006
      assertion: >-
