        浏览器 PUT 为 page.route 桩（presign 主机 minio:9000 宿主机不可达，§3.1），
        桩响应形态与真实 MinIO 一致（200 + ETag 头 / ErrorResponse），仅替代浏览器
        不可达的最后一段网络；服务端会话/Parts 状态全程真实。
      scenarioCategory: normal
    - scenarioId: AC-P0B-UI-006
      assertion: >-
