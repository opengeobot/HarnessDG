        直连真实 PUT 在本 compose 部署形态不可达（minio:9000 未对宿主发布 +
        AIHUB_MINIO_PUBLIC_ENDPOINT/EXTERNAL_ENDPOINT env 名不匹配致 externalEndpoint 为空）。
      reason: >-
        属实现/配置缺陷，批准人已裁定另立 TASK-P0BR-070（契约优先：backend presign
        端点 + deploy env 接线），登记于 work-breakdown 预留行；本卡以「page.route 桩
        替代浏览器段 + 容器内真实 PUT + 服务端 ETag 核对」闭环字节入存，未为此放宽
        任何断言（卡 §3.3 诚实边界）。
    - scenarioId: AC-P0B-UI-006
      assertion: >-
        page-catalog PAGE-UPL-002 行为口径同步。
      reason: >-
        评估结论：PAGE-UPL-002 既有完成条件与本卡交付不冲突、无需改动（page-catalog
        在 allowedPaths 内但按「如口径需同步」条件性纳入）；如验证权威认为需登记
