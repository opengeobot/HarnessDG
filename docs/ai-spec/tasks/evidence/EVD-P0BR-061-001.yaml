coverage:
  proven:
    - scenarioId: AC-P0B-IAM-012
      assertion: >-
        V05j（E4）：创建/编辑/重置口令/禁用/启用各步均返回 200 且落库正确
        （PATCH 后 locale 落库 en-US；reset-password 后回到 PENDING_ACTIVATION +
        must_change_password=1）；
        audit_log 中 USER_CREATED / USER_UPDATED / USER_ENABLED / USER_DISABLED /
        USER_PASSWORD_RESET 五个事件计数均 >= 1（实测 1 / 5 / 14 / 10 / 24）；
        在仅剩 1 个持有 user:manage 的活跃管理员时禁用该管理员被拒，
        返回 COMMON_INVALID_ARGUMENT；
        拒绝路径产生独立提交的权威审计：
        USER_DISABLED/DENIED 且 error_code=COMMON_INVALID_ARGUMENT 且
        resource_id=该管理员 principalId 的行数 >= 1（实测 3），
        并使该事件的 DENIED 总计数相对拒绝前基线**恰好 +1**
        （脚本以基线差值取证，避免历史行让「>= 1」断言恒真）；
        被拒后管理员仍为 ACTIVE。
        临时口令绝不出现在审计正文（已断言命中数为 0）。
      scenarioCategory: denial
    - scenarioId: AC-P0B-IAM-008
      assertion: >-
        V05e（E4）：管理员禁用持有有效 access 的用户后——
        旧 access 的**下一次** /me 请求立即返回 401（不依赖 JWT 内旧状态）；
        该用户 refresh 刷新被拒；重新登录返回 403 AUTH_ACCOUNT_DISABLED；
        iam_user.status 落库为 DISABLED；
        audit_log 中 USER_DISABLED 计数 >= 1（实测 SUCCEEDED=10 / DENIED=3），
        使该场景的「状态和审计一致」子判据成立。
        另：目录还要求「凭据交换被拒」，该分支针对 Agent 主体；
        本场景被禁用主体是本地用户（不持有 Agent 凭据），
        故未在本场景内构造，由 AC-P0B-AGT-003 承载。
      scenarioCategory: denial

