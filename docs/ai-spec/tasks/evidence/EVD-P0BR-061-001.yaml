limitations:
  skippedTests:
    - >-
      本卡未 SKIP 任何场景：V05e、V05j 在真实栈上真实执行，修复前后均为真实运行结果。
    - >-
      Testcontainers 相关的 17 个 IT 在本机 Docker Desktop 29.x 下 Skipped（环境受限），
      属既存状态；本卡结论以 Compose 栈 E4 为准。
  assumptions:
    - >-
      「最后一个有效平台管理员」的判定取「持有 user:manage 且 status='ACTIVE' 的活跃主体数 <= 1」，
      与 REQ-IAM-006 的表述一致；判定在后端完成（非仅前端按钮隐藏）。
  environmentDifferences:
    - >-
      PowerShell 向 docker 传参会吞掉内层双引号，故 scopes 判定用
      jsonb_build_array('user:manage') 而非 '["user:manage"]'::jsonb（后者会退化为非法 JSON）；
      该修正属 verify.ps1 的 TASK-P0BR-058 交付物。
    - >-
      verify.sh 在本机因 core.autocrlf=true 呈 CRLF，容器内直接 bash -n 会报 $'\r'，
      故 E4 以 verify.ps1 在宿主执行为主；等价 E4 仍待补。

