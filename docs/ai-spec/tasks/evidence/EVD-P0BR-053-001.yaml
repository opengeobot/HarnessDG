limitations:
  skippedTests:
    - >-
      verify.sh 的 V12–V21 中 7 项 FAIL（见 notProven）。
      这些用例的函数体不在本卡 diff 内，失败源于脚本查询的列/表与当前 schema 漂移。
    - >-
      PreviewJobHandlerTest 的 2 项 CSV 失败与 Testcontainers 相关的
      17 个 IT Skipped 与本卡无关（本卡不改 backend）。
  assumptions:
    - >-
      脚本假设 bootstrap 管理员可登录且 Compose fixture 团队/组织已存在；
      V05b 会自动解除改密门，无需人工干预。
  environmentDifferences:
    - >-
      verify.ps1 原文件为 UTF-8 无 BOM，PS 5.1 会按 GBK(936) 解码，导致新增中文
      破坏字节对齐并报 "Unexpected token '}'"。本卡为其补 UTF-8 BOM
      （原文件靠既有中文「字节对偶合」侥幸通过解析），修复后 parse errors = 0。
      这是为使脚本可运行所必需的改动，未改变任何断言语义。
    - >-
      verify.sh 在本机因 core.autocrlf=true 呈 CRLF，直接 bash -n 会报 $'\r' 语法错误。
      此为仓库既有状态（未新增 .gitattributes），
      故 E4 取「LF 归一化副本 + 容器内真实执行」的方式取证，并在证据中明确该转换。
    - >-
      verify.sh 的 V09/V10 用例标题已由「默认拒绝」更新为「默认拒绝 + 有权限正向可达」，
      与 verify.ps1 保持一致（函数体此前已含正向断言）。

