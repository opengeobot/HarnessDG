coverage:
  proven:
    - scenarioId: AC-P0B-AUTH-003
      assertion: >-
        真实栈上 verify.ps1 的 V01–V11 全部 PASS（VERIFY_EXIT=0），
        其中 V06/V07/V09/V10/V11 的默认拒绝断言以最小权限主体返回
        403 且响应体 code == AUTH_PERMISSION_DENIED 为判据。
      scenarioCategory: denial
    - scenarioId: AC-P0B-AUTH-003
      assertion: >-
        匿名路径保持既有语义：所有被测端点无 Token 返回 401，
        且响应体 code 为 AUTH_UNAUTHENTICATED（脚本逐项校验错误码，不再只看状态码）。
      scenarioCategory: denial
    - scenarioId: AC-P0B-AUTH-003
      assertion: >-
        新增 V05b 前置条件用例：脚本先经 PUT /api/v1/me/password 解除管理员与最小权限主体的
        首登强制改密门，仅当两主体均不处于 PASSWORD_CHANGE_REQUIRED 时才继续；
        若前置条件未满足则报 FAIL 并给出可操作提示，绝不静默 SKIP、绝不冒充 PASS。
      scenarioCategory: normal
    - scenarioId: AC-P0B-AUTH-003
      assertion: >-
        负例对照（NEGCTRL）证明旧断言无鉴别力：以已完成首登改密的管理员令牌访问
        6 个受保护端点全部返回 200，即旧脚本「期望 403」必然 FAIL，
        其在此前栈上的 PASS 只能来自与权限无关的改密门 403（假阳性）。
      scenarioCategory: failure
    - scenarioId: AC-P0B-AUTH-003
      assertion: >-
        负例对照证明新命题成立：最小权限主体（scopes 仅 project:view）访问
        7 个受保护端点全部返回 403 且 code == AUTH_PERMISSION_DENIED。
      scenarioCategory: failure
    - scenarioId: AC-P0B-AUTH-004
      assertion: >-
        正向断言已补齐并 PASS：持有相应权限的主体调用 /api/v1/system/audit-logs、
        /metrics/summary、/dictionaries、/tags、/jobs、/notifications、/dependencies
        均返回 200 且返回真实数据（非空集合占位，实测 dataCount=8/1/1）。
        由此区分「默认拒绝」与「全部拒绝」。
      scenarioCategory: normal
    - scenarioId: AC-P0B-AUTH-004
      assertion: >-
        脚本反向自检：创建最小权限主体后断言其 scopes 不含
        audit:read/job:read/notification:read/system:observe/dictionary:read/tag:read，
        防止后续维护者误给该主体加权限而使拒绝断言失去意义。
      scenarioCategory: failure
    - scenarioId: AC-P0B-AUTH-003
      assertion: >-
        verify.sh 与 verify.ps1 语义等价：LF 归一化副本经 bash -n 语法校验通过
        （LF_SYNTAX_OK），并在 alpine:3.20 容器内真实执行，
        V01–V11 全部 PASS（含 V05b）。
      scenarioCategory: normal
  notProven:
    - scenarioId: AC-P0B-AUTH-003
      assertion: >-
        verify.sh 的 V12–V21 在容器内真实执行时有 7 项 FAIL
        （V12 资产创建与 Gitea 一致性、V13 幂等键重放、V14 多组织隔离、
        V16 版本 Schema、V17 发布审批 Schema、V20 对账 Worker）。
        经 git diff 逐块核对，这些用例的函数体不在本卡改动范围内，
        失败原因是脚本查询的列/表与当前 schema 漂移
        （例如 job_task.idempotency_key、job_task.job_type、resource_acl 关键字段、
        asset_version/publish_request 关键字段），属既存缺陷，另行上报。
        verify.ps1 目前只覆盖 V01–V11，故不受影响。
    - scenarioId: AC-P0B-AUTH-003
      assertion: >-
        E2/E4「脚本被误改为只比较状态码时用例必须失败」未以自动化回归门禁固化：
        本次以负例对照（NEGCTRL-1/2）人工取证，未新增独立测试文件。
        固化该类门禁需要新增脚本测试脚手架，超出本卡 allowedPaths 与范围。
    - scenarioId: AC-P0B-AUTH-003
      assertion: >-
        V12–V21 未纳入 verify.ps1（PowerShell 版只到 V11），
        两脚本覆盖范围仍不对等。补齐 PowerShell 版属独立整改，不在本卡范围。
    - scenarioId: AC-P0B-AUTH-004
      assertion: >-
        正向断言使用管理员令牌（经 ADMIN 角色合法持有相应权限），
        未逐一验证「角色绑定→权限码」的解析路径本身；
        该解析已由既有 AuthorizationLifecycleIT 覆盖（本机 Skipped）。

