        （详见 EVD-P0BR-058-001.yaml，V05c）
      scenarioCategory: normal
    - scenarioId: AC-P0B-IAM-003
      assertion: >-
        首登强制改密全链：改密门拦截 → 改密 → 临时口令失效 → force-change 清除 → 审计
        （详见 EVD-P0BR-058-001.yaml，V05c）
      scenarioCategory: normal
    - scenarioId: AC-P0B-IAM-004
      assertion: >-
        失败登录防枚举：同错误码 AUTH_INVALID_CREDENTIALS + 归一化后同响应体形状
        （详见 EVD-P0BR-058-001.yaml，V05c）
      scenarioCategory: denial
    - scenarioId: AC-P0B-IAM-006
      assertion: >-
        access/refresh 同时轮换、旧 jti 标记 ROTATED、新 Cookie 属性、Family 内 ACTIVE 恰为 1
        （详见 EVD-P0BR-058-001.yaml，V05d）
      scenarioCategory: normal
    - scenarioId: AC-P0B-IAM-009
      assertion: >-
        登出清除 Cookie、Family 整族吊销、重用被拒、重复登出幂等
        （详见 EVD-P0BR-058-001.yaml，V05f）
      scenarioCategory: normal
    - scenarioId: AC-P0B-IAM-005
      assertion: >-
        连续 5 次错误口令后第 5 次为 423 AUTH_ACCOUNT_LOCKED、status=LOCKED 且
        locked_until 非空、锁定期间正确口令也被拒、AUTH_LOGIN_FAILED 审计落库
        （详见 EVD-P0BR-058-001.yaml，V05h；根因与修复见 EVD-P0BR-059-001.yaml）
      scenarioCategory: failure
    - scenarioId: AC-P0B-IAM-007
      assertion: >-
        重用已轮换 refresh → 401 AUTH_REFRESH_REPLAYED、该 Family ACTIVE 降为 0、
        轮换出的新 refresh 亦失效、AUTH_TOKEN_REPLAY_REJECTED 审计落库
        （详见 EVD-P0BR-058-001.yaml，V05g；根因与修复见 EVD-P0BR-060-001.yaml）
      scenarioCategory: denial
    - scenarioId: AC-P0B-IAM-008
      assertion: >-
        禁用后旧 access 下一请求即 401、refresh 被拒、重新登录 403 AUTH_ACCOUNT_DISABLED、
        iam_user.status 落库 DISABLED、USER_DISABLED 审计存在（状态与审计一致）
        （详见 EVD-P0BR-058-001.yaml，V05e；审计落点见 EVD-P0BR-061-001.yaml）
      scenarioCategory: denial
    - scenarioId: AC-P0B-IAM-011
      assertion: >-
        同一 refresh JWT 两路真实并发只允许 1 次成功、失败方为 AUTH_REFRESH_REPLAYED、
        该 Family ACTIVE 降为 0（无双有效 Token）
        （详见 EVD-P0BR-058-001.yaml，V05i；根因与修复见 EVD-P0BR-060-001.yaml）
      scenarioCategory: concurrency
    - scenarioId: AC-P0B-IAM-012
      assertion: >-
        创建/编辑/重置/禁用/启用各步落库与错误码正确、五类 USER_* 审计均落库、
        不能禁用最后一个有效平台管理员（COMMON_INVALID_ARGUMENT + 拒绝审计）
        （详见 EVD-P0BR-058-001.yaml，V05j；根因与修复见 EVD-P0BR-061-001.yaml）
      scenarioCategory: denial
