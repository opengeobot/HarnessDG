        （内容与 AssetCard 渲染一致：schemaVersion: aihub/v1 / kind: Model / metadata / spec）；
        A6 README 已被资产卡片覆盖（157 字节，含资产名，不再等于 Gitea 的 auto_init 默认内容）；
        A7/A8 attempt 记录数与 attempt_no 唯一数一致且存在 SUCCESS 的 attempt。
        场景 B（依赖恢复后自行成功）：B0 以 docker pause 注入真实故障且确认 state=paused；
        B1 停机期间资产登记仍 201（接受意图，不阻塞 HTTP）；B2 落入 RETRY_WAIT 且 attempts>=1；
        B3 error_code=ASSET_REPOSITORY_PROVISION_FAILED（可重试码）；
        B4 退避间隔 1994ms 落在 full jitter 区间 [1000, 2000]（attempt=1，与 BackoffCalculator 闭式一致）；
        B5 unpause 后 API 就绪；B6 **无人工干预自行 SUCCEEDED** 且 provisioning_status=COMPLETED；
        B7 恢复后 asset.yaml 真实落库（200）；B8 attempt_no 无重复（INV-JOB-005）；
        B9 全部历史失败均为可重试码。
        场景 C（建仓幂等）：C1/C2 首次建仓 SUCCEEDED；
        C3 在「Gitea 已有仓库但本地状态退回 PENDING 且 repo_full_name 已清空」的真实重试现场下
        重跑仍收敛为 SUCCEEDED；
        C3b 复用日志计数由 1 增至 2，证明确实走了「已存在即复用」分支而非 Handler 的幂等短路；
        C4 复用同一仓库引用；C5/C5b 该全名仓库按名可读且搜索仅命中一条，未产生第二个仓库。
      scenarioCategory: normal
    - scenarioId: AC-P0B-JOB-003
      assertion: >-
        判别力反向对照（同一测试类、同一夹具，仅把 writeFile 恢复为缺陷形态后重跑）：
        缺陷形态下 16 项中 9 项失败（2 Failures + 7 Errors），其中 FileWriteVerb 全 3 项失败；
        恢复修复实现后 18/18 全 PASS。该对照证明「新建走 POST / 更新走 PUT 且带 sha」与
        「不以 %2F 编码」等断言确实能判别本卡的缺陷，而不是恒真。
        对照原始输出：.trae/evidence/gitea-062-BASELINE-upsert.txt；早前 URL 编码切片的对照见
        .trae/evidence/gitea-062-BASELINE.txt（缺陷态 7/13 报错）。
