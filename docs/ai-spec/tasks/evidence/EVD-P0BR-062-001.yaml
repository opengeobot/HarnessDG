limitations:
  skippedTests:
    - >-
      PreviewJobHandlerTest 2 项 CSV 解析失败（csvExceedingFiftyColumnsShouldMarkColumnTruncated:135、
      csvMixedQuotedAndUnquoted:278）为既存缺陷：已提交的 EVD-P0BR-049-001（基线 3b527e0）
      的 limitations 与 environmentDifferences 中已记录同一对失败，本卡未触碰 preview/CSV 相关代码。
    - >-
      verify 中的 6 项 Skipped 为既存跳过（依赖不可用的条件跳过），与本卡无关；
      本卡新增的 18 项均为真实运行，无 SKIP。
  assumptions:
    - >-
      「一次尝试内最多 4 次串行 HTTP 调用」是超时上界推导的依据（建组织仓库 → 回退用户仓库 →
      读 sha + 写 asset.yaml → 读 sha + 覆盖 README）。若后续在 provision 内增加调用，
      必须同步复核 4 × readTimeoutMillis < lease-seconds 这一不等式。
    - >-
      E4 中 repo_full_name 落在服务账号用户名下（aihub-svc/<name>）是当前 Compose 基线的正常结果：
      namespace 不是 Gitea 组织，故走既有回退分支；这不影响本卡要验证的写路径正确性。
  environmentDifferences:
    - >-
      **取证过程中发现并修复的第 4 个缺陷（无界调用）**：Gitea RestClient 原先未设置任何超时，
      Gitea 处于 pause 状态时单次尝试阻塞 122717ms（超过 60s 租约），导致租约到期后被第二个
      Worker 重新领取并重复执行，进而抛出 ASSET_CONCURRENT_MODIFICATION 伪冲突
      （实测 job_attempt 记录 attempt #1 dur=122717ms，随后出现 ConflictException）。
      修复后同一场景单次尝试耗时为 20095ms，且 ASSET_CONCURRENT_MODIFICATION 不再出现。
      该缺陷不在原卡 §2 记录的四条事实之内，是 E4 取证暴露的关联缺陷，
      与「使 AC-P0B-JOB-003 可达」直接相关，故一并修复并在此如实登记。
    - >-
      **首次 E4 误判的成因（已排除，非产品缺陷）**：docker compose build backend 不会重建
      worker 目标，导致 aihub-worker:latest 为过期镜像（比 backend 早 1 小时），
      运行中的 Worker 仍是修复前代码，表现为「首个 attempt 必然失败、第二次才成功」。
      以 `build backend worker` 同时重建后消失。此处记录以免后续复现时误判为产品缺陷。
    - >-
      E4 脚本以 docker pause 注入故障（而非 stop）：pause 保留 TCP 监听，
      是最严苛的「依赖无响应」形态，正好用于验证超时上界；早期以 docker compose start 恢复
      会重新解析 depends_on 并等待健康检查而阻塞，故改为 docker unpause。
    - >-
      Gitea 的 contents 接口语义经实测确立：PUT 无论文件是否存在都要求 sha
      （缺失返回 422 {"message":"[SHA]: Required"}），POST 不带 sha 新建返回 201、
      对已存在路径返回 409。本卡据此实现 upsert，并以单测固化。
    - >-
      E4 脚本 wget 取证的两个坑已修正并注释：`-O -` 直接作为 PowerShell 参数会与
      -OutVariable/-OutBuffer 二义性冲突（须整体交给容器内 sh -c）；
      `wget -S` 的响应头走 stderr，与 `2>&1` 交织会打断 >1KB 的响应体，
      故状态码与响应体必须分两次取（前者 -O /dev/null，后者不带 -S）。

