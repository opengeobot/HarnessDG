        D3 worker 容器 printenv AIHUB_GITEA_ENABLED=true；
        D4 运行日志出现真实 Gitea 调用痕迹（falling back to user repo creation /
        gitea repository already exists / repository provisioned successfully），
        证明生效实现是 GiteaAssetRepositoryProvisioner 而不是 Noop 静默成功。
        另以「Gitea 容器内直连 API 读到真实 asset.yaml 内容」作为写路径确实生效的独立证据（A4/A5），
