coverage:
  proven:
    - scenarioId: AC-P0B-JOB-002
      assertion: >-
        E4（.trae/evidence/job-e4-023.txt，真实 Compose 栈）：
        A1 停掉 worker 后创建资产，任务稳定停在 PENDING（证明无裸线程抢跑，可靠工作只经 job_task）；
        A2 pause Gitea 使 Handler 阻塞在真实 HTTP 调用上，worker 领取后进入 RUNNING 且
        attempts=1；此时 docker kill 强杀 worker，任务仍停在 RUNNING（无优雅收尾），
        且强杀瞬间 attempt 行数为 0（该记录由恢复方补写而非事前写入）；
        A3 租约到期后由新 worker 重新领取，任务在无人工干预下最终 SUCCEEDED；
        A4 被强杀的尝试被补记为 JOB_LEASE_EXPIRED 且 attempt_no 无重复（INV-JOB-005）；
        A5 资产 provisioning_status=COMPLETED 且仅绑定一个仓库引用（Handler 幂等，未产生第二个仓库）。
      scenarioCategory: recovery
    - scenarioId: AC-P0B-JOB-003
      assertion: >-
        E4（同一次运行）：B1 停用 Gitea 后创建资产，任务进入 RETRY_WAIT（而非 DEAD）、
        attempts>=1，退避间隔 1803ms 落在 full jitter 区间 [1000, 2000]
        （与 BackoffCalculator 的 min(base*2^(attempt-1), cap) 闭式一致），
        attempt 行的 errorCode=ASSET_REPOSITORY_PROVISION_FAILED（可重试码）；
        B2 历史尝试在时间上互不重叠（同一租约内无并发执行）；
        B3 恢复 Gitea 后任务无人工重试自行 SUCCEEDED，attempt_no 递增至 3 且存在 SUCCESS 的 attempt。
        C1 场景（失败路径/调度自愈）：stop postgres 保持 8 秒覆盖至少一个 tick，
        worker 全程不重启；观察到 job worker tick failed 日志（证明故障确实被注入），
        postgres 恢复后 worker 仍能领取并成功处理新任务 —— 排除
        「tick 异常逸出导致 ScheduledThreadPoolExecutor 静默取消周期任务、Worker 永久停摆」这一失效模式。
      scenarioCategory: recovery
    - scenarioId: AC-P0B-JOB-003
      assertion: >-
        判别力反向对照（本卡实施前的 c6b9e2c 之前基线，同一 E4 脚本、同一真实栈）：
        当时 8 项 FAIL —— A3 任务最终 DEAD（attempts=5/5）、A5 provisioning=FAILED 且 repo 为空、
        B2 并发重叠查询报 SQL 语法错、B3 依赖恢复后仍 DEAD 且无 SUCCESS attempt、
        C1 未观察到 tick 异常且恢复后新任务 DEAD。
        其根因是 Gitea 写路径缺陷（TASK-P0BR-062）使建仓必然失败、重试恒 409，
        而非本卡的租约与退避逻辑。
        062 提交后重跑同一脚本：上述 8 项全部转为 PASS（RESULT: ALL PASS → 后续因新增
        trace 断言为 1 FAILED）。该对照证明本卡断言确实能判别租约恢复与退避重试的真实行为。
        对照原始输出：.trae/evidence/job-e4-023.txt 的历史运行记录。
      scenarioCategory: failure
    - scenarioId: AC-P0B-JOB-003
      assertion: >-
        **trace 子判据回栈复验（TASK-P0BR-063 落地后，原 notProven 项撤销）**：
        063 把 trace 填充收敛到 JobApplicationService.enqueue（显式 > 共享
        PrincipalContext > 32-hex 兜底生成），AssetApplicationService 建仓任务改经
        enqueue 入队。以 063 实施后镜像重跑本卡 E4（023 覆盖，租约 45s）：
        28/28 断言 ALL PASS；「A4 attempt 与任务的 trace_id 均已填充（非空洞一致）」
        由上次的 FAIL(populatedRows=0) 转 PASS(populatedRows=2)，
        两条 attempt（JOB_LEASE_EXPIRED 补记与 SUCCESS）均携带同一 trace。
        063 独立取证 trace-e4-063.ps1 另证：注入 traceparent 时
        job_task.trace_id 等于该值、未注入时等于响应 X-Trace-Id（32-hex）、
        VERSION_PUBLISH 审批路径同样贯通、Outbox 事件携带同一 trace。
      scenarioCategory: recovery
  notProven: []

