limitations:
  skippedTests:
    - >-
      后端全量 verify 的 2 项 PreviewJobHandlerTest CSV 解析失败为既存缺陷，
      已在已提交的 EVD-P0BR-049-001 中记录同一对失败，本卡未触碰 preview/CSV 代码。
    - >-
      JdbcJobRepositoryIT 依赖 Testcontainers 真实 PostgreSQL。本机 Docker 29.x 需
      -Dapi.version=1.44 并预拉取 postgres:17-alpine 与 testcontainers/ryuk:0.11.0，
      否则会因 API 版本协商失败而报错（非 SKIP）。本卡 E3 以此方式真实运行。
  assumptions:
    - >-
      「租约时长必须显著大于单次 Handler 最大执行时间」是本卡租约恢复语义的前提。
      TASK-P0BR-062 已为 Gitea 调用施加有界超时（连接 3s / 读取 10s，最坏 4×10s=40s），
      故 E4 覆盖把租约设为 45s 以满足该不等式；若部署时调大读取超时或调小租约，
      必须同步复核该不等式，否则会退化为「尝试跨越租约 → 重复领取」。
    - >-
      E4 覆盖把 backend 的 AIHUB_JOB_WORKER_ENABLED 置为 false、仅 worker 置 true，
      以便确定性地控制「哪一个容器领取任务」。这是取证脚手架的环境变量覆盖，
      不改变交付基线 compose.yaml（backend 与 worker 均默认启用 Worker）。
  environmentDifferences:
    - >-
      本卡 E4 的 8 项原失败并非本卡逻辑缺陷：其根因是 TASK-P0BR-062 所修复的
      Gitea 写路径缺陷（URL 编码、建仓非幂等、contents 写入动词），
      使建仓必然失败且重试恒 409，任务只能走向 DEAD。
      062 提交（c6b9e2c）后同一脚本的 A3/A5/B2/B3/C1 由 FAIL 转 PASS。
      故此处的「修复前」数据必须与本卡自身的租约/退避改动区分开，不得记为「本卡引入」。
    - >-
      取证脚本自身的三个测量缺陷已修正并在脚本内注释，以免后续复现时误判为产品缺陷：
      (1) 脚本文件为双 BOM 导致 `$ErrorActionPreference` 解析失败；
      (2) 退避断言原取「此刻剩余倒计时」这一瞬时值，会被下一次 tick 重新领取覆盖而读到负值，
          已改为断言与采样时机无关的 full jitter 区间；
      (3) 场景 C 原用 docker restart 注入故障，停机窗口常小于一个 tick 致故障未被注入，
          已改为 stop + 显式保持 8 秒。
    - >-
      本卡 E4 断言曾存在一处**空洞通过**：原先只断言
      `a.trace_id IS DISTINCT FROM j.trace_id` 的失配数为 0，而
      `NULL IS DISTINCT FROM NULL` 为 false，故「两侧都为 NULL」也判为 PASS，
      掩盖了 trace 未填充的真实缺陷。已补充「trace_id 必须已填充」的独立断言使其显式失败。
      此处记录以免后续把空洞一致误读为满足。

