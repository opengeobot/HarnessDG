coverage:
  proven:
    - scenarioId: AC-P0B-UI-004
      assertion: >-
        真实栈上登记 MODEL 资产后 GET /api/v1/assets/{id} 返回 200（修复前为 500），
        且 model.framework=PYTORCH、model.task=TEXT_GENERATION、
        model.architecture=TRANSFORMER、license=APACHE_2_0 与提交值逐一一致。
      scenarioCategory: normal
    - scenarioId: AC-P0B-UI-004
      assertion: >-
        DATASET 资产详情同样返回 200，dataset.format=JSONL、dataset.modality=TEXT
        与提交值一致——证明修复未只覆盖 MODEL 分支。
      scenarioCategory: normal
    - scenarioId: AC-P0B-UI-004
      assertion: >-
        未知 assetId 返回 404 ASSET_NOT_FOUND 而非 500，
        证明修复未把语法错误换成另一种错误语义，既有 NOT_FOUND 契约保持。
      scenarioCategory: failure
    - scenarioId: AC-P0B-UI-004
      assertion: >-
        后端日志门禁 PASS：3 分钟内无 "syntax error at or near"。
        修复前每次详情读取都会产生该 BadSqlGrammarException。
      scenarioCategory: normal
    - scenarioId: AC-P0B-UI-004
      assertion: >-
        以与 MyBatis-Plus 生成的完全相同的裸列名清单
        （asset_id,framework,task,architecture,parameter_scale,precision,weight_format,
        runtime,known_risks,usage_restrictions,sensitivity_code）在真实 PostgreSQL
        上执行查询成功，其中 precision 为裸列名。
      scenarioCategory: normal
    - scenarioId: AC-P0B-UI-004
      assertion: >-
        负例对照（SQL 层）：以反引号包裹 precision 的同一查询被 PostgreSQL 拒绝并报
        syntax error——与修复前 MyBatis-Plus 生成的语句行为一致，
        证明病因定位准确且裸列名是正确解法。
      scenarioCategory: failure
    - scenarioId: AC-P0B-UI-004
      assertion: >-
        E2 静态门禁 AssetEntityColumnEscapingTest 3/3 通过：
        扫描 asset/infrastructure 下全部实体，断言 @TableField/@TableName/@TableId
        的值不含反引号、且均为小写下划线裸列名。
        负例对照：把 @TableField("precision") 改回 @TableField("`precision`") 后
        3/3 失败并精确报出 "AssetModelEntity.java -> `precision`"；恢复后 3/3 通过。
      scenarioCategory: failure
  notProven:
    - scenarioId: AC-P0B-UI-004
      assertion: >-
        「详情回读的 precision 字段与提交值一致」无法断言：createAsset 的请求契约
        （CreateAssetRequest.ModelInput）只接受 framework/task/architecture，
        未声明 precision 输入，因此该列在创建时不会被写入。
