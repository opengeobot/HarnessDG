limitations:
  skippedTests:
    - >-
      JdbcIdempotencyStoreIT（5 项）与既存 17 个 IT 在本机全部 Skipped：
      Testcontainers 无法连接本机 Docker Desktop（npipe 端点 400 BadRequest）。
    - >-
      PreviewJobHandlerTest 的 2 项 CSV 失败在 baseCommit 之前即存在，与本卡无关。
  assumptions:
    - >-
      存量 principal_id 处理：迁移前在本地 Compose 栈清点为
      total=15, null_principal=0（无 NULL 行），故回填语句实际未影响任何行。
      该清点是环境相关的，**不能推广到其它环境**；
      V26 仍保留了回填语句，使存在 NULL 行的旧库在升级时保持一致语义
      （PostgreSQL 唯一索引把 NULL 视为互不相等，若不回填，
      这些行将既不受新约束保护、也无法被按主体查询命中）。
    - >-
      选择回填哨兵值 '<legacy-unattributed>' 而非保留 NULL：
      哨兵值使历史行参与作用域唯一性判断且可被显式查询，
      避免出现「存在但不可见」的幂等记录。该取值不可与真实 principalId 冲突
      （平台 principalId 均形如 prn_<ulid>）。
  environmentDifferences:
    - >-
      V26 的文件头注释使用 /* */ 块注释（与 V25 一致），
      而非 SQL 的 -- 行注释，以符合仓库既有迁移文件风格。
    - >-
      迁移在既有库上执行（V25 已应用），验证的是升级路径；
      空库路径未在本卡内实测（见 notProven）。

