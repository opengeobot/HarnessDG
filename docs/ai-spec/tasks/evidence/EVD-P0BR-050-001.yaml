coverage:
  proven:
    - scenarioId: AC-P0B-UI-006
      assertion: >-
        E4（Chromium，5 例 discoverability）：① 具备 authorization:read 的管理主体展开侧边导航后
        「角色绑定」「资源 ACL」入口可见，点击后 URL 分别到达 /admin/role-bindings 与
        /admin/resource-acls，且 .ant-table 渲染、无 .ant-result-error；
        ② 具备 project:view 的资产主体可见「团队管理」入口，点击到达 /admin/teams，
        无路由参数时展示组织选择提示且不出现 404 文案；
        ③ 不具备 authorization:read 的主体看不到两个授权类入口（同时以可见的「团队管理」为锚，
        证明菜单确实展开，避免断言空洞成立），直接访问 /admin/role-bindings 展示拒绝文案，
        且以该主体独立 API 会话直连 /system/role-bindings 返回 403；
        ④ 不具备 project:view 的主体看不到「团队管理」，但具备 authorization:read 时
        「角色绑定」仍可见（证明是逐项按 Scope 过滤，而非整体开关）；
        ⑤ 从资产目录点入详情后点击版本列表「查看全部」，URL 到达
        /assets/<assetId>/versions 且不出现全局 404 文案、.ant-table 可见。
        另 E2（Vitest，8 例 navigation.test）：以真实 router.routes 与 NAV_ITEMS 断言
        三个新入口存在且 Scope 正确、每个导航叶子路径都有非空 Scope、无重复导航路径、
        全部导航叶子路径均已在路由表注册（累积父前缀还原完整路径）、
        /assets/:assetId/versions 与 /assets/:assetId/versions/:versionId 均已注册且 /* 兜底仍在。
      scenarioCategory: normal
    - scenarioId: AC-P0B-UI-006
      assertion: >-
        E4（denial）：无 authorization:read 的主体在 UI 上被 RouteGuard 拒绝展示，
        同时后端独立拒绝（直连 REST 返回 403）——
        证明前端过滤不作为安全边界，UI 与后端两层判定均生效。
        另 E2（Vitest）：RoleBindingsPage/ResourceAclsPage 的受控字段断言
        （#roleId/#scopeType/#resourceType/#permissionCodes 均为 combobox 且不出现在文本框集合中）
        排除了用自由文本提交受控值的退化形态。
      scenarioCategory: denial
    - scenarioId: AC-P0B-UI-003
      assertion: >-
        E4（Chromium，7 例 admin-states）：在真实栈上以 HTTP 边界注入制造确定性状态——
        角色绑定页：延迟注入下 .ant-skeleton 可见（Loading）；空数组响应下展示
        「暂无角色绑定」且无错误态（Empty）；500 响应下展示「加载失败」与「重试」按钮，
        解除注入后点击重试命中真实后端并渲染出数据行（Error → Retry → Success）；
        资源 ACL 页：Empty 同上；Error → 解除注入 → 重试后 .ant-table 可见且无错误态；
        版本列表页：延迟注入下展示骨架，解除后进入 .ant-table（Success）；
        Error 态下解除注入点击重试后恢复 .ant-table。
        另 E2（Vitest，13 例）：RoleBindingsPage 6 例、ResourceAclsPage 6 例覆盖
        Success/Empty/Error+Retry/Loading/受控字段/PLATFORM 提交 null，
        TeamsPage 新增 1 例覆盖「导航直入时展示组织选择器并选定后加载列表」。
      scenarioCategory: recovery

