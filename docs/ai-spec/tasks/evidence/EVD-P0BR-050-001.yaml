limitations:
  skippedTests:
    - >-
      本卡未 SKIP 任何场景：28 例 Playwright 全部真实执行并通过；未提供凭据时的 skip 分支
      在本次取证中未触发（凭据已由运行环境注入）。
    - >-
      Testcontainers 相关的后端 IT 本机 Skip 属既存状态，与本卡前端结论无关，本卡不以其为依据。
  assumptions:
    - >-
      「可发现」判定取「侧边导航中该入口对具备相应 Scope 的主体可见，且点击后到达已注册路由并
      渲染出列表容器」；不要求列表非空（空数据是合法的 Empty 态）。
    - >-
      资源 ACL 页面的资源类型仅暴露 ASSET：AuthorizationService.isResourcePermitted 的生产调用方
      按 ASSET 校验，未列出的取值即使入库也不产生授权效果，故不作为可选项暴露。
  environmentDifferences:
    - >-
      【既有缺陷，本卡未处置】前端容器 frontend/nginx/default.conf 的 `location /assets/`
      静态资源规则遮蔽了 SPA 路由：实测 GET /assets => 301 且 Location 为
      http://localhost/assets/（丢失 8080 端口），GET /assets/ => 403，
      GET /assets/<assetId> => 404；而 GET /admin/role-bindings => 200 正常。
      后果是资产目录与详情的整页加载/深链在 Compose 网关下不可用。
      该文件不在本卡 allowedPaths 内（本卡仅允许 frontend/e2e 与列明的 frontend/src 路径），
      且属基础设施配置而非页面可发现性范围，故本卡不修改。
      本卡的 E2E 因此统一经侧边导航进入资产目录与详情（走用户在应用内真实可行的路径），
      该缺陷未被掩盖、未被记为 PASS，需另立任务修复。
    - >-
      Playwright 默认 baseURL 已改为 Compose 网关 http://localhost:8080（被测物为构建产物，
      与 verify 的 E4 入口一致），可由 E2E_BASE_URL 覆盖为 dev server。
    - >-
      antd 会在仅两个中文字符的按钮文案间插入空格（「重试」渲染为「重 试」），
      故测试定位器使用允许空白的正则；这是定位器修正，不是断言放宽。
    - >-
      page.request 不复用浏览器内存中的 access Token（与架构要求的「JWT 只存内存」一致），
      故需要后端独立拒绝的断言改用独立 API 会话重新取证。
    - >-
      【既存本机抖动，与本卡无关】本机全量 `pnpm test` 会随机出现 1–2 个「文件首个用例
      5000ms 超时」失败，失败文件每次不同（含本卡从未触碰的 AuditLogsPage、DiscussionPanel）。
      已用 `git stash push -u` 把本卡全部改动暂存后跑基线复现：基线同样失败
      （DiscussionPanel + AssetsPage，2 failed / 56 passed），
      故该抖动先于本卡存在，非本卡引入；单文件运行与 `src/features/admin`、`src/app`
      子集运行均稳定全绿（本卡新增的 20 例在其中）。
      本卡结论不依赖该不稳定的全量运行结果。

