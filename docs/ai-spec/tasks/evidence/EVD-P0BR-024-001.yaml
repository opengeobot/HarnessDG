coverage:
  proven:
    - scenarioId: AC-P0B-JOB-004
      assertion: >-
        E4-S1（真实 Compose 栈，job-e4-024.ps1）：停用 Gitea 后创建资产，任务经
        5 次真实尝试（指数退避 1s/2s 受控配置）进入 DEAD 且 error_code 落库；
        job_attempt 存在 DEAD 行；JOB_DEAD 审计（audit_log）、JOB_DEAD 站内通知
        （notification，参数含 jobId）、JOB_DEAD 告警（system_alert FIRING）三条渠道
        各自可查；此后 15s 内 attempts 与 attempt 行数均不再增长（终态冻结、无无限重试）。
      scenarioCategory: failure
    - scenarioId: AC-P0B-JOB-004
      assertion: >-
        E4-S2a（重试预算语义，固定为「不重置」）：SQL 置备一个 attempts=5/max=5 的
        DEAD 任务（未知 Handler 类型——确定性即时失败、无外部依赖竞态）。
        REST retry 返回 200 且产生 JOB_MANUALLY_RETRIED 审计；worker 真实执行一次
        （该任务上的 JOB_DEAD 审计与 attempt(DEAD/JOB_HANDLER_NOT_FOUND) 行只能由执行写入，
        置备阶段 worker 从未领取过它）；随后立即再 DEAD 且 attempts 仍为 5——
        claim 封顶（CASE WHEN attempts < max THEN attempts+1 ELSE attempts）+ 不重置，
        「人工重试不发放新预算」成为可观察事实（理由与替代方案见卡 §7 retryJob javadoc）。
      scenarioCategory: boundary
    - scenarioId: AC-P0B-JOB-004
      assertion: >-
        E4-S2b（恢复与告警回落）：恢复 Gitea 与 worker 后对 S1 的 DEAD 任务
        （夹具显式给予新预算，与预算语义解耦）REST retry → 任务重新执行至 SUCCEEDED；
        S1 触发的那条 FIRING 告警行本身转为 RESOLVED（行级对照，不受历史行干扰）。
      scenarioCategory: recovery
    - scenarioId: AC-P0B-JOB-005
      assertion: >-
        E4-S3（越权与前置条件）：READER 角色主体（无 job:manage）对 PENDING 任务
        调用 :retry 与 :cancel 均 403，任务状态不变且零成功类审计（拒绝不改变状态码、
        不因新增审计而放宽）；有 job:manage 的 admin 取消成功 → CANCELLED +
        JOB_MANUALLY_CANCELLED 审计恰一条；同 Idempotency-Key 重复取消返回缓存 200、
        不产生第二次迁移或重复审计；CANCELLED 上 retry 与 SUCCEEDED 上 cancel 均 409；
        不存在的任务 :retry/:cancel 均 404 且不泄漏、不写成功审计。
      scenarioCategory: unauthorized
    - scenarioId: AC-P0B-JOB-005
      assertion: >-
        判别力反向对照（缺陷基线）：临时移除三处审计落点（JobWorker.auditJobDead、
        retryJob/cancelJob 的 auditPort.record）后重建镜像复跑同一 E4 脚本 -> 5 FAILED
        （S1 JOB_DEAD 审计缺失、S2a 两项、S2b RESOLVED 前值异常、S3 取消审计缺失）；
        恢复修复形态后 20/20 ALL PASS。E2 同法验证：ManualOpsTest 3/5 FAIL、
        JobWorkerTest 2/16 FAIL（仅审计相关项）。审计断言非空洞通过。
      scenarioCategory: failure
    - scenarioId: AC-P0B-JOB-004
      assertion: >-
        E2（JobWorkerTest 16 项、JobApplicationServiceManualOpsTest 5 项）：
        DEAD 两分支（无 Handler / 重试预算耗尽）审计与迁移、attempt 同事务执行单元；
        可重试失败（RETRY_WAIT）不产生 JOB_DEAD 审计；拒绝路径（404/409）零审计；
        审计摘要含 budgetReset=false 显式事实；actor 取自共享 PrincipalContext。
      scenarioCategory: happy
  notProven: []

