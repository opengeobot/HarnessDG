limitations:
  skippedTests:
    - >-
      后端全量 verify 的 2 项失败均与本卡无关：(1) AssetCatalogIT 的
      @SpringBootConfiguration 向上搜索缺陷（既有 16 个 IT 的共性问题，已登记独立治理任务）；
      (2) AssetFacetConsistencyIT 在全量运行中 1 项 facet 计数断言失败（expected 1 got 2），
      单独复跑 9/9 PASS——该 IT 与本卡 E4 共用本机 Docker 引擎的 Testcontainers 资源，
      判定为并发/数据污染型 flake，非本卡引入（本卡未触碰 facet/search SQL）。
    - >-
      PreviewJobHandlerTest 的 2 项既存 CSV 失败本轮全量运行未复现（本轮该套件 PASS）；
      该对失败在 023/062 轮次出现，属 flaky 既存项，与本卡无关。
  assumptions:
    - >-
      VERSION_PUBLISH 的 publish_request 行由 SQL 置备（提交入口的 asset:write
      权限码缺陷另立任务，§2 事实 8）；被测路径 submitDecision → enqueue → trace 填充
      仍由真实 HTTP 审批请求触发，不影响本卡 AC 的成立。
  environmentDifferences:
    - >-
      trace-e4-063 在交付基线（无 023 覆盖）上运行：租约 60s、backend 与 worker 均启用
      Worker，与 023 的取证覆盖不同；023 回栈复验则在 023 覆盖下运行。两种配置的
      分工是「trace 语义用生产配置验证、租约时序用压缩配置观察」。
    - >-
      E4 期间发现并（经用户批准）一并修复：PublishApplicationService.submitDecision 的
      APPROVE/REJECT 分支以 Instant.now() 作为 JdbcTemplate 参数，PG JDBC 无法推断类型
      → 审批接口在真实栈上必然 500（首跑 T3 三项 FAIL 的根因）。修复为 SQL now() 后
      T3 转 PASS。同型缺陷在 PublishJobHandler（4 处）与 PhysicalRecycleJobHandler（1 处）
      仍存在——不在本卡 allowedPaths，连同 asset:write 权限码缺陷一并登记后续任务。
    - PowerShell 5.1 需要脚本文件带 UTF-8 BOM（首轮曾因无 BOM 把中文注释按 ANSI 误读
      导致解析错误；Add-Type System.Net.Http 亦为 5.1 必需）。

