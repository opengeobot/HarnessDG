    - scenarioId: AC-P0B-JOB-003
      assertion: >-
        E4-T1（traceparent 透传）：客户端自带 32-hex trace-id 创建资产，
        响应 X-Trace-Id 等于注入值；job_task.trace_id 等于注入值（IS NOT NULL 判定 +
        等值判定双重断言）；任务在真实 Gitea 上 SUCCEEDED 后，每条 job_attempt.trace_id
        与任务一致且非空（mismatch=0、attempts=1 filled=1）；Outbox 事件携带同一 trace（观察值一致）。
      scenarioCategory: happy
    - scenarioId: AC-P0B-JOB-003
      assertion: >-
        E4-T2（服务端生成）：不带 traceparent 创建资产，响应 X-Trace-Id 为 32 位 hex，
        job_task.trace_id 等于该响应头值；任务 SUCCEEDED 后 attempt.trace_id 一致且非空。
        证明无客户端 trace 时入队点仍从 PrincipalContext 取到真实请求 trace（非兜底随机值）。
      scenarioCategory: boundary
    - scenarioId: AC-P0B-JOB-003
      assertion: >-
        E4-T3（VERSION_PUBLISH 路径）：以 REST 审批（APPROVE）触发入队，
        job_task.trace_id 等于审批请求注入的 traceparent 值。夹具注：publish_request 行经 SQL 置备，
        因提交入口要求未注册的权限码 asset:write（§2 事实 8，另立任务）；
        被测的 submitDecision → enqueue → trace 填充路径仍由真实 HTTP 请求触发。
      scenarioCategory: happy
    - scenarioId: AC-P0B-JOB-003
      assertion: >-
        E4-T4（反空洞守卫）：一致性断言 SQL 必须同时要求「已填充」——
        以双 NULL 假行验证守卫 SQL 判为不满足（rows=0），固化 023 的
        「IS DISTINCT FROM 双 NULL 空洞通过」教训，防止后续复现时误读。
      scenarioCategory: failure
    - scenarioId: AC-P0B-JOB-003
      assertion: >-
        023 回栈复验（本卡修复的直接效果）：同一 job-e4-023.ps1、023 覆盖（租约 45s）、
        063 实施后镜像，28/28 ALL PASS；其中「A4 attempt 与任务的 trace_id 均已填充」
        由 0e6b9ed 上的 FAIL(populatedRows=0) 转 PASS(populatedRows=2)——
        被强杀补记的 JOB_LEASE_EXPIRED attempt 与 SUCCESS attempt 均携带同一 trace。
        023 的 EVD notProven 据此撤销。
      scenarioCategory: recovery
    - scenarioId: AC-P0B-JOB-003
      assertion: >-
        E2 边界（JobApplicationServiceEnqueueTest，5 项）：显式 traceId 优先不被覆盖；
        上下文存在时回落取值；无上下文时生成 ^[0-9a-f]{32}$ 兜底；空白上下文仍兜底；
        两次生成互不相同。失败路径固化：把 enqueue 改回原样（直接透传 traceId 实参）后
        4/5 显式 FAIL（仅「显式优先」项如预期 PASS）——证明断言具备判别力，
        修复形态恢复后 29/29（含 AssetApplicationServiceTest 24 项）PASS。
      scenarioCategory: boundary
