# 时间: 2026-09-23 作者: AxeXie
# E5 压力演练（2026-09-23，e33c14a）：新增 deploy/compose/scripts/p5-preview/preview-pressure-drill.sh，
#   非侵入（不改 compose.yaml）经 docker run 运行时施加 --memory/--cpus，资源参数从运行中主 worker inspect 派生。
#   场景 A：64m 受限副本 exit=137 oomKilled=true，副本受压期间主栈 5 次探测 0 失败。
#   场景 B 根因修复链（前两轮 FAIL 取证）：
#     1) backend 进程内同样运行 JobWorker（JobConfiguration aihub.job.worker.enabled matchIfMissing=true，
#        api profile 未覆盖）——仅 stop worker 时 backend 以默认 1MB maxBytes 一次领取成功；
#        修复：同时 stop backend+worker，登录/查询/入队全部改经副本容器内 localhost REST，副本为唯一领取者。
#     2) JobWorker.handleFailure 终态 attempt 状态为 'DEAD'（非 'FAILED'）——断言改 status in ('FAILED','DEAD')。
#   场景 B 实跑：120KB payload > 副本 maxBytes 64KB → job 3 次尝试后 DEAD，error_code=INTERNAL_ERROR，
#     3 条 job_attempt 均含 PREVIEW_LIMIT_EXCEEDED；asset_preview 行数不变（无部分产物）；
#     PII 金丝雀未出现在 attempt 消息/副本日志/主 worker 日志/backend 日志；恢复后主栈全绿。
#   汇总 PASS=7 FAIL=0 SKIP=0（.tmp 输出已按脱敏原则删除，命令与结果如实记录于下方 execution/coverage）。
# 架构观察（超本 Task allowedPaths，登记 followUp 不改代码）：
#   compose.yaml 角色注释声称 api 仅在线请求 / worker 承载后台任务，但 api profile 未显式
#   aihub.job.worker.enabled=false，backend 实际参与任务领取。建议后续 Task 修正 profile 或文档。
