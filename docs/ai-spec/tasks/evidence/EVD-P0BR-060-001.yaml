defects:
  - id: DEF-060-5
    scenario: AC-P0B-IAM-011
    title: 引入 CAS 与 REQUIRES_NEW 后出现同线程自锁，并发刷新请求挂起
    status: FIXED_IN_TASK-P0BR-060
    evidence: >-
      首次修复尝试后 verify.ps1 的 V05i 挂在超时；pg_stat_activity 显示
      pid A 在 Lock/transactionid 上等待 UPDATE iam_token SET status='REVOKED'，
      pid B 为 idle in transaction 且持有 UPDATE ... SET status='ROTATED' WHERE jti=... AND status='ACTIVE'；
      pg_locks 证实 A 的 revokeFamily 在等 B 的事务，而 B 即 A 自身线程的外层事务；
      backend 日志出现 HikariPool Connection leak detection triggered，
      位于 AuthenticationApplicationService.revokeFamilyInOwnTransaction。
    rootCause: >-
      refresh 仍被 @Transactional 包裹时，抢占失败的 CAS 会阻塞在胜者持有的行锁上，
      使该线程的外层事务保留该行锁；此时同线程再开 REQUIRES_NEW（新连接、独立事务）
      去 UPDATE 同一行，内层永远等待外层，外层又在等内层返回——自锁。
    fixScope: backend/src/main/java（本卡 allowedPaths）
    resolution: >-
      把「CAS + 同 Family 新摘要落库 + 成功审计」收敛进短事务 rotationTransaction
      （REQ-IAM-004 要求 CAS 与新摘要同事务），使 CAS 不再处于跨步骤的长事务中；
      抢占失败在外层事务已结束、行锁已释放后才发起独立的整族吊销事务。
    reverified: V05i 由挂起转为 PASS，且 V05c–V05j 无回归

