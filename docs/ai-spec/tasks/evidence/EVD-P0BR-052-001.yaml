coverage:
  proven:
    - scenarioId: AC-P0B-IDM-001
      assertion: >-
        真实栈上带 Idempotency-Key 调用 POST /api/v1/system/organizations 首次返回 201
        而非 500 INTERNAL_ERROR（缺陷 A 修复生效），且 organization 表恰好新增 1 行。
      scenarioCategory: normal
    - scenarioId: AC-P0B-IDM-001
      assertion: >-
        同键同请求体第二次调用返回与首次相同的状态码 201，
        organization 表行数不再增加（无重复副作用），
        api_idempotency 中该键恰好 1 条记录。
      scenarioCategory: normal
    - scenarioId: AC-P0B-IDM-001
      assertion: >-
        api_idempotency.completed_at 实际写入且非空（实测 SQL 返回 "t"），
        证明 Instant→OffsetDateTime 绑定修复生效；修复前该 INSERT 直接抛
        "Can't infer the SQL type to use for an instance of java.time.Instant"。
      scenarioCategory: normal
    - scenarioId: AC-P0B-IDM-001
      assertion: >-
        api_idempotency.request_digest 长度为 64 的十六进制串，
        证明请求摘要为真实 SHA-256 且已落库。
      scenarioCategory: normal
    - scenarioId: AC-P0B-IDM-001
      assertion: >-
        后端日志门禁 PASS：5 分钟内无 "Can't infer the SQL type"、无
        "column index is out of range"。
      scenarioCategory: normal
    - scenarioId: AC-P0B-IDM-002
      assertion: >-
        E2 单元测试：IdempotencyServiceTest.shouldRejectSameKeyWithDifferentFingerprint
        断言同键不同摘要时抛 ConflictException 且 errorCode() == IDEMPOTENCY_KEY_CONFLICT、
        supplier 未被执行、store 未 save（5/5 通过）；
        shouldReplayWhenFingerprintMatches 覆盖同键同摘要复用。
      scenarioCategory: failure
    - scenarioId: AC-P0B-IDM-002
      assertion: >-
        E4 真实栈：同键不同请求体时，既有 api_idempotency 记录未被覆盖
        （request_digest 仍匹配首个请求体），且第二次请求未产生第二个组织行。
      scenarioCategory: failure
    - scenarioId: AC-P0B-IDM-002
      assertion: >-
        E4 真实栈跨主体隔离：同一 Idempotency-Key 由第二个主体（scopes 仅 organization:manage）
        携自有请求体调用时，未被错误回放为管理员的首次响应，
        而是被真实执行并创建了自己的组织（organization 表 +1，
        响应体返回该主体自己的组织 code）。作用域的 principalId 维度真实生效。
      scenarioCategory: normal
  notProven:
    - scenarioId: AC-P0B-IDM-002
      assertion: >-
        「同键不同请求体在 HTTP 层返回 409 IDEMPOTENCY_KEY_CONFLICT」未闭环：
        实测返回 201 且带 X-Idempotency-Replayed: true。根因是全局
        IdempotencyInterceptor（shared/idempotency）注册在 /api/v1/**，
        其 preHandle 命中已有记录即直接回放首次响应并 return false，
        从不比对 request_fingerprint，因此 HTTP 请求永远到不了已修好的
        IdempotencyService.execute。该拦截器位于本卡 allowedPaths 之外，
        且在 baseCommit 之前即存在，已作为独立既存缺陷另行上报。
        本卡的摘要比对能力已由上述单元测试与 E3 仓储测试证明。
    - scenarioId: AC-P0B-IDM-002
      assertion: >-
        「同 key 不同主体各持一条 api_idempotency 记录」未闭环：
        实测共享同一 key 时 api_idempotency 仅 1 行（期望 2）。
        根因是 V9__job.sql 把 idempotency_key 声明为全局 UNIQUE（不含 principal_id），
        JdbcIdempotencyStore.save 的 ON CONFLICT (idempotency_key) DO NOTHING
        因此静默丢弃第二个主体的记录。修复需修改已应用的 V9 Migration，
        属本卡「停止条件：需要修改 V9 或其他已应用 Migration 才能修好」，
        故不在本卡内实施。已证明的部分：作用域隔离本身生效（见上一条 proven）。
    - scenarioId: AC-P0B-IDM-003
      assertion: >-
        并发同键（IN_PROGRESS 原子登记、租约恢复）未纳入本卡，
        按 TASK-P0BR-052 §3「明确不在范围」显式排除，
        本卡不声明并发恰好一次语义。
    - scenarioId: AC-P0B-IDM-001
      assertion: >-
        JdbcIdempotencyStoreIT（4 项 save/find 往返、completed_at 真实写入、
        同 key 不同 principal 不命中、二次 save 不覆盖且只 1 行）在本机执行时全部 Skipped：
        Testcontainers 无法连接本机 Docker（400 BadRequest），既存 17 个 IT 同样 Skipped。
        本卡的 E4 结论由真实 Compose 栈独立取得，不依赖该 IT。

