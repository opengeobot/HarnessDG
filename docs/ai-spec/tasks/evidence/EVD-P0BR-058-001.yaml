coverage:
  proven:
    - scenarioId: AC-P0B-IAM-001
      assertion: >-
        V05c: 真实栈上 iam_user 中引导管理员恰好 1 行（实测 1）；password_algorithm == BCRYPT 且
        password_hash 前缀匹配 ^\$2[aby]\$（实测 $2a$，自适应哈希，非明文）；
        audit_log 正文与该用户相关的明文口令命中数为 0；
        backend 容器最近 400 行日志不含该口令；
        backend 容器重启后（实测 8 秒内 healthy）该用户名仍只有 1 行、哈希前缀不变，
        证明引导幂等（只创建一次）。
      scenarioCategory: normal
    - scenarioId: AC-P0B-IAM-003
      assertion: >-
        V05c: 新建用户初始为 PENDING_ACTIVATION + must_change_password=1；
        临时口令登录返回 200；未改密时访问业务端点被 403 PASSWORD_CHANGE_REQUIRED 阻断
        （证明改密门真实生效）；PUT /api/v1/me/password 返回 200 后
        落库变为 ACTIVE + must_change_password=0；
        旧临时口令登录返回 401 AUTH_INVALID_CREDENTIALS（临时口令失效）；
        新口令登录返回 200；/me 的 forcePasswordChange 为 false；
        audit_log 中该主体（按 principalId 归属）的 USER_PASSWORD_CHANGED 计数 >= 1（实测 23）。
      scenarioCategory: normal
    - scenarioId: AC-P0B-IAM-004
      assertion: >-
        V05c: 不存在的用户名与错误口令分别登录，两者均返回 401 且 code 均为
        AUTH_INVALID_CREDENTIALS；将响应体中的 requestId/traceId 归一化后
        两响应体逐字节相同（details 为空对象，不暴露账号存在性）；
        审计中不出现被提交的错误口令明文。
      scenarioCategory: denial
    - scenarioId: AC-P0B-IAM-005
      assertion: >-
        V05h: 对专用验证主体连续 5 次错误口令，第 5 次返回 423 AUTH_ACCOUNT_LOCKED；
        iam_user.status 落库为 LOCKED 且 locked_until 非空
        （脚本兼容 LOCKED 位于字段串首的匹配，见 DEF-058-6）；
        锁定期间使用**正确**口令仍返回 423 AUTH_ACCOUNT_LOCKED；
        audit_log 中 AUTH_LOGIN_FAILED 计数 >= 1（实测 DENIED=14 / FAILED=36），
        证明失败审计与锁定状态不再随认证异常回滚。
        根因与修复见 EVD-P0BR-059-001.yaml（DEF-058-1 → 独立事务提交失败副作用）。
      scenarioCategory: failure
    - scenarioId: AC-P0B-IAM-006
      assertion: >-
        V05d: 登录与刷新下发的 Set-Cookie 均含 HttpOnly、SameSite=Strict、
        Path=/api/v1/auth 与 Max-Age（本地 http 验收下 Secure 由部署配置控制，见 assumptions）；
        携带刷新 Cookie 调用 /auth/refresh 返回 200；
        新 refresh Cookie 值 != 旧值（refresh 轮换）；
        响应体 accessToken != 旧值（access 轮换）且新 access 访问 /me 返回 200；
        iam_token 中新出现的旧 jti 状态为 ROTATED；
        该 Token Family 中 status='ACTIVE' 的行数恰好为 1（无双有效 refresh）。
      scenarioCategory: normal
    - scenarioId: AC-P0B-IAM-007
      assertion: >-
        V05g: 重用已轮换的 refresh JWT 返回 401 AUTH_REFRESH_REPLAYED；
        该 Token Family 中 status='ACTIVE' 行数降为 0（整族吊销生效）；
        重放前刚轮换出的**新** refresh 亦失效（非 200）；
        audit_log 中 AUTH_TOKEN_REPLAY_REJECTED 计数 >= 1（实测 23），且 result=DENIED。
        根因与修复见 EVD-P0BR-060-001.yaml（DEF-058-2 → 独立事务提交吊销与拒绝审计）。
      scenarioCategory: denial
    - scenarioId: AC-P0B-IAM-008
      assertion: >-
        V05e: 管理员禁用持有有效 access 的用户后——旧 access 的**下一次** /me 请求立即返回 401
        （不依赖 JWT 内旧状态）；禁用后该用户 refresh 刷新被拒（非 200）；
        重新登录返回 403 AUTH_ACCOUNT_DISABLED；
        iam_user.status 落库为 DISABLED；
        audit_log 中 USER_DISABLED 计数 >= 1（实测 SUCCEEDED=10 / DENIED=3），
        使该场景的「状态和审计一致」子判据成立。
        审计落点由 EVD-P0BR-061-001.yaml 补齐（DEF-058-4）。
        另：目录还要求「凭据交换被拒」，该分支针对 Agent 主体；
        本场景的被禁用主体是本地用户（不持有 Agent 凭据），
        故凭据交换分支未在本场景内构造，属场景适用范围（由 AC-P0B-AGT-003 承载）。
      scenarioCategory: denial
    - scenarioId: AC-P0B-IAM-009
      assertion: >-
        V05f: 登出返回 200 并下发 aihub_refresh=; 且 Max-Age=0 的清除 Cookie；
        登出后该 Token Family 中 status='ACTIVE' 行数降为 0（整族吊销）；
        登出后重用该 refresh 刷新返回非 200；
        重复登出（带 Cookie）返回 200；无 refresh 的登出返回 200；
        两次登出均未报错，证明登出幂等。
      scenarioCategory: normal
    - scenarioId: AC-P0B-IAM-011
      assertion: >-
        V05i: 两个**独立 HTTP 连接**同时用同一 refresh JWT 调用 /auth/refresh
        （.NET HttpClient 并发发起，非串行两次调用）；
        实测恰好 1 次返回 200、另 1 次返回 401 AUTH_REFRESH_REPLAYED；
        因输家复用的 jti 此时已为 ROTATED，按 REQ-IAM-004「ROTATED jti 再用视为重放，
        整个 Family REVOKED」该 Token Family 的 status='ACTIVE' 行数降为 0
        （出口要求的「无双有效 Token」即 <= 1；== 0 是更强且符合规格重放语义的结论）；
        audit_log 中 AUTH_TOKEN_REPLAY_REJECTED 计数 >= 1。
        根因与修复见 EVD-P0BR-060-001.yaml（DEF-058-3 与 DEF-060-5）。
      scenarioCategory: concurrency
    - scenarioId: AC-P0B-IAM-012
      assertion: >-
        V05j: 创建/编辑/重置/禁用/启用各步均返回 200 且落库正确
        （PATCH 后 locale 落库 en-US；reset-password 后回到 PENDING_ACTIVATION +
        must_change_password=1）；
        audit_log 中 USER_CREATED / USER_UPDATED / USER_ENABLED / USER_DISABLED /
        USER_PASSWORD_RESET 五个事件计数均 >= 1（实测 1 / 5 / 14 / 10 / 24）；
        在仅剩 1 个持有 user:manage 的活跃管理员时禁用该管理员被拒，
        返回 COMMON_INVALID_ARGUMENT，且产生拒绝审计：
        audit_log 中 USER_DISABLED/DENIED 且 error_code=COMMON_INVALID_ARGUMENT 且
        resource_id=该管理员 principalId 的行数 >= 1，
        并使该事件的 DENIED 总计数相对拒绝前基线**恰好 +1**
        （只断言「>= 1」无法鉴别本次拒绝是否落库，历史行会让断言恒真）；
        被拒后管理员仍为 ACTIVE。
        审计落点与最后管理员保护由 EVD-P0BR-061-001.yaml 补齐（DEF-058-4）。
      scenarioCategory: denial
  notProven:
    - scenarioId: AC-P0B-IAM-004
      assertion: >-
        E2 级「脚本被误改为不比对响应形状时必须 FAIL」未固化为自动化回归门禁：
        本次以人工负例对照取证（将 Get-ComparableErrorShape 改为返回
        "MUTATED-" + $Body 后重跑，V05c 如期 FAIL 并精确报出
        「两种失败登录的响应体形状不一致，暴露账号存在性」），
        但未新增独立测试脚手架。固化该类门禁超出本卡 allowedPaths。
    - scenarioId: AC-P0B-IAM-001
      assertion: >-
        「日志/历史无明文」仅覆盖 backend 容器最近 400 行日志与 audit_log 正文；
        未穷举历史镜像层、Docker 卷内的历史日志轮转文件与 Gitea 侧记录。
        以现有 allowedPaths 无法覆盖该类外部载荷。

