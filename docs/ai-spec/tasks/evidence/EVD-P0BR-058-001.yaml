coverage:
  proven:
    - scenarioId: AC-P0B-IAM-001
      assertion: >-
        V05c: 真实栈上 iam_user 中引导管理员恰好 1 行；password_algorithm == BCRYPT 且
        password_hash 前缀匹配 ^\$2[aby]\$（自适应哈希，非明文）；
        audit_log 正文与该用户相关的明文口令命中数为 0；
        backend 容器最近 400 行日志不含该口令；
        backend 容器重启后（实测 8 秒内 healthy）该用户名仍只有 1 行、哈希前缀不变，
        证明引导幂等（只创建一次）。
      scenarioCategory: normal
    - scenarioId: AC-P0B-IAM-003
      assertion: >-
        V05c: 新建用户初始为 PENDING_ACTIVATION + must_change_password=1；
        临时口令登录返回 200；未改密时访问业务端点被 403 PASSWORD_CHANGE_REQUIRED 阻断
        （证明改密门真实生效）；PUT /api/v1/me/password 返回 200 后
        落库变为 ACTIVE + must_change_password=0；
        旧临时口令登录返回 401 AUTH_INVALID_CREDENTIALS（临时口令失效）；
        新口令登录返回 200；/me 的 forcePasswordChange 为 false；
        audit_log 中该主体（按 principalId 归属）的 USER_PASSWORD_CHANGED 计数 >= 1。
      scenarioCategory: normal
    - scenarioId: AC-P0B-IAM-004
      assertion: >-
        V05c: 不存在的用户名与错误口令分别登录，两者均返回 401 且 code 均为
        AUTH_INVALID_CREDENTIALS；将响应体中的 requestId/traceId 归一化后
        两响应体逐字节相同（details 为空对象，不暴露账号存在性）；
        审计中不出现被提交的错误口令明文。
      scenarioCategory: denial
    - scenarioId: AC-P0B-IAM-006
      assertion: >-
        V05d: 登录与刷新下发的 Set-Cookie 均含 HttpOnly、SameSite=Strict、
        Path=/api/v1/auth 与 Max-Age（本地 http 验收下 Secure 由部署配置控制，见 assumptions）；
        携带刷新 Cookie 调用 /auth/refresh 返回 200；
        新 refresh Cookie 值 != 旧值（refresh 轮换）；
        响应体 accessToken != 旧值（access 轮换）且新 access 访问 /me 返回 200；
        iam_token 中新出现的旧 jti 状态为 ROTATED；
        该 Token Family 中 status='ACTIVE' 的行数恰好为 1（无双有效 refresh）。
      scenarioCategory: normal
    - scenarioId: AC-P0B-IAM-009
      assertion: >-
        V05f: 登出返回 200 并下发 aihub_refresh=; 且 Max-Age=0 的清除 Cookie；
        登出后该 Token Family 中 status='ACTIVE' 行数降为 0（整族吊销）；
        登出后重用该 refresh 刷新返回非 200；
        重复登出（带 Cookie）返回 200；无 refresh 的登出返回 200；
        两次登出均未报错，证明登出幂等。
      scenarioCategory: normal
  notProven:
    - scenarioId: AC-P0B-IAM-008
      assertion: >-
        拒绝路径全部成立（禁用后旧 access 下一请求 401、refresh 被拒、
        重新登录 403 AUTH_ACCOUNT_DISABLED、iam_user.status 落库 DISABLED），
        但该场景的目录判据要求「状态**和审计**一致」，
        而 USER_DISABLED 审计缺失（audit_log 计数为 0）。
        因此 AC-P0B-IAM-008 **不计为 proven**，其审计缺口与 AC-P0B-IAM-012
        同源（见 DEF-058-4）。
        另：目录还要求「凭据交换被拒」，该分支针对 Agent 主体；
        本场景的被禁用主体是本地用户（不持有 Agent 凭据），
        故凭据交换分支未在本场景内构造，属场景适用范围。
      scenarioCategory: denial
    - scenarioId: AC-P0B-IAM-005
      assertion: >-
        真实栈实测账户锁定**未生效**：对同一用户连续 5 次错误口令，
        第 5 次仍返回 401 AUTH_INVALID_CREDENTIALS（期望 423 AUTH_ACCOUNT_LOCKED）；
        iam_user 中 failed_login_attempts 恒为 0、status 恒为 PENDING_ACTIVATION、
        locked_until 恒为 NULL（连续 6 次失败后仍为 0|PENDING_ACTIVATION|NULL）；
        之后使用**正确**口令仍返回 200（期望被拒）。
        根因（代码定位）：AuthenticationApplicationService.login 标注 @Transactional，
        口令不匹配分支中 user.recordLoginFailure(...) 后即抛出 AuthenticationException，
        运行时异常触发事务回滚，使失败计数与锁定状态一并回滚；
        audit("AUTH_LOGIN_FAILED"...) 同样在抛出前调用并被回滚，
        故 audit_log 中 AUTH_LOGIN_FAILED 计数为 0（实测）。
        这是产品缺陷，不是证据缺失。按本卡 §9，不得为使其通过而放宽断言，
        停止受影响部分并上报。修复需修改 backend/src/main/java（本卡 forbiddenPaths）。
    - scenarioId: AC-P0B-IAM-007
      assertion: >-
        真实栈实测重放**部分未生效**：重用已轮换 refresh 确实返回
        401 AUTH_REFRESH_REPLAYED（错误码正确）；
        但 Token Family **未整族吊销**——重放后该 Family 中
        status='ACTIVE' 行数仍为 1（期望 0），
        且重放前刚轮换出的**新 refresh 仍可刷新成功**（返回 200，期望失效）；
        audit_log 中 AUTH_TOKEN_REPLAY_REJECTED 计数为 0（期望 >= 1）。
        根因（代码定位）：refresh 方法标注 @Transactional，
        非活跃分支中 refreshTokenRepository.revokeFamily(...) 与
        audit("AUTH_TOKEN_REPLAY_REJECTED"...) 之后即抛出 AuthenticationException，
        运行时异常回滚整个事务，使吊销与审计被一并撤销。
        这是产品缺陷，不是证据缺失。修复需修改 backend/src/main/java。
    - scenarioId: AC-P0B-IAM-011
      assertion: >-
        真实栈实测并发刷新**无双有效 Token 不成立**：两个独立 HTTP 连接
        同时用同一 refresh JWT 调用 /auth/refresh，
        实测**两次均返回 200**（期望恰好 1 次成功）；
        数据库该 Token Family 出现 **2 条并存 ACTIVE** 记录（期望 <= 1）。
        根因（代码定位）：refresh 只做「读取记录 → 判断 isActive →
        插入新记录 + 标记旧记录 ROTATED」，标记旧记录使用普通 UPDATE
        而未带 status='ACTIVE' 条件或行锁，两请求可在同一时间窗内都通过
        isActive 检查（TOCTOU），各自签发新 refresh。
        这是产品缺陷，不是证据缺失。修复需新增乐观/悲观并发控制，
        涉及 backend/src/main/java 与可能的新 Flyway 迁移。
    - scenarioId: AC-P0B-IAM-012
      assertion: >-
        真实栈实测用户管理**动作本身可用但审计完全缺失，且最后一个管理员保护缺失**：
        （a）PATCH /system/users/{id}、reset-password、disable、enable 均返回 200
        且落库状态正确（locale 落库 en-US；reset 后回到 PENDING_ACTIVATION +
        must_change_password=1）；
        （b）但 audit_log 中 USER_CREATED / USER_UPDATED / USER_ENABLED /
        USER_DISABLED / USER_PASSWORD_RESET **计数均为 0**，
        而 OpenAPI 对这 5 个操作均声明了 x-audit-event；
        根因（代码定位）：UserManagementApplicationService 既不注入 identity 模块的
        AuditPort 也不调用 auditService，整个用户管理用例链没有任何审计落点，
        与 REQ-IAM-006「USER_CREATED/UPDATED/ENABLED/DISABLED/PASSWORD_RESET」矛盾；
        （c）「不能禁用最后一个有效平台管理员」未实现：
        在仅剩 1 个持有 user:manage 的活跃管理员时，
        POST /system/users/{adminUserId}:disable 返回 **200** 并将其置为 DISABLED
        （期望拒绝并返回 COMMON_INVALID_ARGUMENT + 拒绝审计）。
        脚本已在断言失败时自动复原管理员为 ACTIVE，未把验收栈留在无管理员状态。
        这是产品缺陷，不是证据缺失。修复需修改 backend/src/main/java。
    - scenarioId: AC-P0B-IAM-004
      assertion: >-
        E2 级「脚本被误改为不比对响应形状时必须 FAIL」未固化为自动化回归门禁：
        本次以人工负例对照取证（将 Get-ComparableErrorShape 改为返回
        "MUTATED-" + $Body 后重跑，V05c 如期 FAIL 并精确报出
        「两种失败登录的响应体形状不一致，暴露账号存在性」），
        但未新增独立测试脚手架。固化该类门禁超出本卡 allowedPaths。
    - scenarioId: AC-P0B-IAM-001
      assertion: >-
        「日志/历史无明文」仅覆盖 backend 容器最近 400 行日志与 audit_log 正文；
        未穷举历史镜像层、Docker 卷内的历史日志轮转文件与 Gitea 侧记录。
        以现有 allowedPaths 无法覆盖该类外部载荷。

