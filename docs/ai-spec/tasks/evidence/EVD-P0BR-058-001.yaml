secrets:
  redactionChecked: true
  findings:
    - 证据未包含任何访问令牌、刷新 JWT 原文、Gitea Token、MinIO 密钥或预签名 URL。
    - 脚本输出的 FAIL 消息只包含 Token Family 业务 ID 与错误码，不含 JWT 原文。
    - IAM 验证主体口令（ComposeIam-Probe-01!z 等）为本地 Compose 验收栈专用值，
      按本卡 §5「验证主体与权限集合必须显式、可审查地写在脚本中」写死在脚本内，
      不用于任何生产环境；本 Evidence 不记录这些口令之外的任何凭据。
    - 脚本不打印 access Token 或响应正文中的敏感字段。

limitations:
  skippedTests:
    - >-
      本用例未 SKIP 任何 IAM 场景：backend 与 postgres 均可达，
      V05c–V05j 全部真实执行，FAIL 均为真实运行结果而非跳过。
    - >-
      PreviewJobHandlerTest 的 2 项 CSV 失败与 Testcontainers 相关的
      17 个 IT Skipped 与本卡无关（本卡不改 backend）。
  assumptions:
    - >-
      本地 Compose 以 http 提供验收入口，且 compose.yaml 明确设置
      AIHUB_REFRESH_COOKIE_SECURE=false，故 Secure 属性无法在本地被有意义地断言。
      脚本断言 HttpOnly / SameSite=Strict / 受限 Path / Max-Age 四项与运行环境无关的属性。
    - >-
      锁定阈值取自实现常量 LocalUser.MAX_FAILED_ATTEMPTS = 5；
      脚本按 5 次断言而非「任意次」，防止把阈值放宽当成通过。
  environmentDifferences:
    - >-
      verify.ps1 的 HTTP 辅助由 Invoke-WebRequest 改为 .NET HttpClient：
      Invoke-WebRequest 对无请求体的 POST 会强制附加
      Content-Type: application/x-www-form-urlencoded，无法精确模拟
      「浏览器仅凭 Cookie 刷新」的调用形状；改用 HttpClient 后可控方法、Cookie 头与
      请求体，并能直接读取 Set-Cookie 原始头。
      在 .NET Framework 下 HttpMethod 无 PATCH 静态属性，故按名构造 HttpMethod。
      此次改建同时消除了旧实现在该形状下的误报路径。
    - >-
      verify.sh 在本机因 core.autocrlf=true 呈 CRLF，直接 bash -n 会报 $'\r'。
      此为仓库既有状态（未新增 .gitattributes），故 E4 取「LF 归一化副本 +
      alpine:3.20 容器内真实执行」的方式取证，并在证据中明确该转换。
    - >-
      验证过程中为建立 IAM 8/12 用例的前置状态，脚本会创建
      compose-verify-iam3/iam5/iam8/iam12 等专用主体；
      这些主体仅存在于本地 Compose 验收栈。
    - >-
      AC-P0B-IAM-012 的断言在检测到「最后一个管理员被允许禁用」时，
      会先自动把该管理员复原为 ACTIVE 再报 FAIL，
      以避免把验收栈留在无管理员、后续用例全部不可执行的坏状态。

defects:
  - id: DEF-058-1
    scenario: AC-P0B-IAM-005
    title: 登录失败计数与锁定因事务回滚而完全失效，且失败审计丢失
    evidence: >-
      连续 6 次错误口令后 iam_user.failed_login_attempts 仍为 0、status 仍为
      PENDING_ACTIVATION、locked_until 仍为 NULL；第 5 次响应仍为
      401 AUTH_INVALID_CREDENTIALS；正确口令随后仍可登录；
      audit_log 中 AUTH_LOGIN_FAILED 计数为 0。
    rootCause: >-
      AuthenticationApplicationService.login 的 @Transactional 与
      recordLoginFailure/audit 后抛 AuthenticationException 相互冲突：
      运行时异常回滚了失败计数、锁定状态与审计写入。
    fixScope: backend/src/main/java（本卡 forbiddenPaths，需另立卡片）
  - id: DEF-058-2
    scenario: AC-P0B-IAM-007
    title: 刷新重放虽返回正确错误码，但整族吊销与拒绝审计被事务回滚
    evidence: >-
      重放返回 401 AUTH_REFRESH_REPLAYED；但该 Token Family 仍残留 1 条 ACTIVE；
      重放前轮换出的新 refresh 仍可刷新成功（200）；
      audit_log 中 AUTH_TOKEN_REPLAY_REJECTED 计数为 0。
    rootCause: >-
      refresh 的 @Transactional 与 revokeFamily/audit 后抛
      AuthenticationException 相互冲突，吊销与审计随事务回滚。
    securityImpact: >-
      重放检测形同虚设：攻击者拿到已轮换的 refresh 后，
      合法用户手上的新 refresh 仍有效，被盗令牌未被切断。
    fixScope: backend/src/main/java（本卡 forbiddenPaths，需另立卡片）
  - id: DEF-058-3
    scenario: AC-P0B-IAM-011
    title: 并发刷新可产生两条并存 ACTIVE refresh（TOCTOU）
    evidence: >-
      两个独立连接同时用同一 refresh JWT 刷新，两次均返回 200；
      该 Token Family 出现 2 条并存 ACTIVE 记录。
    rootCause: >-
      refresh 判断 isActive 与标记旧记录 ROTATED 之间没有并发控制
      （标记使用无条件 UPDATE，无 status='ACTIVE' 谓词或行锁），
      两个请求可在同一时间窗内都通过检查。
    securityImpact: >-
      同一 refresh 可被并行放大为多个有效会话，削弱轮换的安全保证。
    fixScope: backend/src/main/java + 可能的 Flyway 迁移（本卡 forbiddenPaths，需另立卡片）
  - id: DEF-058-4
    scenario: AC-P0B-IAM-012
    title: 用户管理全部动作无审计，且最后一个管理员保护缺失
    evidence: >-
      create/update/enable/disable/reset-password 均返回 2xx 且落库状态正确，
      但 audit_log 中 USER_CREATED/USER_UPDATED/USER_ENABLED/USER_DISABLED/
      USER_PASSWORD_RESET 计数均为 0（OpenAPI 已声明 x-audit-event）；
      仅剩 1 个活跃管理员时禁用该管理员返回 200 并被置为 DISABLED。
    rootCause: >-
      UserManagementApplicationService 未注入 AuditPort、未调用 auditService，
      用例链无审计落点；同时未实现 REQ-IAM-006 的
      「不能禁用最后一个有效平台管理员」前置校验。
    fixScope: backend/src/main/java（本卡 forbiddenPaths，需另立卡片）

