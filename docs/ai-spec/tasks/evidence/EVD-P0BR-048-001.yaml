        任务=[TEXT_GENERATION, IMAGE_CLASSIFICATION, OBJECT_DETECTION]、
        数据格式=[JSONL, CSV, PARQUET, IMAGE_FOLDER]、模态=[TEXT, IMAGE, AUDIO, VIDEO]。
      scenarioCategory: normal
    - scenarioId: AC-P0B-UI-004
      assertion: >-
        弹窗生命周期内共发出 5 个字典请求，全部命中 MVP Catalog 的稳定 dictCode
        （license_catalog / model_framework / model_task / dataset_format / dataset_modality），
        全部返回 200，无任何 404（修复前这 5 条路径分别返回 DICTIONARY_ITEM_NOT_FOUND）。
      scenarioCategory: normal
    - scenarioId: AC-P0B-UI-004
      assertion: >-
        反证（负例对照）：修复前的 6 个旧 dictCode（license/framework/task/format/modality/language）
        在真实栈上仍返回 404 + DICTIONARY_ITEM_NOT_FOUND，证明缺陷定位准确、
        且本卡未通过放宽后端字典校验来「修好」前端。
      scenarioCategory: failure
    - scenarioId: AC-P0B-UI-004
      assertion: >-
        搜索页不再展示语言筛选项：AssetsPage.test.tsx 断言「语言」标签不存在、
        「敏感等级」筛选仍可用；AssetsPage.tsx 已移除 language state、queryKey 与查询参数。
      scenarioCategory: normal
    - scenarioId: AC-P0B-UI-004
      assertion: >-
        dictCode 漂移回归门禁具备真实鉴别力：governedDictionaryReferences.test.ts 以 Vite
        import.meta.glob 静态扫描 features/assets 下全部源码，断言所有
        /system/dictionaries/<code>/items 引用的 code 均属 MVP Catalog；
        负例对照（临时把 license_catalog 改回 license）时该文件 2 项断言失败，
        并精确报出 "license  <-  ./CreateAssetModal.tsx"；恢复后 4/4 通过。
      scenarioCategory: failure
    - scenarioId: AC-P0B-TAX-006
      assertion: >-
        同一组受控选择器在 en-US 下仍返回非空真实字典项（License=3、Framework=3、Task=3 项），
        表单标签随 locale 渲染（License/Framework/Task），受控值仍为稳定 itemCode；
        zh-CN 与 en-US 下均无 404 字典请求。
      scenarioCategory: normal
  notProven:
    - scenarioId: AC-P0B-UI-004
      assertion: >-
        「选择合法 itemCode 并提交创建资产，回读详情的治理字段与所选 itemCode 一致」未闭环：
        POST /api/v1/assets 返回 500 INTERNAL_ERROR。根因已定位为持久化任务子系统
        JdbcJobRepository.insert 声明 16 列但只绑定 15 个占位符
        （PostgreSQL: "The column index is out of range: 16, number of columns: 15"），
        经 createProvisionJob -> createAsset 冒泡。该缺陷在 baseCommit 之前即存在
        （引入提交 d8506bf，2026-07-02）且位于本卡 allowedPaths 之外，
        已作为独立整改项另行上报，未在本卡内修复。
    - scenarioId: AC-P0B-TAX-006
