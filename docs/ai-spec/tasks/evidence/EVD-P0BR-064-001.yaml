    - >-
      后端全量 verify 的 2 项失败均与本卡无关：PreviewJobHandlerTest 的
      csvMixedQuotedAndUnquoted 与 csvExceedingFiftyColumnsShouldMarkColumnTruncated
      ——CSV 解析既存缺陷，024 轮同样出现（本卡未触碰 preview 模块）。
