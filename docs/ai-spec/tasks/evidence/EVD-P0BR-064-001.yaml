coverage:
  proven:
    - scenarioId: AC-P0B-AUTH-004
      assertion: >-
        E4-S1（提交发布请求正向）：持 asset:manage 的 admin 经 REST
        POST /versions/{id}/publish-requests 返回 200 且 requestId=pub_*；
        publish_request 行 status=SUBMITTED、submitted_by=admin 真实主体、
        decided_at 尚空、frozen_digest 等于版本摘要。缺陷基线同调用 403
        AUTH_PERMISSION_DENIED（details.requiredPermission=asset:write）——
        三处入口的未注册权限码缺陷修复且行为可对照。
      scenarioCategory: happy
    - scenarioId: AC-P0B-AUTH-004
      assertion: >-
        E4-S2（反空洞授权守卫）：READER 主体（仅 asset:read）提交发布请求与
        弃用版本均 403，且零副作用（该版本仍只有 1 条发布请求、版本状态
        PENDING_REVIEW 不变）——证明本卡是把权限码取齐到契约，不是放宽授权。
      scenarioCategory: unauthorized
    - scenarioId: AC-P0B-AUTH-004
      assertion: >-
        E4-S3（发布链路端到端）：REST APPROVE 返回 200、publish_request=APPROVED
        且 decided_at 非空（submitDecision 的 063 修复保持）；VERSION_PUBLISH 任务
        由 Worker 真实领取并执行至 SUCCEEDED（attempts=1）；asset_version=PUBLISHED
        且 git_tag 正确；publish_request=PUBLISHED。缺陷基线该场景 APPROVE 后
        Handler 内 decided_at/审计 INSERT 的 Instant 绑定使链路断裂（S3 九项全 FAIL）。
      scenarioCategory: happy
    - scenarioId: AC-P0B-AUTH-004
      assertion: >-
        E4-S4（弃用/归档入口取齐）：admin 经 REST POST deprecate 返回 200、
        版本转 DEPRECATED；POST archive 返回 200、版本转 ARCHIVED。
        缺陷基线两者均 403（requiredPermission=asset:write）。
      scenarioCategory: happy
    - scenarioId: AC-P0B-AUD-001
      assertion: >-
        E4-S3（发布成功审计真实落库）：audit_log 存在该 requestId 的
        PUBLISH_SUCCEEDED 行（count=1），principal_id=admin 真实主体、
        result=SUCCEEDED、trace_id 等于审批请求注入的 traceparent 值（063 的
        trace 贯通保持）、occurred_at 非空、request_summary JSONB 非空。
        缺陷基线该行恒 0（INSERT 绑 Instant 抛异常被 catch 吞 → 静默丢审计）。
      scenarioCategory: happy
    - scenarioId: AC-P0B-AUD-001
      assertion: >-
        判别力反向对照（缺陷基线）：git stash 回退全部实施改动、重建镜像后复跑
        同一 E4 脚本 -> 17 FAILED / 9 PASS（S1 提交发布请求 403 三项、S2 副作用
        计数一项、S3 审批与发布链路九项、S4 弃用/归档四项）；恢复修复形态后
        26/26 ALL PASS。E2 的判别力来自实施期真实观察：主代码三处权限码编辑
        一度未生效（仍 asset:write）时 AuthorizationTest 3 项显式 FAIL
        （Wanted asset:manage / Actual asset:write），生效后 7/7 PASS。
        审计/告警断言非空洞通过。
      scenarioCategory: failure
    - scenarioId: AC-P0B-AUD-001
      assertion: >-
        E2（PublishJobHandlerTest 4 项，重写）：正向/补偿/Tag 冲突/Saga 失败路径的
        SQL 断言改为固化「decided_at=now()、fired_at/occurred_at 由数据库求值」，
        并加防回归守卫（遍历全部 update 调用：无 Instant 参数绑定、时间列语句
        必含 now()）；markFailed 的 PUBLISH_FAILED 审计与 system_alert INSERT 的
        真实调用断言（修复前 mock 不暴露、静默丢行无感知）。
      scenarioCategory: boundary
    - scenarioId: AC-P0B-AUTH-004
      assertion: >-
        E2（PublishApplicationServiceAuthorizationTest 7 项，新增）：三处入口
        verify requirePermission(asset:manage)、submitDecision verify
        requirePermission(asset:publish)（Permissions 常量口径）；deny 路径
        AuthorizationException 且零落库/零状态变更（fail-closed 不因修复放宽）。
        鉴别力自证：主代码被 stash 回退期间该套件 3 项显式 FAIL（Wanted asset:manage
        / Actual asset:write），恢复后 7/7 PASS。
      scenarioCategory: unauthorized
    - scenarioId: AC-P0B-AUD-001
      assertion: >-
        E2（PhysicalRecycleJobHandlerTest 2 项，新增）：保留期已过路径断言
        UPDATE asset SET recycled_at = now() 的 SQL 文本，并守卫全部 update 调用
        无 Instant 参数；保留期未过路径零 update、零审计（前置条件保持）。
      scenarioCategory: boundary
  notProven: []

