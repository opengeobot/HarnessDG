    - >-
      版本状态机没有 HTTP 推进入口（DRAFT→PENDING_REVIEW 由校验流水线推进，属后续卡），
      夹具沿 063 T3 先例以 SQL 置备 PENDING_REVIEW+manifest_digest 与 submitted_by 占位主体；
      被测路径（提交发布请求/审批/发布 Handler/弃用归档）全部由真实 HTTP 与 Worker 触发。
    - >-
      E2 的 AuthorizationService 为 mock：deny 路径的 fail-closed 真实性由 E4-S2
      （READER 主体 REST 403）在真实栈上证明，两层证据互补。
  environmentDifferences:
    - >-
      E4 在交付基线（无覆盖文件）上运行：backend 与 worker 均启用 Worker、退避与告警
      配置为交付默认值；VERSION_PUBLISH attempts=1 一次成功，无时序压缩。
    - >-
      鉴别力自证采用 git stash 整体回退（而非逐点插哨兵），流程教训沿用 024：
      恢复后先 Grep 全库确认 asset:write/decided_at = ?/recycled_at = ? 清零，
      再重建镜像复跑，避免按含缺陷源码构建导致假失败。
    - >-
      recordAuditEvent 直写 audit_log（旁路共享 AuditService）与 submitDecision 的
      publish:approve 契约口径差异按卡 §2 事实 5/6 登记为后续任务，本卡不修复；
      E4 对审计行的断言以该旁路的实际落行为准。
    - PowerShell 5.1：E4 脚本带 UTF-8 BOM、Add-Type System.Net.Http（既有教训固化）。

