limitations:
  skippedTests:
    - >-
      Testcontainers 的 16 个既有 @SpringBootTest IT（含 AssetCatalogIT、OrganizationIT、AuthorizationIT 等）
      在本机 Docker Desktop 29.x 下**报错而非跳过**：它们位于各自模块包内，
      Spring Boot 的 @SpringBootConfiguration 向上搜索无法到达 com.aihub.bootstrap.AihubApplication。
      该缺陷在变更前的 3b527e0 基线上以 git stash 暂存本卡全部改动后复现（TaxonomyIT 同样报
      «Unable to find a @SpringBootConfiguration»），非本卡引入；
      本卡新增的 AssetFacetConsistencyIT 显式声明 @SpringBootTest(classes = AihubApplication.class)
      绕开该问题，因此其 9 项为真实运行结果而非 SKIP。该既有缺陷应由独立任务治理。
    - >-
      AssetSearchPerformanceTest、DownloadTicketPerformanceTest 因同一原因在 verify 中报错（2 项 Error）；
      PreviewJobHandlerTest 2 项 CSV 解析失败亦为既存（变更前基线复现，见 environmentDifferences）。
  assumptions:
    - >-
      「Facet 各维度计数 == 同条件 search 可达总数」作为本卡的核心不变量，
      以 search 作为同一授权与过滤语义的参照实现；该参照本身的正确性由 TASK-P0BR-017 覆盖。
    - >-
      facet 的 _total 以聚合查询返回的行数计算（与 search 的可见性谓词一致），
      因此 totalCount 与 items 可达总数在未分页截断时相等；E3 用例使用小基数夹具保证不分页截断。
  environmentDifferences:
    - >-
      Testcontainers 1.21 的 docker-java 与 Docker 29.x 协商到过低的 API 版本（1.32/1.41），
      守护进程对这些版本返回 HTTP 400 «API returned a 400 (Bad Request) but provided no error-message»，
      表现为 «Could not find a valid Docker environment»。
      实测 docker info 在 API 1.32/1.41 下失败、在 1.44/1.51 下成功；
      故本次 E3 以 -Dapi.version=1.44 运行（命令行开关，未改动仓库文件）。
      另需预先 docker pull postgres:17-alpine 与 testcontainers/ryuk:0.11.0
      （经 docker.m.daocloud.io 镜像源拉取后重打 tag），否则拉取超时导致 IT 被跳过。
    - >-
      后端全量 verify 的 4 项失败（AssetSearchPerformanceTest、DownloadTicketPerformanceTest、
      PreviewJobHandlerTest×2）已在变更前基线上以 git stash 暂存本卡改动后复现，
      确认非本卡引入；其中前 2 项属上述 Spring 配置搜索的既有缺陷。
    - >-
      任务卡第 8 节声明的契约破坏检查命令
      «npx --yes @redocly/cli diff <base> <head> --fail-on-breaking» 在 @redocly/cli 1.0.0、1.34.5
      与 latest 上均不存在 diff 子命令（help 中无该项，实测报 «Unknown arguments: fail-on-breaking, diff»）；
      .github/workflows/ci.yml 第 154/156 行使用了同一命令，属既存工具链缺陷。
      本卡以「git diff 逐行核对」替代取证：改动为 17 增 1 改，仅新增 11 个可选 query 参数并扩展
      description/summary，原有 keyword/type 参数与响应结构未变，故为纯增量、无破坏变更。
      该工具链缺陷应由独立任务治理，本卡不擅自扩大 allowedPaths 修改 CI。

