coverage:
  proven:
    - scenarioId: AC-DST-TAX-002
      assertion: >-
        E3（AssetFacetConsistencyIT，9 项全通过）：对 type、sensitivity、tagId、framework、
        format 五个过滤维度分别断言「Facet.totalCount == 同条件 search 的可达总数 == 期望值」，
        并断言被过滤维度的桶计数等于该总数；type=DATASET 且 framework=PYTORCH 无交集时返回 0，
        证明不同维度之间为 AND 而不是并集；未知 tagId 与未知 sensitivity 返回 0，
        证明非法/未知受控值不回退全量；ARCHIVED 默认不进入计数、includeArchived=true 时计入，
        且两种状态都与 search 一致。
        E4（.trae/evidence/facet-e4-049.txt，真实 Compose 栈经 Nginx 入口）：
        以真实 REST 创建 2 个 MODEL（PYTORCH/TENSORFLOW）+ 1 个 DATASET（PARQUET）并经真实建仓
        Saga 推进到 COMPLETED 后——
        type=MODEL facet.totalCount=2 / types[MODEL]=2 / search.items=2（MATCH=True）；
        type=DATASET facet.totalCount=1 / types[DATASET]=1 / search.items=1（MATCH=True）；
        未过滤时 totalCount=3 且 types buckets = {"DATASET":1,"MODEL":2}；
        跨维度 AND（type=DATASET&framework=PYTORCH）=0；
        未知 tagId=0；匿名访问 401。
      scenarioCategory: normal
    - scenarioId: AC-DST-TAX-002
      assertion: >-
        判别力反向对照（同一 E4 脚本、同一夹具，仅把三处源码恢复到修复前状态并重建镜像）：
        缺陷存在时 facet 忽略全部过滤位——type=MODEL 与 type=DATASET 的 totalCount 均为 3
        （等于全量）、sensitivity=INTERNAL 返回 3 而 search 返回 0、未知 tagId 返回 3、
        跨维度 AND 返回 3，六处 MATCH 全部为 False。
        该对照证明上述断言确实能判别本卡的缺陷，而不是恒真。
        对照原始输出：.trae/evidence/facet-e4-049-BASELINE.txt。
      scenarioCategory: failure
    - scenarioId: AC-P0B-AUTH-003
      assertion: >-
        E3（AssetFacetConsistencyIT#facetCountsAreIsolatedPerPrincipal）：同一命名空间下创建
        1 个 PUBLIC + 1 个同组织 INTERNAL 资产后——
        组织成员主体（具备 asset:read/manage 但**不含** authorization:manage，即非平台管理员，
        可见性经真实组织成员关系与行级 INTERNAL 过滤得出）看到 totalCount=2、frameworks[PYTORCH]=2；
        非组织成员主体（无组织/项目/ACL/Team 作用域）看到 totalCount=1 且与同条件 search 的
        items 数一致，INTERNAL 资产不进入任何维度计数（types[MODEL]=1、frameworks[PYTORCH]=1）。
        Facet 与 search 在两种主体下都使用同一授权谓词。
        失败路径（facetWithoutReadPermissionFailsClosed）：仅有 project:view 的主体调用
        getAssetFacets 与 searchAssets 均抛 AuthorizationException，
        证明缺少 asset:read 时 fail closed，而不是静默返回空 Facet 冒充成功；
        E4 补充：匿名访问 /api/v1/assets/facets 返回 401。
      scenarioCategory: denial
  notProven:
    - >-
      AC-P0B-AUTH-003 更细的跨组织/跨项目与 PRIVATE(ACL/Owner Team) 可见性矩阵在 Facet 上的端到端隔离，
      由 TASK-P0BR-017 的 AssetAccessPolicyTest 与后续 E4 场景承载；本卡只证明 Facet 与 search
