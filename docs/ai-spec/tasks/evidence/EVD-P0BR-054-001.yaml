      scenarioCategory: failure
    - scenarioId: AC-P0B-IDM-002
      assertion: >-
        冲突请求未产生业务副作用：organization 表行数较首次调用只 +1；
        api_idempotency 中既有记录的 request_digest 仍为 64 位十六进制
        （未被第二个请求体覆盖）。
      scenarioCategory: failure
    - scenarioId: AC-P0B-IDM-001
      assertion: >-
        同键同请求体第三次调用返回与首次相同的状态码 201，
        且 organization 表行数不再增加——移除拦截器后复用语义未回归
        （复用由 IdempotencyService 承担，仍比对摘要后回放）。
      scenarioCategory: normal
    - scenarioId: AC-P0B-IDM-002
      assertion: >-
        createRole 的幂等实现补齐：RoleController.createRole 按契约声明
        接受 Idempotency-Key，走 IdempotencyService.execute 并传入请求摘要。
        该端点此前是「契约声明幂等但实现缺失」的两个端点之一。
      scenarioCategory: normal
    - scenarioId: AC-P0B-IDM-001
      assertion: >-
        E2 静态门禁 IdempotencySingleDecisionPointTest 4/4 通过：
        (1) 全仓库 HandlerInterceptor 实现类不得引用 IdempotencyStore/
        IdempotencyRecord/IDEMPOTENCY_KEY_HEADER；
        (2) 不得存在 *IdempotencyInterceptor / *IdempotencyWebConfiguration 源码；
        (3) 回放响应头不得由拦截器写出；
        (4) IdempotencyService 必须仍包含摘要比对与 IDEMPOTENCY_KEY_CONFLICT。
      scenarioCategory: failure
    - scenarioId: AC-P0B-IDM-001
      assertion: >-
        授权未放宽：verify.ps1 的 V01–V11 全部 PASS（VERIFY_EXIT=0），
        其中 V06/V07/V09/V10/V11 仍以最小权限主体断言 403 +
        AUTH_PERMISSION_DENIED、以有权限主体断言 200。
        移除在 Controller 之前返回的拦截器后，权限断言重新全部真实执行。
      scenarioCategory: denial
  notProven:
    - scenarioId: AC-P0B-IDM-001
      assertion: >-
        McpController 的 Idempotency-Key 契约声明在移除拦截器后仍为空声明：
