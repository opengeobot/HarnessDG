    policyStatus: ACTIVE

aiExecutionPolicy:
  decision: DEC-009
  protocol: 06-ide/generic-execution-protocol.md
  requiredTaskSchema: harnessdg.task/v1
  requireTaskCardReady: true
  requireRequirementsReady: true
  requireAcceptedDecisions: true
  requireBaseCommit: true
  requireAllowedPaths: true
  requireStageGate: true
  requireAcceptanceEvidenceMap: true
  requireCrossCuttingPlan: true
  requireTaskSpecificValidation: true
  requirePathTriggeredValidationProfiles: true
  requireCompletionEvidenceValidation: true
  validateTaskCommand: ./docs/ai-spec/tools/validate-task-card.ps1 -TaskPath <task-card>
  validateCompletionCommand: ./docs/ai-spec/tools/validate-task-card.ps1 -TaskPath <task-card> -CheckCompletion
  denyImplementationOnValidationFailure: true
  localEnforcementStatus: ACTIVE
  protectedCiEnforcementStatus: MISSING_TASK_GOV_008

