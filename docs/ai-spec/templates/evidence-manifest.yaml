schemaVersion: harnessdg.evidence/v1
evidenceId: EVD-<task>-<sequence>
status: DRAFT

task:
  taskId: TASK-...
  requirements: [REQ-...]
  scenarios: [AC-...]

governance:
  specValidation:
    command: ./docs/ai-spec/tools/validate-spec.ps1
    result: null
  taskValidation:
    command: ./docs/ai-spec/tools/validate-task-card.ps1 -TaskPath <task-card>
    result: null
  changedPathValidation:
    command: ./docs/ai-spec/tools/validate-task-card.ps1 -TaskPath <task-card> -CheckChangedPaths
    result: null
  completionValidation:
    command: ./docs/ai-spec/tools/validate-task-card.ps1 -TaskPath <task-card> -CheckCompletion
    result: null

source:
  branch: ...
  commitSha: ...
  dirtyWorktree: false
  dirtyPaths: []

environment:
  observedAt: ...
  os: ...
  timezone: ...
  java: ...
  node: ...
  pnpm: ...
  docker: ...
  composeProfiles: []
  externalDependencyVersions: {}

execution:
  workingDirectory: ...
  command: ...
  startedAt: ...
  finishedAt: ...
  exitCode: null
  result: PASS # PASS | FAIL | SKIP
  evidenceLevel: E1 # E1 | E2 | E3 | E4 | E5

coverage:
  proven:
    - scenarioId: AC-...
      assertion: ...
  notProven: []

artifacts:
  reports: []
  logs: []
  screenshots: []
  traces: []
  metrics: []
  databaseQueries: []

secrets:
  redactionChecked: false
  findings: []

limitations:
  skippedTests: []
  assumptions: []
  environmentDifferences: []

review:
  recordedBy: ...
  reviewedBy: null
  reviewedAt: null
  accepted: false
