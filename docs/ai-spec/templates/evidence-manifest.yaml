schemaVersion: harnessdg.evidence/v1
evidenceId: EVD-<task>-<sequence>
status: DRAFT

task:
  taskId: TASK-...
  requirements: [REQ-...]
  scenarios: [AC-...]

governance:
  specValidation:
    command: ./docs/ai-spec/tools/validate-spec.ps1
    result: null
  taskValidation:
    command: ./docs/ai-spec/tools/validate-task-card.ps1 -TaskPath <task-card>
    result: null
  changedPathValidation:
    command: ./docs/ai-spec/tools/validate-task-card.ps1 -TaskPath <task-card> -CheckChangedPaths
    result: null
  completionValidation:
    command: ./docs/ai-spec/tools/validate-task-card.ps1 -TaskPath <task-card> -CheckCompletion
    result: null

source:
  branch: ...
  commitSha: ...
  dirtyWorktree: false
  dirtyPaths: []

environment:
  observedAt: ...
  os: ...
  timezone: ...
  java: ...
  node: ...
  pnpm: ...
  docker: ...
  composeProfiles: []
  composeServices: [] # E4: 涉及的真实 Compose 服务清单，例如 [app, worker, postgres, nginx]
  externalDependencyVersions: {}

execution:
  workingDirectory: ...
  command: ...
  startedAt: ...
  finishedAt: ...
  exitCode: null
  result: PASS # PASS | FAIL | SKIP
  evidenceLevel: E1 # E1 | E2 | E3 | E4 | E5
  e3RealDependencies: [] # E3: 真实依赖列表（PostgreSQL/MinIO/Gitea 等），不可用 Mock 替代
  e4EntryPoint: "" # E4: 入口点，Nginx | Browser | Client | MCP | REST

coverage:
  proven:
    - scenarioId: AC-...
      assertion: ...
      scenarioCategory: normal # normal | failure | denial | recovery
  notProven: []

contractConsistency:
  openapiMatched: null # OpenAPI 契约是否与被测 Commit 一致
  eventSchemaMatched: null # Event Schema 是否与被测 Commit 一致
  migrationMatched: null # Flyway Migration 是否与被测 Commit 一致
  uiMatched: null # UI 资源是否与被测 Commit 一致
  runbookMatched: null # Runbook 是否与被测 Commit 一致

artifacts:
  reports: []
  logs: []
  screenshots: []
  traces: []
  metrics: []
  databaseQueries: []
  auditEvents: [] # 审计事件记录：事件类型、主体、资源、result、errorCode

secrets:
  redactionChecked: false
  findings: []

limitations:
  skippedTests: []
  assumptions: []
  environmentDifferences: []

review:
  recordedBy: ...
  reviewedBy: null
  reviewedAt: null
  accepted: false