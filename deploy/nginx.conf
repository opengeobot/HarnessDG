# ModelHub v1 —— Nginx 唯一业务入口（README 目录规划：deploy/ nginx）。
#
# FILE-002 说明：MinIO 预签名 URL（上传 part URL / 下载 URL）不经此代理。
# 预签名签名覆盖 Host，URL 直接指向 MinIO 公网端点（默认 http://localhost:9000，
# 由 MinIO 服务直接对外暴露）。若经 nginx 反代，签名中的 Host 与代理转发的
# Host 不一致会触发 SignatureDoesNotMatch；v1 保持预签名直连 MinIO。

upstream modelhub_app {
    server app:8080;
}

server {
    listen 80;
    server_name _;

    # 大文件直传走 MinIO 预签名 URL，不经过本代理；
    # 这里仍放开请求体限制，防止管理/API 大载荷被 413 拦截
    client_max_body_size 0;

    # 业务 API：/api/v1/... → app:8080（proxy_pass 不带 URI，原样透传路径）
    location /api/ {
        proxy_pass http://modelhub_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 健康与观测：/actuator/health、/actuator/info 匿名可读；
    # /actuator/prometheus 需 Bearer token（app 侧 SecurityConfig 鉴权）
    location /actuator/ {
        proxy_pass http://modelhub_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
