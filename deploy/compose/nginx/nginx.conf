# ============================================================================
# 功能: Nginx 单域名反向代理。按设计第 12.4 节路由前端、REST、MCP、
#       健康检查与 Gitea。对 /mcp 关闭响应缓冲；大文件不经此上传到后端。
# 时间: 2026-06-29
# 作者: AxeXie
# ============================================================================

user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # 上游服务（Compose 服务名）
    upstream aihub_frontend { server frontend:80; }
    upstream aihub_backend  { server backend:8080; }
    upstream aihub_gitea    { server gitea:3000; }

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    server {
        listen 80;
        server_name _;

        # 前端单页应用
        location / {
            proxy_pass http://aihub_frontend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # REST API
        location /api/ {
            proxy_pass http://aihub_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # MCP Streamable HTTP：关闭缓冲，支持流式响应
        location /mcp {
            proxy_pass http://aihub_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        # 只读健康检查
        location /actuator/health {
            proxy_pass http://aihub_backend;
            proxy_set_header Host $host;
        }

        # Gitea HTTP（含 Git over HTTP）
        location /git/ {
            proxy_pass http://aihub_gitea/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 允许较大的 Git 推送
            client_max_body_size 0;
        }
    }
}
