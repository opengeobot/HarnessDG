# ============================================================================
# 功能: Nginx 单域名反向代理。按设计第 12.4 节路由前端、REST、MCP、
#       健康检查与 Gitea。对 /mcp 关闭响应缓冲；大文件不经此上传到后端。
#       上游地址使用变量 + Docker 内置 resolver 运行时解析，
#       容器重建后 nginx 自动获取新 IP，无需重启即可恢复。
# 时间: 2026-06-29
# 作者: AxeXie
# ============================================================================

user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # gzip 响应压缩——JSON 响应可减少 60-80% 体积
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Docker 内置 DNS（127.0.0.11），按 valid 周期重新解析服务名，
    # 这样 backend/frontend/gitea 容器重建换 IP 后无需重启 nginx。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    server {
        listen 80;
        server_name _;

        # 用变量持有上游地址，触发运行时 DNS 解析。
        # 注意：set 只能用在 server/location 上下文。
        set $aihub_frontend "frontend:80";
        set $aihub_backend  "backend:8080";
        set $aihub_gitea    "gitea:3000";

        # 前端单页应用
        location / {
            proxy_pass http://$aihub_frontend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # REST API
        location /api/ {
            proxy_pass http://$aihub_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Swagger / OpenAPI 文档
        location = /swagger-ui.html {
            proxy_pass http://$aihub_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /swagger-ui/ {
            proxy_pass http://$aihub_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /v3/api-docs {
            proxy_pass http://$aihub_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # MCP Streamable HTTP：关闭缓冲，支持流式响应
        location /mcp {
            proxy_pass http://$aihub_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        # 只读健康检查
        location /actuator/health {
            proxy_pass http://$aihub_backend;
            proxy_set_header Host $host;
        }

        # Gitea HTTP（含 Git over HTTP）
        # 使用变量时 nginx 不再自动剥离 location 前缀，需 rewrite 去掉 /git/
        #
        # 【未来 SSO 免登跳转预留 —— 当前未实现，待 P3 认证体系就绪后落地】
        # 目标：用户登录平台后进入 Gitea 无需二次登录。候选方案：
        #   方案 A（推荐）：平台作为 OIDC Provider，Gitea 配置为 OAuth2 客户端，
        #       通过标准授权码流程免登；回调地址以本入口 /git/ 为基准。
        #   方案 B：在此 location 前置 auth_request 校验平台会话，配合 Gitea
        #       ENABLE_REVERSE_PROXY_AUTHENTICATION，透传可信用户头实现免登。
        # 以上均需平台登录与认证适配器就绪后再实现，本次仅占位说明。
        location /git/ {
            rewrite ^/git/(.*)$ /$1 break;
            proxy_pass http://$aihub_gitea;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 允许较大的 Git 推送
            client_max_body_size 0;
        }
    }
}
