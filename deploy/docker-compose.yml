# ModelHub v1 —— Docker Compose 一键部署（prd/v1 FILE-002：客户端可达对象 public URL）。
#
# 拓扑：
#   nginx(8081) ── /api/ /actuator/ ──▶ app(8080)
#   app ── 内部网络 ──▶ postgres:5432 / redis:6379 / minio:9000 / gitea:3000
#   宿主机 ── 直连 ──▶ minio:9000（预签名 URL 公网端点）/ minio-console:9001 / gitea:3000
#
# FILE-002 关键点：app→MinIO 的服务端流量走内部主机名 minio:9000；
# 预签名 URL 的公网基址（MODEHUB_ARTIFACT_PUBLIC_BASE_URL）必须是对真实
# 浏览器/CLI 可达的外部地址（默认 http://localhost:9000），URL 中禁止出现
# 内部服务名。两套端点分离见 ArtifactConfiguration（S3Client vs S3Presigner）。
#
# 启动：docker compose -f deploy/docker-compose.yml up -d --build
# 覆盖默认值：在 deploy/ 下放置 .env（参考 .env.example），键与 ${...} 对应。

name: modelhub

services:
  # ---------- PostgreSQL 16 ----------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-modelhub}
      POSTGRES_USER: ${POSTGRES_USER:-modelhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-modelhub}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-modelhub} -d $${POSTGRES_DB:-modelhub}"]
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped

  # ---------- Redis 7 ----------
  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped

  # ---------- MinIO（S3 兼容对象存储）----------
  # 9000 = S3 API（预签名 URL 公网端点，直接对宿主机暴露）
  # 9001 = 控制台
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-modelhub}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ModelHub-Minio-1x}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped

  # ---------- Gitea 1.24（Git Provider，sqlite 单机版）----------
  # GITEA__ 环境变量完成自动安装（与 BaseIntegrationTest 测试环境一致），
  # 跳过首次启动的 install 页面；注册关闭，账户由 gitea-init 幂等创建。
  gitea:
    image: gitea/gitea:1.24.0
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: ${GITEA_ROOT_URL:-http://localhost:3000/}
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
    ports:
      - "3000:3000"
    volumes:
      - giteadata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/version"]
      interval: 5s
      timeout: 3s
      retries: 36
    restart: unless-stopped

  # 一次性初始化：创建 provisioning 用的 Gitea 管理员（幂等 —— 已存在则由 || 兜底跳过）。
  # 以运行用户 git 身份执行，避免 root 写 /data 的权限问题（镜像 BaseIntegrationTest 的 execInContainer）。
  gitea-init:
    image: gitea/gitea:1.24.0
    depends_on:
      gitea:
        condition: service_healthy
    volumes:
      - giteadata:/data
    entrypoint:
      - sh
      - -c
      - 'su git -c "gitea admin user create --config /data/gitea/conf/app.ini --username ${GITEA_ADMIN_USER:-modelhub} --password ${GITEA_ADMIN_PASSWORD:-ModelHub-Root-1x} --email modelhub@example.com --admin --must-change-password=false" || echo "gitea admin 已存在（或创建返回非零），幂等跳过"'
    restart: "no"

  # ---------- ModelHub app（Spring Boot，多阶段 Dockerfile 从仓库根构建）----------
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      gitea:
        condition: service_healthy
      gitea-init:
        condition: service_completed_successfully
    environment:
      # ---- 数据库 / Redis：内部主机名仅承载 app→中间件的服务间流量 ----
      MODELHUB_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-modelhub}?stringtype=unspecified
      MODELHUB_DB_USER: ${POSTGRES_USER:-modelhub}
      MODELHUB_DB_PASSWORD: ${POSTGRES_PASSWORD:-modelhub}
      MODELHUB_REDIS_HOST: redis
      # ---- FILE-002：对象存储双端点 ----
      # Java/Worker（multipart 初始化/校验/清理）走内部端点；
      # 预签名 URL 公网基址指向宿主机映射端口（外部可达，禁止 minio:9000）
      MODELHUB_ARTIFACT_INTERNAL_ENDPOINT: http://minio:9000
      MODELHUB_ARTIFACT_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:-http://localhost:9000}
      MODELHUB_ARTIFACT_ACCESS_KEY: ${MINIO_ROOT_USER:-modelhub}
      MODELHUB_ARTIFACT_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-ModelHub-Minio-1x}
      MODELHUB_ARTIFACT_BUCKET: artifacts
      # git source 自建下载端点（/api/v1/downloads/...）的绝对 URL 前缀 → 走 Nginx 入口
      MODELHUB_ARTIFACT_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8081}
      # ---- Gitea provisioning（catalog Saga 的管理员凭据，与 gitea-init 一致）----
      MODELHUB_GITEA_BASE_URL: http://gitea:3000
      MODELHUB_GITEA_USERNAME: ${GITEA_ADMIN_USER:-modelhub}
      MODELHUB_GITEA_PASSWORD: ${GITEA_ADMIN_PASSWORD:-ModelHub-Root-1x}
      # ---- 首个 platform_admin（BootstrapAdminRunner：平台无平台角色时一次性创建）----
      MODELHUB_BOOTSTRAP_ENABLED: "true"
      MODELHUB_BOOTSTRAP_USERNAME: ${BOOTSTRAP_USERNAME:-platform-root}
      MODELHUB_BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:-Boot-Strap-1x}
      # ---- 安全：allowed-origins 为空时 refresh/logout fail-closed 拒绝 ----
      # 默认放行 Vite 开发服务器与本机 Nginx 入口，逗号分隔
      MODELHUB_ALLOWED_ORIGINS: ${MODELHUB_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8081}
      # JWT 私钥：为空时启动生成临时密钥（重启后已发 token 失效，仅限非生产；
      # 生产经 .env 注入 PKCS#8 PEM，换行用 \n 转义）
      MODELHUB_JWT_PRIVATE_KEY_PEM: ${MODELHUB_JWT_PRIVATE_KEY_PEM:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    restart: unless-stopped

  # ---------- Nginx：唯一业务入口（8081 → 80）----------
  # 仅反代 /api/ 与 /actuator/；MinIO 预签名 URL 不经此代理（见 nginx.conf 头部说明）。
  nginx:
    image: nginx:alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
  giteadata:
