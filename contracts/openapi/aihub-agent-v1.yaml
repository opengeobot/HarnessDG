# AIHub Agent API v1 — 裁剪契约
# 面向 Agent/MCP 客户端的精简 OpenAPI 子集。
# 两个 Profile：read-only（只读检索）和 contribution（写入贡献）。
# 所有端点复用主 API 的 Application Service，授权逻辑一致。
openapi: 3.1.0
info:
  title: AIHub Agent API
  version: 0.1.0
  x-verification-status: implemented-unverified
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    Agent-friendly subset of the AIHub REST API.
    Two profiles: read-only (asset search/inspect) and contribution (draft/create/upload).
    Authentication: Bearer JWT issued by the platform.
    All responses include x-request-id and x-trace-id headers for debugging.
  contact:
    name: AIHub Platform Team

servers:
  - url: /api/v1
    description: Agent API base path

# Profile tags
tags:
  - name: read-only
    description: Read-only profile — asset search, inspect, version listing, download handle.
  - name: contribution
    description: Contribution profile — draft creation, upload session management.

paths:
  /agent/assets/search:
    get:
      operationId: agentSearchAssets
      x-implementation-status: implemented-unverified
      x-mcp-equivalent: asset_search
      x-error-codes: [AUTH_UNAUTHENTICATED, AUTH_PERMISSION_DENIED]
      tags: [read-only]
      summary: Search assets (read-only profile)
      description: |
        Search the asset catalog with access-control filtering.
        Reuses AssetApplicationService.searchAssets().
      parameters:
        - name: keyword
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { type: string, enum: [MODEL, DATASET] }
        - name: namespace
          in: query
          schema: { type: string }
        - name: tagId
          in: query
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AssetSummary' }
                  nextCursor: { type: [string, 'null'] }
                  hasMore: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /agent/assets/{assetId}:
    get:
      operationId: agentGetAsset
      x-implementation-status: implemented-unverified
      x-mcp-equivalent: asset_get
      x-error-codes: [AUTH_UNAUTHENTICATED, AUTH_PERMISSION_DENIED, ASSET_NOT_FOUND]
      tags: [read-only]
      summary: Get asset details (read-only profile)
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Asset details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agent/assets/{assetId}/versions:
    get:
      operationId: agentListVersions
      x-implementation-status: implemented-unverified
      x-mcp-equivalent: asset_list_versions
      x-error-codes: [AUTH_UNAUTHENTICATED, ASSET_NOT_FOUND]
      tags: [read-only]
      summary: List versions for an asset (read-only profile)
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Version list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/VersionSummary' }
                  nextCursor: { type: [string, 'null'] }
                  hasMore: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /agent/versions/{versionId}:
    get:
      operationId: agentGetVersion
      x-implementation-status: implemented-unverified
      x-mcp-equivalent: asset_get_version
      x-error-codes: [AUTH_UNAUTHENTICATED, AUTH_PERMISSION_DENIED, VERSION_NOT_FOUND]
      tags: [read-only]
      summary: Get version details (read-only profile)
      parameters:
        - name: versionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Version details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agent/versions/{versionId}/download:
    post:
      operationId: agentRequestDownload
      x-implementation-status: implemented-unverified
      x-mcp-equivalent: asset_request_download
      x-error-codes: [AUTH_UNAUTHENTICATED, AUTH_PERMISSION_DENIED, VERSION_NOT_FOUND]
      tags: [read-only]
      summary: Request download ticket (returns handle, not URL)
      parameters:
        - name: versionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                artifactId: { type: [string, 'null'] }
      responses:
        '200':
          description: Download ticket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DownloadTicket' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /agent/assets/{assetId}/versions/draft:
    post:
      operationId: agentCreateDraftVersion
      x-implementation-status: implemented-unverified
      x-mcp-equivalent: asset_create_draft
      x-error-codes: [AUTH_UNAUTHENTICATED, AUTH_PERMISSION_DENIED, ASSET_NOT_FOUND, ASSET_VERSION_CONFLICT, RATE_LIMIT_EXCEEDED]
      tags: [contribution]
      summary: Create a draft version (contribution profile)
      description: |
        Requires mcp.writeTools.enabled=true and asset:manage permission.
        Requires Idempotency-Key header.
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: string }
      responses:
        '201':
          description: Draft version created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /agent/assets/{assetId}/upload-sessions:
    post:
      operationId: agentCreateUploadSession
      x-implementation-status: implemented-unverified
      x-mcp-equivalent: asset_create_upload_session
      x-error-codes: [AUTH_UNAUTHENTICATED, AUTH_PERMISSION_DENIED, VERSION_NOT_FOUND, RATE_LIMIT_EXCEEDED]
      tags: [contribution]
      summary: Create an upload session (contribution profile)
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [versionId, totalBytes, fileCount]
              properties:
                versionId: { type: string }
                totalBytes: { type: integer, format: int64 }
                fileCount: { type: integer }
      responses:
        '201':
          description: Upload session created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadSessionSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /agent/assets/{assetId}/upload-sessions/{sessionId}/complete:
    post:
      operationId: agentCompleteUploadSession
      x-implementation-status: implemented-unverified
      x-mcp-equivalent: asset_complete_upload
      x-error-codes: [AUTH_UNAUTHENTICATED, AUTH_PERMISSION_DENIED, UPLOAD_SESSION_NOT_FOUND, RATE_LIMIT_EXCEEDED]
      tags: [contribution]
      summary: Complete an upload session (contribution profile)
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string }
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                parts:
                  type: array
                  items:
                    type: object
                    properties:
                      partNumber: { type: integer }
                      etag: { type: string }
                files:
                  type: array
                  items:
                    type: object
                    properties:
                      path: { type: string }
                      sha256: { type: string }
                      size: { type: integer, format: int64 }
                      mediaType: { type: string }
                      sampleContent: { type: string }
      responses:
        '200':
          description: Upload session completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadSessionSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /agent/assets/{assetId}/upload-sessions/{sessionId}:
    get:
      operationId: agentGetUploadSession
      x-implementation-status: implemented-unverified
      x-mcp-equivalent: asset_get_upload_status
      x-error-codes: [AUTH_UNAUTHENTICATED, AUTH_PERMISSION_DENIED, UPLOAD_SESSION_NOT_FOUND, RATE_LIMIT_EXCEEDED]
      tags: [contribution]
      summary: Get upload session status (contribution profile)
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string }
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Upload session status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadSessionSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

components:
  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Platform-issued JWT. Agent credentials exchange via /auth/agent/token.

  schemas:
    AssetSummary:
      type: object
      properties:
        assetId: { type: string }
        coordinate: { type: string, description: Stable aih:// URI }
        type: { type: string, enum: [MODEL, DATASET] }
        namespace: { type: string }
        name: { type: string }
        displayName: { type: string }
        description: { type: string }
        visibility: { type: string }
        status: { type: string }
        license: { type: string }
        matchedFields:
          type: array
          items: { type: string }
          description: Keyword search hit fields (empty when no keyword)
        latestPublished:
          type: [string, 'null']
          description: Server-computed latest PUBLISHED version label

    AssetDetail:
      allOf:
        - $ref: '#/components/schemas/AssetSummary'
        - type: object
          properties:
            organizationId: { type: string }
            owners: { type: array, items: { type: string } }
            tags: { type: array, items: { type: string } }
            provisioningStatus: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    VersionSummary:
      type: object
      properties:
        versionId: { type: string }
        assetId: { type: string }
        version: { type: string }
        status: { type: string, enum: [DRAFT, VALIDATING, PENDING_REVIEW, PUBLISHED, DEPRECATED, ARCHIVED] }
        gitTag: { type: [string, 'null'] }
        manifestDigest: { type: [string, 'null'] }
        publishedAt: { type: [string, 'null'], format: date-time }

    DownloadTicket:
      type: object
      description: Download handle; MCP returns this shape without presignedUrl.
      properties:
        versionId: { type: string }
        artifactId: { type: [string, 'null'] }
        method: { type: string, enum: [PRESIGNED_URL, GIT_DVC] }
        expiresAt: { type: [string, 'null'], format: date-time }
        fileName: { type: [string, 'null'] }
        fileSize: { type: [integer, 'null'], format: int64 }
        gitCloneUrl: { type: [string, 'null'] }
        revision: { type: [string, 'null'] }
        dvcCredentialsUrl: { type: [string, 'null'] }
        assetId: { type: string }

    UploadSessionSummary:
      type: object
      properties:
        sessionId: { type: string }
        assetId: { type: string }
        versionId: { type: string }
        status: { type: string }
        totalBytes: { type: integer, format: int64 }
        fileCount: { type: integer }
        materializeJobId: { type: [string, 'null'] }
        expiresAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            attributes: { type: object }

  responses:
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found (or not accessible)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Resource state conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Agent/MCP rate limit exceeded
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

security:
  - bearerJwt: []
