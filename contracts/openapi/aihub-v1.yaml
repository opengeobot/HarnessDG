# AIHub Platform API - P0-B→P5 全阶段实施契约
# 依据：prd/DEEP_RESEARCH_内部AI资产管理平台设计.md 第 5、8、11、15、16 章
# 说明：P0-B 平台基础 + P1 资产目录 + P2 版本传输 + P3 发布治理 +
#       P4 Agent 集成 + P5 质量运营均已实施。
#       x-implementation-status 用于区分 planned/partial/implemented。
# 作者：AxeXie
openapi: 3.1.0
x-contract-status: implemented-p5
x-document-version: 3.0
info:
  title: AIHub Platform API
  version: v1
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    内部 AI 资产管理平台 REST API 契约。统一成功响应为 ApiResponse，统一失败响应为 ApiError。
    Agent 不应依赖本地化 message 做分支判断，只依赖稳定的 code 与 retryable。
servers:
  - url: /api/v1
    description: 统一 API 前缀

tags:
  - { name: auth, description: 本地身份与 JWT 生命周期 }
  - { name: users, description: Principal 与本地用户管理 }
  - { name: organizations, description: 组织、项目、团队与成员作用域 }
  - { name: authorization, description: 角色、权限、绑定与 ACL }
  - { name: taxonomy, description: 字典、标签与国际化治理 }
  - { name: configuration, description: 非敏感运行配置 }
  - { name: jobs, description: 持久化任务管理 }
  - { name: audit, description: 不可变审计查询 }
  - { name: notifications, description: 站内通知 }
  - { name: system, description: 系统观测与依赖诊断 }
  - { name: assets, description: 冻结整改中的资产目录 }
  - { name: discussions, description: 评论管理与线程管控 }
  - { name: version, description: 版本管理与发布审批 }
  - { name: transfer, description: 下载票据 }
  - { name: integration, description: 外部系统集成 }
  - { name: mcp, description: MCP 协议端点 }

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      operationId: login
      summary: 本地用户登录并签发 JWT
      tags: [auth]
      security: []
      x-implementation-status: implemented
      x-error-codes: [AUTH_UNAUTHENTICATED, AUTH_INVALID_CREDENTIALS, AUTH_ACCOUNT_LOCKED, AUTH_ACCOUNT_DISABLED, COMMON_INVALID_ARGUMENT]
      x-audit-event: AUTH_LOGIN_SUCCEEDED_OR_FAILED
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录成功；浏览器刷新 JWT 同时写入 Secure/HttpOnly/SameSite Cookie
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '423': { $ref: '#/components/responses/ErrorResponse' }

  /auth/refresh:
    post:
      operationId: refreshToken
      summary: 轮换刷新 JWT 并签发新访问 JWT
      tags: [auth]
      security: []
      x-implementation-status: implemented
      x-error-codes: [AUTH_UNAUTHENTICATED, AUTH_TOKEN_EXPIRED, AUTH_REFRESH_REPLAYED]
      x-audit-event: AUTH_TOKEN_REFRESHED_OR_REPLAY_REJECTED
      requestBody:
        required: false
        description: 浏览器使用安全 Cookie；非浏览器客户端可在请求体提交刷新 JWT。
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenRequest' }
      responses:
        '200':
          description: 刷新成功，旧刷新 JWT 立即失效
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/ErrorResponse' }

  /auth/token:
    post:
      operationId: exchangeClientCredential
      summary: Agent/Service/API Client 凭据换取 JWT
      tags: [auth]
      security: []
      x-implementation-status: implemented
      x-error-codes: [AUTH_UNAUTHENTICATED, AUTH_ACCOUNT_DISABLED, COMMON_INVALID_ARGUMENT]
      x-audit-event: CLIENT_TOKEN_ISSUED_OR_REJECTED
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientCredentialTokenRequest' }
      responses:
        '200':
          description: 凭据有效，签发访问与轮换刷新 JWT
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }

  /auth/logout:
    post:
      operationId: logout
      summary: 吊销当前 Token Family
      tags: [auth]
      x-implementation-status: implemented
      x-error-codes: [AUTH_UNAUTHENTICATED]
      x-audit-event: AUTH_LOGOUT
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }

  /me:
    get:
      operationId: getCurrentPrincipal
      summary: 获取当前主体、角色和粗粒度 Scope
      tags: [auth]
      x-implementation-status: implemented
      x-error-codes: [AUTH_UNAUTHENTICATED]
      responses:
        '200':
          description: 当前主体
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CurrentPrincipal' }
        '401': { $ref: '#/components/responses/ErrorResponse' }

  /me/password:
    put:
      operationId: changeCurrentUserPassword
      summary: 修改当前本地用户密码并吊销其他 Token Family
      tags: [auth]
      x-implementation-status: implemented
      x-error-codes: [AUTH_UNAUTHENTICATED, PASSWORD_POLICY_VIOLATION, COMMON_INVALID_ARGUMENT]
      x-audit-event: USER_PASSWORD_CHANGED
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200':
          description: 密码修改成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }

  /system/principals:
    get:
      operationId: listPrincipals
      summary: 查询统一访问主体
      tags: [users]
      x-implementation-status: implemented
      x-error-codes: [AUTH_PERMISSION_DENIED]
      x-required-permissions: [user:read]
      parameters:
        - { name: principalType, in: query, schema: { $ref: '#/components/schemas/PrincipalType' } }
        - { name: keyword, in: query, schema: { type: string } }
      responses:
        '200':
          description: 主体列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/PrincipalSummary' } }
        '403': { $ref: '#/components/responses/ErrorResponse' }

  /system/users:
    get:
      operationId: listUsers
      summary: 分页查询本地用户
      tags: [users]
      x-implementation-status: implemented
      x-error-codes: [AUTH_PERMISSION_DENIED]
      x-required-permissions: [user:read]
      parameters:
        - { name: keyword, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/UserStatus' } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: 用户列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PageResultUser' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
    post:
      operationId: createUser
      summary: 创建本地用户
      tags: [users]
      x-implementation-status: implemented
      x-error-codes: [USER_ALREADY_EXISTS, COMMON_INVALID_ARGUMENT, AUTH_PERMISSION_DENIED, IDEMPOTENCY_KEY_CONFLICT]
      x-required-permissions: [user:manage]
      x-audit-event: USER_CREATED
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: 用户创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserView' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }

  /system/users/{userId}:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, pattern: '^usr_' } }
    get:
      operationId: getUser
      summary: 获取本地用户
      tags: [users]
      x-implementation-status: implemented
      x-error-codes: [USER_NOT_FOUND, AUTH_PERMISSION_DENIED]
      x-required-permissions: [user:read]
      responses:
        '200':
          description: 用户详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserView' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
    patch:
      operationId: updateUser
      summary: 更新本地用户资料
      tags: [users]
      x-implementation-status: implemented
      x-error-codes: [USER_NOT_FOUND, CONCURRENT_MODIFICATION, AUTH_PERMISSION_DENIED, COMMON_INVALID_ARGUMENT]
      x-required-permissions: [user:manage]
      x-audit-event: USER_UPDATED
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: 用户更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserView' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }

  '/system/users/{userId}:enable':
    post:
      operationId: enableUser
      summary: 启用本地用户
      tags: [users]
      x-implementation-status: implemented
      x-error-codes: [USER_NOT_FOUND, AUTH_PERMISSION_DENIED]
      x-required-permissions: [user:manage]
      x-audit-event: USER_ENABLED
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, pattern: '^usr_' } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: 已启用, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }

  '/system/users/{userId}:disable':
    post:
      operationId: disableUser
      summary: 禁用本地用户并吊销其 Token
      tags: [users]
      x-implementation-status: implemented
      x-error-codes: [USER_NOT_FOUND, AUTH_PERMISSION_DENIED]
      x-required-permissions: [user:manage]
      x-audit-event: USER_DISABLED
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, pattern: '^usr_' } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: 已禁用, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }

  '/system/users/{userId}:reset-password':
    post:
      operationId: resetUserPassword
      summary: 设置临时密码、强制下次修改并吊销现有 Token
      tags: [users]
      x-implementation-status: implemented
      x-error-codes: [USER_NOT_FOUND, AUTH_PERMISSION_DENIED, PASSWORD_POLICY_VIOLATION, COMMON_INVALID_ARGUMENT]
      x-required-permissions: [user:manage]
      x-audit-event: USER_PASSWORD_RESET
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, pattern: '^usr_' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200': { description: 已重置, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }

  /system/agents:
    get:
      operationId: listAgents
      summary: 查询 Agent 主体
      tags: [users]
      x-implementation-status: implemented
      x-error-codes: [AUTH_PERMISSION_DENIED]
      x-required-permissions: [authorization:read]
      responses:
        '200':
          description: Agent 列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/AgentView' } }
        '403': { $ref: '#/components/responses/ErrorResponse' }
    post:
      operationId: createAgent
      summary: 注册 Agent 主体
      tags: [users]
      x-implementation-status: implemented
      x-error-codes: [AUTH_PERMISSION_DENIED, COMMON_INVALID_ARGUMENT, IDEMPOTENCY_KEY_CONFLICT]
      x-required-permissions: [agent:register]
      x-audit-event: AGENT_REGISTERED
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAgentRequest' }
      responses:
        '201':
          description: Agent 注册成功；长期凭据只在创建响应中出现一次
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CreatedAgent' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }

  '/system/agents/{agentId}:enable':
    post:
      operationId: enableAgent
      summary: 启用 Agent
      tags: [users]
      x-implementation-status: implemented
      x-error-codes: [AGENT_NOT_FOUND, AUTH_PERMISSION_DENIED]
      x-required-permissions: [agent:authorize]
      x-audit-event: AGENT_ENABLED
      parameters:
        - { name: agentId, in: path, required: true, schema: { type: string, pattern: '^agt_' } }
      responses:
        '200': { description: 已启用, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }

  '/system/agents/{agentId}:disable':
    post:
      operationId: disableAgent
      summary: 禁用 Agent 并吊销凭据/Token
      tags: [users]
      x-implementation-status: implemented
      x-error-codes: [AGENT_NOT_FOUND, AUTH_PERMISSION_DENIED]
      x-required-permissions: [agent:authorize]
      x-audit-event: AGENT_DISABLED
      parameters:
        - { name: agentId, in: path, required: true, schema: { type: string, pattern: '^agt_' } }
      responses:
        '200': { description: 已禁用, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }

  /system/agents/{agentId}/tool-allowlist:
    put:
      operationId: updateAgentToolAllowlist
      summary: 替换 Agent MCP Tool 白名单
      tags: [authorization]
      x-implementation-status: implemented
      x-error-codes: [AGENT_NOT_FOUND, AUTH_PERMISSION_DENIED, COMMON_INVALID_ARGUMENT]
      x-required-permissions: [agent:authorize]
      x-audit-event: AGENT_TOOL_ALLOWLIST_UPDATED
      parameters:
        - { name: agentId, in: path, required: true, schema: { type: string, pattern: '^agt_' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAgentToolAllowlistRequest' }
      responses:
        '200': { description: 白名单已更新, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }

  /system/organizations:
    get:
      operationId: listOrganizations
      summary: 查询调用者可管理或可访问的组织
      tags: [organizations]
      x-implementation-status: implemented
      x-error-codes: [AUTH_PERMISSION_DENIED]
      x-required-permissions: [project:view]
      responses:
        '200':
          description: 组织列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/OrganizationView' } }
        '403': { $ref: '#/components/responses/ErrorResponse' }
    post:
      operationId: createOrganization
      summary: 创建组织作用域
      tags: [organizations]
      x-implementation-status: implemented
      x-error-codes: [ORGANIZATION_ALREADY_EXISTS, AUTH_PERMISSION_DENIED, COMMON_INVALID_ARGUMENT, IDEMPOTENCY_KEY_CONFLICT]
      x-required-permissions: [organization:manage]
      x-audit-event: ORGANIZATION_CREATED
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrganizationRequest' }
      responses:
        '201':
          description: 组织创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OrganizationView' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }

  /system/organizations/{organizationId}/members:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, pattern: '^org_' } }
    get:
      operationId: listOrganizationMembers
      summary: 查询组织成员
      tags: [organizations]
      x-implementation-status: implemented
      x-error-codes: [ORGANIZATION_NOT_FOUND, AUTH_PERMISSION_DENIED]
      x-required-permissions: [organization:manage]
      responses:
        '200':
          description: 组织成员列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/OrganizationMemberView' } }
        '403': { $ref: '#/components/responses/ErrorResponse' }
    post:
      operationId: addOrganizationMember
      summary: 添加组织成员
      tags: [organizations]
      x-implementation-status: implemented
      x-error-codes: [ORGANIZATION_NOT_FOUND, ORGANIZATION_MEMBER_ALREADY_EXISTS, AUTH_PERMISSION_DENIED, IDEMPOTENCY_KEY_CONFLICT]
      x-required-permissions: [organization:manage]
      x-audit-event: ORGANIZATION_MEMBER_ADDED
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddOrganizationMemberRequest' }
      responses:
        '201':
          description: 成员添加成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OrganizationMemberView' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }

  /system/organizations/{organizationId}/members/{principalId}:
    delete:
      operationId: removeOrganizationMember
      summary: 移除组织成员并使其组织作用域授权失效
      tags: [organizations]
      x-implementation-status: implemented
      x-error-codes: [ORGANIZATION_NOT_FOUND, ORGANIZATION_MEMBER_NOT_FOUND, AUTH_PERMISSION_DENIED]
      x-required-permissions: [organization:manage]
      x-audit-event: ORGANIZATION_MEMBER_REMOVED
      parameters:
        - { name: organizationId, in: path, required: true, schema: { type: string, pattern: '^org_' } }
        - { name: principalId, in: path, required: true, schema: { type: string, pattern: '^prn_' } }
      responses:
        '200': { description: 已移除, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }

  /system/organizations/{organizationId}/projects:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string, pattern: '^org_' } }
    get:
      operationId: listOrganizationProjects
      summary: 查询组织项目
      tags: [organizations]
      x-implementation-status: implemented
      x-error-codes: [ORGANIZATION_NOT_FOUND, AUTH_PERMISSION_DENIED]
      x-required-permissions: [project:view]
      responses:
        '200':
          description: 项目列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/ProjectView' } }
        '403': { $ref: '#/components/responses/ErrorResponse' }
    post:
      operationId: createProject
      summary: 创建组织项目
      tags: [organizations]
      x-implementation-status: implemented
      x-error-codes: [PROJECT_ALREADY_EXISTS, ORGANIZATION_NOT_FOUND, AUTH_PERMISSION_DENIED, IDEMPOTENCY_KEY_CONFLICT]
      x-required-permissions: [project:manage]
      x-audit-event: PROJECT_CREATED
      parameters:
