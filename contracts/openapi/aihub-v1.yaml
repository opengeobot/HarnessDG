      properties:
        permissionCode: { type: string, example: asset:read }
        resource: { type: string, example: asset }
        action: { type: string, example: read }
        i18nKey: { type: string }

    CreateRoleRequest:
      type: object
      additionalProperties: false
      required: [roleCode, roleName, permissionCodes]
      properties:
        roleCode:
          type: string
          pattern: '^[a-z][a-z0-9._-]{2,63}$'
        roleName: { type: string, minLength: 1, maxLength: 128 }
        permissionCodes:
          type: array
          uniqueItems: true
          items: { type: string }

    UpdateRoleRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        roleName: { type: string, minLength: 1, maxLength: 128 }
        permissionCodes:
          type: array
          uniqueItems: true
          items: { type: string }
        expectedVersion: { type: integer, minimum: 1 }

    RoleView:
      type: object
      required: [roleId, roleCode, roleName, roleType, permissionCodes, version]
      properties:
        roleId: { type: string }
        roleCode: { type: string }
        roleName: { type: string }
        roleType:
          type: string
          enum: [SYSTEM, CUSTOM]
        permissionCodes:
          type: array
          items: { type: string }
        version: { type: integer, minimum: 1 }

    ScopeType:
      type: string
      enum: [PLATFORM, ORGANIZATION, PROJECT, ASSET]

    CreateRoleBindingRequest:
      type: object
      additionalProperties: false
      required: [principalId, roleId, scopeType]
      properties:
        principalId: { type: string, pattern: '^prn_' }
        roleId: { type: string }
        scopeType: { $ref: '#/components/schemas/ScopeType' }
        scopeId:
          type: [string, 'null']
          description: PLATFORM 作用域必须为空，其他作用域必须提供。

    RoleBindingView:
      type: object
      required: [bindingId, principalId, roleId, scopeType, createdAt]
      properties:
        bindingId: { type: string }
        principalId: { type: string }
        roleId: { type: string }
        scopeType: { $ref: '#/components/schemas/ScopeType' }
        scopeId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    CreateResourceAclRequest:
      type: object
      additionalProperties: false
      required: [principalId, resourceType, resourceId, permissionCodes]
      properties:
        principalId: { type: string, pattern: '^prn_' }
        resourceType: { type: string, example: ASSET }
        resourceId: { type: string }
        permissionCodes:
          type: array
          uniqueItems: true
          minItems: 1
          items: { type: string }

    ResourceAclView:
      type: object
      required: [aclId, principalId, resourceType, resourceId, permissionCodes, createdAt]
      properties:
        aclId: { type: string }
        principalId: { type: string }
        resourceType: { type: string }
        resourceId: { type: string }
        permissionCodes:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }

    TaxonomyStatus:
      type: string
      enum: [ACTIVE, DISABLED]

    DictionaryTypeView:
      type: object
      required: [dictCode, i18nKey, version, status]
      properties:
        dictCode: { type: string }
        i18nKey: { type: string }
        version: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/TaxonomyStatus' }

    DictionaryItemView:
      type: object
      required: [dictCode, itemCode, i18nKey, sortOrder, status, version]
      properties:
        dictCode: { type: string }
        itemCode: { type: string }
        i18nKey: { type: string }
        sortOrder: { type: integer }
        status: { $ref: '#/components/schemas/TaxonomyStatus' }
        version: { type: integer, minimum: 1 }

    CreateDictionaryItemRequest:
      type: object
      additionalProperties: false
      required: [itemCode, i18nKey]
      properties:
        itemCode:
          type: string
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$'
        i18nKey: { type: string }
        sortOrder: { type: integer, default: 0 }

    UpdateDictionaryItemRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        i18nKey: { type: string }
        sortOrder: { type: integer }
        status: { $ref: '#/components/schemas/TaxonomyStatus' }
        expectedVersion: { type: integer, minimum: 1 }

    TagScopeType:
