components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        平台签发的短期访问 JWT。JWT 使用非对称签名和 kid；资源级权限由后端实时判断，
        不以 JWT 内角色替代 RBAC/ACL/资源状态校验。

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 当前 Principal 范围内唯一的写请求幂等键。
      schema:
        type: string
        minLength: 8
        maxLength: 128

  responses:
    ErrorResponse:
      description: 统一失败响应
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    ApiResponse:
      type: object
      description: 统一成功响应包装
      required:
        - requestId
        - traceId
        - timestamp
      properties:
        data:
          description: 业务数据载荷，结构由具体接口定义
          type: [object, array, string, number, integer, boolean, 'null']
        requestId:
          type: string
          description: 请求标识，回显 X-Request-Id
          example: req_01J0000000000000000000000
        traceId:
          type: string
          description: 分布式追踪标识
          example: 4bf92f3577b34da6a3ce929d0e0e4736
        timestamp:
          type: string
          format: date-time
          description: 服务端 UTC 时间戳
          example: '2026-06-29T08:00:00Z'

    ApiError:
      type: object
      description: 统一失败响应
      required:
        - code
        - message
        - retryable
        - requestId
        - traceId
      properties:
        code:
          type: string
          description: 稳定的语义错误码，分支判断只依赖此字段
          example: ASSET_VERSION_CONFLICT
        message:
          type: string
          description: 默认（可本地化）错误消息，不用于分支判断
          example: Version already exists
        i18nKey:
          type: string
          description: 国际化文案 Key
          example: error.asset.versionConflict
        details:
          type: object
          description: 附加上下文，结构由错误码定义
          additionalProperties: true
        retryable:
          type: boolean
          description: 是否可重试；仅当为 true 时 Agent 才应按退避策略重试
          example: false
        requestId:
          type: string
          example: req_01J0000000000000000000000
        traceId:
          type: string
          example: 4bf92f3577b34da6a3ce929d0e0e4736

    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 128

    RefreshTokenRequest:
      type: object
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          format: password
          writeOnly: true
          description: 非浏览器客户端提交；浏览器优先使用 Secure/HttpOnly/SameSite Cookie。

    ClientCredentialTokenRequest:
      type: object
      additionalProperties: false
      required: [grantType, subjectId, credential]
      properties:
        grantType:
          type: string
          const: client_credentials
        subjectId:
          type: string
          description: Agent、Service 或 API Client 的稳定业务 ID。
        credential:
          type: string
          format: password
          writeOnly: true

    TokenPair:
      type: object
      required: [tokenType, accessToken, expiresIn, refreshExpiresIn, principal]
      properties:
        tokenType:
          type: string
          const: Bearer
        accessToken:
          type: string
          description: 默认 15 分钟有效；客户端不得写入持久化浏览器存储。
        refreshToken:
          type: string
          description: 默认 7 天有效并在每次刷新时轮换；浏览器响应可仅通过安全 Cookie 返回。
        expiresIn:
          type: integer
          description: 访问 JWT 剩余秒数。
          example: 900
        refreshExpiresIn:
          type: integer
          description: 刷新 JWT 剩余秒数。
          example: 604800
        principal:
          $ref: '#/components/schemas/CurrentPrincipal'

    PrincipalType:
      type: string
      enum: [USER, AGENT, SERVICE, API_CLIENT, WORKER]

    CurrentPrincipal:
      type: object
      required: [principalId, principalType, subject, roles, scopes, locale]
      properties:
        principalId: { type: string, pattern: '^prn_' }
        userId:
          type: [string, 'null']
          pattern: '^usr_'
        principalType: { $ref: '#/components/schemas/PrincipalType' }
        subject: { type: string }
        displayName: { type: [string, 'null'] }
        organizationId: { type: [string, 'null'] }
        roles:
          type: array
          items: { type: string }
        scopes:
          type: array
          items: { type: string }
        locale: { type: string, example: zh-CN }
        forcePasswordChange: { type: boolean, default: false }

    PrincipalStatus:
      type: string
      enum: [ACTIVE, LOCKED, DISABLED]

    PrincipalSummary:
      type: object
      required: [principalId, principalType, subject, status]
      properties:
        principalId: { type: string, pattern: '^prn_' }
        principalType: { $ref: '#/components/schemas/PrincipalType' }
        subject: { type: string }
        displayName: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/PrincipalStatus' }

    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          writeOnly: true
        newPassword:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 128

    UserStatus:
      type: string
      enum: [PENDING_ACTIVATION, ACTIVE, LOCKED, DISABLED]

    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [username, displayName, temporaryPassword]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: '^[a-zA-Z0-9._-]+$'
        displayName: { type: string, minLength: 1, maxLength: 128 }
        email: { type: [string, 'null'], format: email }
        locale: { type: string, default: zh-CN }
        temporaryPassword:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 128

    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName: { type: string, minLength: 1, maxLength: 128 }
        email: { type: [string, 'null'], format: email }
        locale: { type: string }

    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [temporaryPassword]
      properties:
        temporaryPassword:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 128

    UserView:
      type: object
      required: [userId, principalId, username, displayName, status, locale, createdAt, updatedAt]
      properties:
        userId: { type: string, pattern: '^usr_' }
        principalId: { type: string, pattern: '^prn_' }
        username: { type: string }
        displayName: { type: string }
        email: { type: [string, 'null'], format: email }
        locale: { type: string }
        status: { $ref: '#/components/schemas/UserStatus' }
        forcePasswordChange: { type: boolean }
        lastLoginAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PageResultUser:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/UserView' }
        page: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1 }
        total: { type: integer, format: int64, minimum: 0 }

    CreateAgentRequest:
      type: object
      additionalProperties: false
      required: [displayName, agentType, maxSensitivityLevel, scopes]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 128 }
        agentType: { type: string, maxLength: 64 }
        vendor: { type: [string, 'null'], maxLength: 64 }
        maxSensitivityLevel: { type: integer, minimum: 0 }
        scopes:
          type: array
          uniqueItems: true
          items: { type: string }

    AgentView:
      type: object
      required: [agentId, principalId, displayName, agentType, status, maxSensitivityLevel, scopes, toolAllowlist]
      properties:
        agentId: { type: string, pattern: '^agt_' }
        principalId: { type: string, pattern: '^prn_' }
        displayName: { type: string }
        agentType: { type: string }
        vendor: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/PrincipalStatus' }
        maxSensitivityLevel: { type: integer, minimum: 0 }
        scopes:
          type: array
          items: { type: string }
        toolAllowlist:
          type: array
          items: { type: string }

    CreatedAgent:
      allOf:
        - $ref: '#/components/schemas/AgentView'
        - type: object
          required: [credential]
          properties:
            credential:
              type: string
              format: password
              description: 仅创建成功响应返回一次；服务端只保存摘要。

    UpdateAgentToolAllowlistRequest:
      type: object
      additionalProperties: false
      required: [tools]
      properties:
        tools:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: '^[a-z][a-z0-9_]{2,127}$'

    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,62}[a-z0-9]$'
        name: { type: string, minLength: 1, maxLength: 128 }
        giteaOrganization: { type: [string, 'null'], maxLength: 128 }

    OrganizationView:
      type: object
      required: [organizationId, code, name, status, createdAt]
      properties:
        organizationId: { type: string, pattern: '^org_' }
        code: { type: string }
        name: { type: string }
        giteaOrganization: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/PrincipalStatus' }
        createdAt: { type: string, format: date-time }

    AddOrganizationMemberRequest:
      type: object
      additionalProperties: false
      required: [principalId]
      properties:
        principalId: { type: string, pattern: '^prn_' }

    OrganizationMemberView:
      type: object
      required: [organizationId, principalId, joinedAt]
      properties:
        organizationId: { type: string, pattern: '^org_' }
        principalId: { type: string, pattern: '^prn_' }
        joinedAt: { type: string, format: date-time }

    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,62}[a-z0-9]$'
        name: { type: string, minLength: 1, maxLength: 128 }

    ProjectView:
      type: object
      required: [projectId, organizationId, code, name, status, createdAt]
      properties:
        projectId: { type: string, pattern: '^prj_' }
        organizationId: { type: string, pattern: '^org_' }
        code: { type: string }
        name: { type: string }
        status: { $ref: '#/components/schemas/PrincipalStatus' }
        createdAt: { type: string, format: date-time }

    PermissionView:
      type: object
      required: [permissionCode, resource, action, i18nKey]
      properties:
        permissionCode: { type: string, example: asset:read }
        resource: { type: string, example: asset }
        action: { type: string, example: read }
        i18nKey: { type: string }

    CreateRoleRequest:
      type: object
      additionalProperties: false
      required: [roleCode, roleName, permissionCodes]
      properties:
        roleCode:
          type: string
          pattern: '^[a-z][a-z0-9._-]{2,63}$'
        roleName: { type: string, minLength: 1, maxLength: 128 }
        permissionCodes:
          type: array
          uniqueItems: true
          items: { type: string }

    UpdateRoleRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        roleName: { type: string, minLength: 1, maxLength: 128 }
        permissionCodes:
          type: array
          uniqueItems: true
          items: { type: string }
        expectedVersion: { type: integer, minimum: 1 }

    RoleView:
      type: object
      required: [roleId, roleCode, roleName, roleType, permissionCodes, version]
      properties:
        roleId: { type: string }
        roleCode: { type: string }
        roleName: { type: string }
        roleType:
          type: string
          enum: [SYSTEM, CUSTOM]
        permissionCodes:
          type: array
          items: { type: string }
        version: { type: integer, minimum: 1 }

    ScopeType:
      type: string
      enum: [PLATFORM, ORGANIZATION, PROJECT, ASSET]

    CreateRoleBindingRequest:
      type: object
      additionalProperties: false
      required: [principalId, roleId, scopeType]
      properties:
        principalId: { type: string, pattern: '^prn_' }
        roleId: { type: string }
        scopeType: { $ref: '#/components/schemas/ScopeType' }
        scopeId:
          type: [string, 'null']
          description: PLATFORM 作用域必须为空，其他作用域必须提供。

    RoleBindingView:
      type: object
      required: [bindingId, principalId, roleId, scopeType, createdAt]
      properties:
        bindingId: { type: string }
        principalId: { type: string }
        roleId: { type: string }
        scopeType: { $ref: '#/components/schemas/ScopeType' }
        scopeId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    CreateResourceAclRequest:
      type: object
      additionalProperties: false
      required: [principalId, resourceType, resourceId, permissionCodes]
      properties:
        principalId: { type: string, pattern: '^prn_' }
        resourceType: { type: string, example: ASSET }
        resourceId: { type: string }
        permissionCodes:
          type: array
          uniqueItems: true
          minItems: 1
          items: { type: string }

    ResourceAclView:
      type: object
      required: [aclId, principalId, resourceType, resourceId, permissionCodes, createdAt]
      properties:
        aclId: { type: string }
        principalId: { type: string }
        resourceType: { type: string }
        resourceId: { type: string }
        permissionCodes:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }

    TaxonomyStatus:
      type: string
      enum: [ACTIVE, DISABLED]

    DictionaryTypeView:
      type: object
      required: [dictCode, i18nKey, version, status]
      properties:
        dictCode: { type: string }
        i18nKey: { type: string }
        version: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/TaxonomyStatus' }

    DictionaryItemView:
      type: object
      required: [dictCode, itemCode, i18nKey, sortOrder, status, version]
      properties:
        dictCode: { type: string }
        itemCode: { type: string }
        i18nKey: { type: string }
        sortOrder: { type: integer }
        status: { $ref: '#/components/schemas/TaxonomyStatus' }
        version: { type: integer, minimum: 1 }

    CreateDictionaryItemRequest:
      type: object
      additionalProperties: false
      required: [itemCode, i18nKey]
      properties:
        itemCode:
          type: string
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$'
        i18nKey: { type: string }
        sortOrder: { type: integer, default: 0 }

    UpdateDictionaryItemRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        i18nKey: { type: string }
        sortOrder: { type: integer }
        status: { $ref: '#/components/schemas/TaxonomyStatus' }
        expectedVersion: { type: integer, minimum: 1 }

    TagScopeType:
      type: string
      enum: [PLATFORM, ORGANIZATION]

    CreateTagRequest:
      type: object
      additionalProperties: false
      required: [scopeType, tagCode, displayName, i18nKey]
      properties:
        scopeType: { $ref: '#/components/schemas/TagScopeType' }
        scopeId:
          type: [string, 'null']
          description: PLATFORM 必须为空；ORGANIZATION 必须是调用者有权管理的 orgId。
        tagCode:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
        displayName: { type: string, minLength: 1, maxLength: 128 }
        i18nKey: { type: string }
        color: { type: [string, 'null'], example: '#1677ff' }

    UpdateTagRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName: { type: string, minLength: 1, maxLength: 128 }
        i18nKey: { type: string }
        color: { type: [string, 'null'] }
        expectedVersion: { type: integer, minimum: 1 }

    TagView:
      type: object
      required: [tagId, scopeType, tagCode, displayName, i18nKey, status, version]
      properties:
        tagId: { type: string, pattern: '^tag_' }
        scopeType: { $ref: '#/components/schemas/TagScopeType' }
        scopeId: { type: [string, 'null'] }
        tagCode: { type: string }
        displayName: { type: string }
        i18nKey: { type: string }
        color: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/TaxonomyStatus' }
        version: { type: integer, minimum: 1 }

    ConfigurationView:
      type: object
      required: [configKey, valueType, value, hotReloadable, version]
      properties:
        configKey: { type: string }
        valueType:
          type: string
          enum: [STRING, INTEGER, LONG, BOOLEAN, DURATION, JSON]
        value: {}
        hotReloadable: { type: boolean }
        version: { type: integer, minimum: 1 }

    UpdateConfigurationRequest:
      type: object
      additionalProperties: false
      required: [value, expectedVersion]
      properties:
        value: {}
        expectedVersion: { type: integer, minimum: 1 }
        confirmation:
          type: [string, 'null']
          description: 安全或发布策略配置按服务端要求提供二次确认值。

    JobStatus:
      type: string
      enum: [PENDING, RUNNING, SUCCEEDED, RETRY_WAIT, DEAD, CANCELLED]

    JobView:
      type: object
      required: [jobId, jobType, status, retryCount, createdAt, updatedAt]
      properties:
        jobId: { type: string, pattern: '^job_' }
        jobType: { type: string }
        status: { $ref: '#/components/schemas/JobStatus' }
        retryCount: { type: integer, minimum: 0 }
        nextRunAt: { type: [string, 'null'], format: date-time }
        errorCode: { type: [string, 'null'] }
        traceId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CursorPageJob:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/JobView' }
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }

    AuditLogView:
      type: object
      required: [auditId, principalId, action, resourceType, resourceId, result, occurredAt]
      properties:
        auditId: { type: string, pattern: '^aud_' }
        principalId: { type: string }
        action: { type: string }
        resourceType: { type: string }
        resourceId: { type: string }
        result:
          type: string
          enum: [SUCCEEDED, FAILED, DENIED]
        errorCode: { type: [string, 'null'] }
        requestId: { type: [string, 'null'] }
        traceId: { type: [string, 'null'] }
        occurredAt: { type: string, format: date-time }

    CursorPageAuditLog:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditLogView' }
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }

    NotificationView:
      type: object
      required: [notificationId, eventType, i18nKey, status, createdAt]
      properties:
        notificationId: { type: string }
        eventType: { type: string }
        i18nKey: { type: string }
        parameters:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [UNREAD, READ]
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, 'null'], format: date-time }

    CursorPageNotification:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/NotificationView' }
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }

    MetricsSummary:
      type: object
      required: [generatedAt, api, jobs, dependencies]
      properties:
        generatedAt: { type: string, format: date-time }
        api:
          type: object
          additionalProperties: true
        jobs:
          type: object
          additionalProperties: true
        dependencies:
          type: object
          additionalProperties: true

    SystemDependencySummary:
      type: object
      description: 系统依赖与健康摘要（精简）
      required:
        - status
        - dependencies
      properties:
        status:
          type: string
          description: 总体就绪状态
          enum: [UP, DEGRADED, DOWN]
          example: UP
        dependencies:
          type: array
          description: 各依赖组件状态
          items:
            $ref: '#/components/schemas/DependencyStatus'

    DependencyStatus:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
          description: 依赖名称
          enum: [postgres, gitea, minio]
          example: postgres
        status:
          type: string
          enum: [UP, DEGRADED, DOWN]
          example: UP
        latencyMs:
          type: integer
          format: int64
          description: 探测延迟（毫秒）
          example: 12

    AssetType:
      type: string
      description: 资产类型稳定枚举
      enum: [MODEL, DATASET]

    Visibility:
      type: string
      description: 可见性稳定枚举；PUBLIC 表示所有已认证主体可见，不代表互联网匿名访问。
      enum: [PRIVATE, INTERNAL, PUBLIC]

    AssetStatus:
      type: string
      description: 资产目录条目状态稳定枚举
      enum: [ACTIVE, DEPRECATED, ARCHIVED]

    ModelProfile:
      type: object
      description: 模型画像
      properties:
        framework:
          type: string
          description: model_framework 字典的有效 itemCode。
          example: pytorch
        task:
          type: string
          description: model_task 字典的有效 itemCode。
          example: text-generation
        architecture: { type: string }

    DatasetProfile:
      type: object
      description: 数据集画像
      properties:
        format:
          type: string
          description: dataset_format 字典的有效 itemCode。
          example: parquet
        modality:
          type: string
          description: dataset_modality 字典的有效 itemCode。
          example: text

    TagReference:
      type: object
      required: [tagId, tagCode, displayName, scopeType]
      properties:
        tagId: { type: string, pattern: '^tag_' }
        tagCode: { type: string }
        displayName: { type: string }
        scopeType: { $ref: '#/components/schemas/TagScopeType' }
        scopeId: { type: [string, 'null'] }
        color: { type: [string, 'null'] }

    CreateAssetRequest:
      type: object
      additionalProperties: false
      required: [type, namespace, name, visibility]
      properties:
        type: { $ref: '#/components/schemas/AssetType' }
        namespace:
          type: string
          description: 命名空间（小写 slug）
          example: nlp
        name:
          type: string
          description: 名称（小写 slug），namespace+type+name 唯一
          example: qwen-domain-7b
        displayName: { type: string, example: 领域问答模型 }
        description: { type: string }
        visibility: { $ref: '#/components/schemas/Visibility' }
        owners:
          type: array
          uniqueItems: true
          description: 受权 Principal/Team 的稳定 ID。
          items: { type: string, pattern: '^(prn|team)_' }
          example: [team_01J0000000000000000000000]
        tagIds:
          type: array
          uniqueItems: true
          description: 已启用且当前主体有权使用的平台/组织受控标签 ID。
          items: { type: string, pattern: '^tag_' }
          example: [tag_01J0000000000000000000000]
        license:
          type: string
          description: license_catalog 字典的有效 itemCode。
          example: Apache-2.0
        model: { $ref: '#/components/schemas/ModelProfile' }
        dataset: { $ref: '#/components/schemas/DatasetProfile' }

    UpdateAssetRequest:
      type: object
      description: 更新可变元数据；坐标（namespace/type/name）不可变
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion:
          type: integer
          minimum: 0
          description: 资产乐观锁版本，冲突返回 ASSET_CONCURRENT_MODIFICATION。
        displayName: { type: string }
        description: { type: string }
        visibility: { $ref: '#/components/schemas/Visibility' }
        owners:
          type: array
          uniqueItems: true
          items: { type: string, pattern: '^(prn|team)_' }
        tagIds:
          type: array
          uniqueItems: true
          items: { type: string, pattern: '^tag_' }
        license:
          type: string
          description: license_catalog 字典的有效 itemCode。
        model: { $ref: '#/components/schemas/ModelProfile' }
        dataset: { $ref: '#/components/schemas/DatasetProfile' }

    AssetView:
      type: object
      description: 资产详情视图（非持久化实体）
      required: [assetId, type, namespace, name, visibility, status]
      properties:
        assetId: { type: string, example: ast_01J... }
        type: { $ref: '#/components/schemas/AssetType' }
        namespace: { type: string }
        name: { type: string }
        displayName: { type: string }
        description: { type: string }
        visibility: { $ref: '#/components/schemas/Visibility' }
        status: { $ref: '#/components/schemas/AssetStatus' }
        owners:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { $ref: '#/components/schemas/TagReference' }
        license: { type: string }
        model:
          oneOf:
            - $ref: '#/components/schemas/ModelProfile'
            - type: 'null'
        dataset:
          oneOf:
            - $ref: '#/components/schemas/DatasetProfile'
            - type: 'null'
        repository:
          type: [object, 'null']
          properties:
            fullName: { type: string }
            htmlUrl: { type: string }
            cloneUrl: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AssetSummary:
      type: object
      description: 资产检索摘要（小体积）
      required: [assetId, type, namespace, name, visibility, status]
      properties:
        assetId: { type: string }
        type: { $ref: '#/components/schemas/AssetType' }
        namespace: { type: string }
        name: { type: string }
        displayName: { type: string }
        description: { type: string }
        visibility: { $ref: '#/components/schemas/Visibility' }
        status: { $ref: '#/components/schemas/AssetStatus' }
        owners:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { $ref: '#/components/schemas/TagReference' }
        license: { type: string }
        framework: { type: string }
        task: { type: string }
        format: { type: string }
        modality: { type: string }
        updatedAt: { type: string, format: date-time }

    CursorPageAssetSummary:
      type: object
      description: 资产摘要游标分页
      required: [items, hasMore]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AssetSummary' }
        nextCursor:
          type: [string, 'null']
          description: 下一页游标，null 表示末页
        hasMore:
          type: boolean
