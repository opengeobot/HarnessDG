          items: { $ref: '#/components/schemas/JobView' }
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }

    AuditLogView:
      type: object
      required: [auditId, principalId, action, resourceType, resourceId, result, occurredAt]
      properties:
        auditId: { type: string, pattern: '^aud_' }
        principalId: { type: string }
        action: { type: string }
        resourceType: { type: string }
        resourceId: { type: string }
        result:
          type: string
          enum: [SUCCEEDED, FAILED, DENIED]
        errorCode: { type: [string, 'null'] }
        requestId: { type: [string, 'null'] }
        traceId: { type: [string, 'null'] }
        occurredAt: { type: string, format: date-time }

    CursorPageAuditLog:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditLogView' }
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }

    NotificationView:
      type: object
      required: [notificationId, eventType, i18nKey, status, createdAt]
      properties:
        notificationId: { type: string }
        eventType: { type: string }
        i18nKey: { type: string }
        parameters:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [UNREAD, READ]
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, 'null'], format: date-time }

    CursorPageNotification:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/NotificationView' }
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }

    MetricsSummary:
      type: object
      required: [generatedAt, api, jobs, dependencies]
      properties:
        generatedAt: { type: string, format: date-time }
        api:
          type: object
          additionalProperties: true
        jobs:
          type: object
          additionalProperties: true
        dependencies:
          type: object
          additionalProperties: true

    SystemDependencySummary:
      type: object
      description: 系统依赖与健康摘要（精简）
      required:
        - status
        - dependencies
      properties:
        status:
          type: string
          description: 总体就绪状态
          enum: [UP, DEGRADED, DOWN]
          example: UP
        dependencies:
          type: array
          description: 各依赖组件状态
          items:
            $ref: '#/components/schemas/DependencyStatus'

    DependencyStatus:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
          description: 依赖名称
          enum: [postgres, gitea, minio]
          example: postgres
        status:
          type: string
          enum: [UP, DEGRADED, DOWN]
          example: UP
        latencyMs:
          type: integer
          format: int64
          description: 探测延迟（毫秒）
          example: 12

    AssetType:
      type: string
      description: 资产类型稳定枚举
      enum: [MODEL, DATASET]

    Visibility:
      type: string
      description: 可见性稳定枚举；PUBLIC 表示所有已认证主体可见，不代表互联网匿名访问。
      enum: [PRIVATE, INTERNAL, PUBLIC]

    AssetStatus:
      type: string
      description: 资产目录条目状态稳定枚举
      enum: [ACTIVE, DEPRECATED, ARCHIVED]

    ModelProfile:
      type: object
      description: 模型画像
      properties:
        framework:
          type: string
          description: model_framework 字典的有效 itemCode。
          example: pytorch
        task:
          type: string
          description: model_task 字典的有效 itemCode。
          example: text-generation
        architecture: { type: string }
        parameterScale: { type: [string, 'null'], description: 参数规模，如 7B }
        precision: { type: [string, 'null'], description: 精度，如 fp16/bf16 }
        weightFormat: { type: [string, 'null'], description: 权重格式，如 safetensors }
        runtime: { type: [string, 'null'], description: 运行时，如 vllm }
        knownRisks:
          type: [array, 'null']
          description: 已知风险列表
          items: { type: string }
        usageRestrictions:
          type: [array, 'null']
          description: 使用限制列表
          items: { type: string }
        sensitivityCode: { type: [string, 'null'], description: 敏感级别编码 }

    DatasetProfile:
      type: object
      description: 数据集画像
      properties:
        format:
          type: string
          description: dataset_format 字典的有效 itemCode。
          example: parquet
        modality:
          type: string
          description: dataset_modality 字典的有效 itemCode。
          example: text
        taskCodes:
          type: [array, 'null']
          description: 任务分类编码列表
          items: { type: string }
        modalityCodes:
          type: [array, 'null']
          description: 模态分类编码列表
          items: { type: string }
        formatCodes:
          type: [array, 'null']
          description: 格式分类编码列表
          items: { type: string }
        languageCodes:
          type: [array, 'null']
          description: 语言编码列表
          items: { type: string }
        sensitivityCode: { type: [string, 'null'], description: 敏感级别编码 }
        sampleCount: { type: [integer, 'null'], description: 样本数量 }
        totalBytes: { type: [integer, 'null'], description: 数据总字节数 }
        sizeBucketCode: { type: [string, 'null'], description: 大小区间编码 }

    TagReference:
      type: object
      required: [tagId, tagCode, displayName, scopeType]
      properties:
        tagId: { type: string, pattern: '^tag_' }
        tagCode: { type: string }
        displayName: { type: string }
        scopeType: { $ref: '#/components/schemas/TagScopeType' }
        scopeId: { type: [string, 'null'] }
        color: { type: [string, 'null'] }

    CreateAssetRequest:
      type: object
      additionalProperties: false
      required: [type, namespace, name, visibility]
      properties:
        type: { $ref: '#/components/schemas/AssetType' }
        organizationId:
          type: string
          description: 所属组织 ID
        projectId:
          type: string
          description: 所属项目 ID
        namespace:
          type: string
          description: 命名空间（小写 slug）
          example: nlp
        name:
          type: string
          description: 名称（小写 slug），namespace+type+name 唯一
          example: qwen-domain-7b
        displayName: { type: string, example: 领域问答模型 }
        description: { type: string }
        visibility: { $ref: '#/components/schemas/Visibility' }
        owners:
          type: array
          uniqueItems: true
          description: 受权 Principal/Team 的稳定 ID。
          items: { type: string, pattern: '^(prn|team)_' }
          example: [team_01J0000000000000000000000]
        tagIds:
          type: array
          uniqueItems: true
          description: 已启用且当前主体有权使用的平台/组织受控标签 ID。
          items: { type: string, pattern: '^tag_' }
          example: [tag_01J0000000000000000000000]
        license:
          type: string
          description: license_catalog 字典的有效 itemCode。
          example: Apache-2.0
        ownerTeamId:
          type: string
          description: 资产所属 Team ID
        model: { $ref: '#/components/schemas/ModelProfile' }
        dataset: { $ref: '#/components/schemas/DatasetProfile' }

    UpdateAssetRequest:
      type: object
      description: 更新可变元数据；坐标（namespace/type/name）不可变
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion:
          type: integer
          minimum: 0
          description: 资产乐观锁版本，冲突返回 ASSET_CONCURRENT_MODIFICATION。
        organizationId:
          type: string
          description: 所属组织 ID（为空表示不变更）
        projectId:
          type: string
          description: 所属项目 ID（为空表示不变更）
        displayName: { type: string }
        description: { type: string }
        visibility: { $ref: '#/components/schemas/Visibility' }
        owners:
          type: array
          uniqueItems: true
          items: { type: string, pattern: '^(prn|team)_' }
        tagIds:
          type: array
          uniqueItems: true
          items: { type: string, pattern: '^tag_' }
        license:
          type: string
          description: license_catalog 字典的有效 itemCode。
        ownerTeamId:
          type: string
          description: 资产所属 Team ID
        model: { $ref: '#/components/schemas/ModelProfile' }
        dataset: { $ref: '#/components/schemas/DatasetProfile' }

    AssetView:
      type: object
      description: 资产详情视图（非持久化实体）
      required: [assetId, type, namespace, name, visibility, status]
      properties:
        assetId: { type: string, example: ast_01J... }
        coordinate:
          type: string
          description: 稳定坐标 aih://{namespace}/{type}/{name}，type 为小写 model/dataset
          example: aih://nlp/model/qwen-domain-7b
        type: { $ref: '#/components/schemas/AssetType' }
        namespace: { type: string }
        organizationId: { type: [string, 'null'], description: 所属组织 ID }
        projectId: { type: [string, 'null'], description: 所属项目 ID }
        name: { type: string }
        displayName: { type: string }
        description: { type: string }
        visibility: { $ref: '#/components/schemas/Visibility' }
        status: { $ref: '#/components/schemas/AssetStatus' }
        owners:
          type: array
          items: { type: string }
        tags:
          type: array
          description: legacy 自由标签（只读回显）
          items: { type: string }
        tagIds:
          type: array
          description: 受控标签 ID 列表（asset_tag 关联）
          items: { type: string, pattern: '^tag_' }
        license: { type: string }
        model:
          oneOf:
            - $ref: '#/components/schemas/ModelProfile'
            - type: 'null'
        dataset:
          oneOf:
            - $ref: '#/components/schemas/DatasetProfile'
            - type: 'null'
        repository:
          type: [object, 'null']
          properties:
            fullName: { type: string }
            htmlUrl: { type: string }
            cloneUrl: { type: string }
        provisioningStatus:
          type: string
          description: 建仓异步状态
          enum: [NONE, PENDING, IN_PROGRESS, COMPLETED, FAILED]
        ownerTeamId: { type: [string, 'null'], description: 资产所属 Team ID }
        aliases:
          type: [array, 'null']
          description: 历史坐标别名（rename 后保留旧坐标）
          items: { type: string }
        rowVersion:
          type: integer
          description: 乐观锁版本号
        deprecationReason: { type: [string, 'null'], description: 弃用原因编码 }
        deprecationNote: { type: [string, 'null'], description: 弃用说明 }
        replacementAssetId: { type: [string, 'null'], description: 替代资产 ID }
        card:
          type: [object, 'null']
          description: Card 投影（来自仓库 README/asset.yaml）
          properties:
            readme: { type: [string, 'null'] }
            assetYaml: { type: [string, 'null'] }
            sourceCommit: { type: [string, 'null'] }
            untrustedContent: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AssetSummary:
      type: object
      description: 资产检索摘要（小体积）
      required: [assetId, type, namespace, name, visibility, status]
      properties:
        assetId: { type: string }
        coordinate:
          type: string
          description: 稳定坐标 aih://{namespace}/{type}/{name}
        type: { $ref: '#/components/schemas/AssetType' }
        namespace: { type: string }
        organizationId: { type: [string, 'null'], description: 所属组织 ID }
        projectId: { type: [string, 'null'], description: 所属项目 ID }
        name: { type: string }
        displayName: { type: string }
        description: { type: string }
        visibility: { $ref: '#/components/schemas/Visibility' }
        status: { $ref: '#/components/schemas/AssetStatus' }
        owners:
          type: array
          items: { type: string }
        tags:
          type: array
          description: legacy 自由标签（只读回显）
          items: { type: string }
        tagIds:
          type: array
          description: 受控标签 ID 列表（asset_tag 关联）
          items: { type: string, pattern: '^tag_' }
        license: { type: string }
        framework: { type: string }
        task: { type: string }
        format: { type: string }
        modality: { type: string }
        updatedAt: { type: string, format: date-time }
        matchedFields:
          type: array
          description: 关键词检索命中的字段名（无关键词时为空）
          items:
            type: string
            enum: [name, displayName, description, taskCodes]

    CursorPageAssetSummary:
      type: object
      description: 资产摘要游标分页
      required: [items, hasMore]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AssetSummary' }
        nextCursor:
          type: [string, 'null']
          description: 下一页游标，null 表示末页
        hasMore:
          type: boolean

    # ─── P1: Facet / Discussion ─────────────────────────────────────

    FacetBucket:
      type: object
      required: [value, count]
      properties:
        value: { type: string }
        count: { type: integer }

    FacetDimension:
      type: object
      required: [buckets]
      properties:
        buckets:
          type: array
          items: { $ref: '#/components/schemas/FacetBucket' }

    AssetFacetView:
      type: object
      description: 资产 Facet 聚合视图
      properties:
        types: { type: object, additionalProperties: { type: integer } }
        frameworks: { type: object, additionalProperties: { type: integer } }
        tasks: { type: object, additionalProperties: { type: integer } }
        formats: { type: object, additionalProperties: { type: integer } }
        modalities: { type: object, additionalProperties: { type: integer } }
        licenses: { type: object, additionalProperties: { type: integer } }
        sensitivities: { type: object, additionalProperties: { type: integer } }
        sizeBuckets: { type: object, additionalProperties: { type: integer } }
        taskCodes: { type: object, additionalProperties: { type: integer } }
        modalityCodes: { type: object, additionalProperties: { type: integer } }
        formatCodes: { type: object, additionalProperties: { type: integer } }
        languageCodes: { type: object, additionalProperties: { type: integer } }
        totalCount: { type: integer, description: 匹配资产总数 }

    ThreadStatus:
      type: string
      enum: [OPEN, LOCKED, CLOSED]

    CommentStatus:
      type: string
      enum: [VISIBLE, HIDDEN, RETRACTED]

    CreateThreadRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200

    ThreadView:
      type: object
      required: [threadId, assetId, title, status, createdAt, createdBy, commentCount]
      properties:
        threadId: { type: string }
        assetId: { type: string }
        title: { type: string }
        status: { $ref: '#/components/schemas/ThreadStatus' }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        commentCount: { type: integer }

    CursorPageThread:
      type: object
      description: 讨论线程游标分页
      required: [items, hasMore]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ThreadView' }
        nextCursor:
          type: [string, 'null']
        hasMore:
          type: boolean

    CreateCommentRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 10000

    CommentView:
      type: object
      required: [commentId, threadId, body, status, createdAt, createdBy]
      properties:
        commentId: { type: string }
        threadId: { type: string }
        body: { type: string }
        status: { $ref: '#/components/schemas/CommentStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        createdBy: { type: string }
        editedAt: { type: string, format: date-time, description: 最后编辑时间，null 表示未编辑 }

    CursorPageComment:
      type: object
      description: 评论游标分页
      required: [items, hasMore]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CommentView' }
        nextCursor:
          type: [string, 'null']
        hasMore:
          type: boolean

    # ── 评论管理 schema ──

    EditCommentRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 10000

    # ── 系统告警 schema ──

    SystemAlert:
      type: object
      description: 系统告警实体
      required: [alertId, alertType, severity, title, status, firedAt]
      properties:
        id: { type: integer }
        alertId: { type: string }
        alertType: { type: string }
        severity: { type: string, enum: [INFO, WARNING, CRITICAL] }
        title: { type: string }
        detail: { type: string }
        status: { type: string, enum: [FIRING, RESOLVED] }
        sourceMetric: { type: string }
        thresholdValue: { type: [number, 'null'] }
        currentValue: { type: [number, 'null'] }
        firedAt: { type: string, format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }
        traceId: { type: string }

    # ── 通知管理 schema ──

    OutboxEventView:
      type: object
      description: Outbox 事件视图（管理员）
      required: [eventId, aggregateType, aggregateId, eventType, occurredAt, processed, traceId]
      properties:
        eventId: { type: string }
        aggregateType: { type: string }
        aggregateId: { type: string }
        eventType: { type: string }
        occurredAt: { type: string, format: date-time }
        processed: { type: boolean }
        traceId: { type: string }

    WebhookDeliveryView:
      type: object
      description: Webhook 投递视图（管理员）
      required: [deliveryId, eventId, targetUrl, status, attempts, createdAt, updatedAt]
      properties:
        deliveryId: { type: string }
        eventId: { type: string }
        targetUrl: { type: string, format: uri }
        status: { type: string }
        attempts: { type: integer }
        lastResponseCode: { type: [integer, 'null'] }
        lastError: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # ── 版本审批 schema ──

    DecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [APPROVE, REJECT]
        comments:
          type: string

    # ── 预览 schema ──

    PreviewView:
      type: object
      description: 资产预览视图
      required: [previewId, contentType, content]
      properties:
        previewId: { type: string }
        contentType: { type: string }
        content: { type: string }
        generatedAt: { type: [string, 'null'] }

    # ── DVC schema ──

    DvcRemoteConfig:
      type: object
      description: DVC Remote 配置
      required: [bucket, endpoint, type, prefix, expiresAt]
      properties:
        bucket: { type: string }
        endpoint: { type: string, format: uri }
        type: { type: string }
        prefix: { type: string }
        expiresAt: { type: string, format: date-time }

    DvcCredentials:
      type: object
      description: DVC 短期凭据
      required: [accessKey, secretKey, expiresAt, bucket, prefix]
      properties:
        accessKey: { type: string }
        secretKey: { type: string, format: password }
        expiresAt: { type: string, format: date-time }
        bucket: { type: string }
        prefix: { type: string }

    # ── 下载票据 schema ──

    UploadSessionView:
      type: object
      description: 上传会话视图
      required: [sessionId, assetId, versionId, principalId, status, totalBytes, fileCount, expiresAt, createdAt]
      properties:
        sessionId: { type: string }
        assetId: { type: string }
        versionId: { type: string }
        principalId: { type: string }
        status:
          type: string
          enum: [OPEN, COMMITTING, COMPLETED, CANCELLED, EXPIRED]
        totalBytes: { type: integer, format: int64 }
        fileCount: { type: integer }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    DownloadTicket:
      type: object
      description: 下载票据
      required: [method, presignedUrl, expiresAt, fileName, fileSize]
      properties:
        method:
          type: string
          enum: [PRESIGNED_URL, GIT_DVC]
        presignedUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
        fileName: { type: string }
        fileSize: { type: [integer, 'null'] }

    # ── MCP schema ──

    JsonRpcRequest:
      type: object
      description: JSON-RPC 2.0 请求
      required: [jsonrpc, method, id]
      properties:
        jsonrpc:
          type: string
          const: '2.0'
        id:
          type: [string, integer]
        method:
          type: string
          enum: [initialize, tools/list, tools/call, resources/list, resources/read]
        params:
          type: object

    JsonRpcResponse:
      type: object
      description: JSON-RPC 2.0 响应
      required: [jsonrpc, id]
      properties:
        jsonrpc:
          type: string
          const: '2.0'
        id:
          type: [string, integer, 'null']
        result:
          type: object
        error:
          type: object
          properties:
            code: { type: integer }
            message: { type: string }
