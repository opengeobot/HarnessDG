      properties:
        tagId: { type: string, pattern: '^tag_' }
        scopeType: { $ref: '#/components/schemas/TagScopeType' }
        scopeId: { type: [string, 'null'] }
        tagCode: { type: string }
        displayName: { type: string }
        i18nKey: { type: string }
        color: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/TaxonomyStatus' }
