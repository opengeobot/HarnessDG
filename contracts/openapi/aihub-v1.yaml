        displayName: { type: string, minLength: 1, maxLength: 128 }
        i18nKey: { type: string }
        color: { type: [string, 'null'], example: '#1677ff' }

    UpdateTagRequest:
      type: object
      additionalProperties: false
      minProperties: 1
