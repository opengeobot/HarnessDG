# AIHub Platform API - OpenAPI 契约骨架
# 依据：prd/DEEP_RESEARCH_内部AI资产管理平台设计.md 第 5.8、5.9、8.2、5.14 节
# 说明：本文件为 P0 阶段的契约骨架，仅固化统一响应/错误结构与一个只读示例路径，
#       不覆盖全部业务接口；业务路径在 P1+ 按"契约优先"流程逐步补充。
# 作者：AxeXie
openapi: 3.1.0
info:
  title: AIHub Platform API
  version: v1
  description: |
    内部 AI 资产管理平台 REST API 契约。统一成功响应为 ApiResponse，统一失败响应为 ApiError。
    Agent 不应依赖本地化 message 做分支判断，只依赖稳定的 code 与 retryable。
servers:
  - url: /api/v1
    description: 统一 API 前缀

paths:
  /system/dependencies:
    get:
      operationId: getSystemDependencies
      summary: 获取系统依赖与健康摘要（运维诊断）
      description: |
        返回平台关键依赖（PostgreSQL、Gitea、MinIO）的精简健康/依赖摘要，用于运维诊断。
        对非管理员隐藏内部 Endpoint、凭据状态与网络拓扑。P0 已实现 PostgreSQL 探测，
        Gitea/MinIO 等依赖随对应集成适配器在 P1+ 注册接入。
      tags:
        - system
      responses:
        '200':
          description: 成功返回依赖摘要
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SystemDependencySummary'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'

  /assets:
    post:
      operationId: createAsset
      summary: 登记新资产（模型/数据集）
      description: 校验坐标唯一、开通 Git 仓库并写入初始卡片，返回资产详情。
      tags: [assets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssetRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AssetView'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
    get:
      operationId: searchAssets
      summary: 检索资产摘要（游标分页）
      description: 精确字段过滤 + 关键词全文 + 权限可见性过滤；默认排除归档资产。
      tags: [assets]
      parameters:
        - { name: keyword, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/AssetType' } }
        - { name: namespace, in: query, schema: { type: string } }
        - { name: framework, in: query, schema: { type: string } }
        - { name: task, in: query, schema: { type: string } }
        - { name: format, in: query, schema: { type: string } }
        - { name: modality, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: owner, in: query, schema: { type: string } }
        - { name: includeArchived, in: query, schema: { type: boolean, default: false } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: 检索成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CursorPageAssetSummary'

  /assets/{assetId}:
    parameters:
      - name: assetId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getAsset
      summary: 查询资产详情
      tags: [assets]
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AssetView'
        '404':
          $ref: '#/components/responses/ErrorResponse'
    patch:
      operationId: updateAsset
      summary: 更新资产可变元数据
      tags: [assets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAssetRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AssetView'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
    delete:
      operationId: deleteAsset
      summary: 逻辑删除资产
      tags: [assets]
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /models:
    get:
      operationId: searchModels
      summary: 检索模型列表（固定类型语义入口）
      tags: [assets]
      parameters:
        - { name: keyword, in: query, schema: { type: string } }
        - { name: namespace, in: query, schema: { type: string } }
        - { name: framework, in: query, schema: { type: string } }
        - { name: task, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: owner, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: 检索成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CursorPageAssetSummary'

  /datasets:
    get:
      operationId: searchDatasets
      summary: 检索数据集列表（固定类型语义入口）
      tags: [assets]
      parameters:
        - { name: keyword, in: query, schema: { type: string } }
        - { name: namespace, in: query, schema: { type: string } }
        - { name: format, in: query, schema: { type: string } }
        - { name: modality, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: owner, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: 检索成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CursorPageAssetSummary'

components:
  responses:
    ErrorResponse:
      description: 统一失败响应
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    ApiResponse:
      type: object
      description: 统一成功响应包装
      required:
        - requestId
        - traceId
        - timestamp
      properties:
        data:
          description: 业务数据载荷，结构由具体接口定义
          nullable: true
        requestId:
          type: string
          description: 请求标识，回显 X-Request-Id
          example: req_01J0000000000000000000000
        traceId:
          type: string
          description: 分布式追踪标识
          example: 4bf92f3577b34da6a3ce929d0e0e4736
        timestamp:
          type: string
          format: date-time
          description: 服务端 UTC 时间戳
          example: '2026-06-29T08:00:00Z'

    ApiError:
      type: object
      description: 统一失败响应
      required:
        - code
        - message
        - retryable
        - requestId
        - traceId
      properties:
        code:
          type: string
          description: 稳定的语义错误码，分支判断只依赖此字段
          example: ASSET_VERSION_CONFLICT
        message:
          type: string
          description: 默认（可本地化）错误消息，不用于分支判断
          example: Version already exists
        i18nKey:
          type: string
          description: 国际化文案 Key
          example: error.asset.versionConflict
        details:
          type: object
          description: 附加上下文，结构由错误码定义
          additionalProperties: true
        retryable:
          type: boolean
          description: 是否可重试；仅当为 true 时 Agent 才应按退避策略重试
          example: false
        requestId:
          type: string
          example: req_01J0000000000000000000000
        traceId:
          type: string
          example: 4bf92f3577b34da6a3ce929d0e0e4736

    SystemDependencySummary:
      type: object
      description: 系统依赖与健康摘要（精简）
      required:
        - status
        - dependencies
      properties:
        status:
          type: string
          description: 总体就绪状态
          enum: [UP, DEGRADED, DOWN]
          example: UP
        dependencies:
          type: array
          description: 各依赖组件状态
          items:
            $ref: '#/components/schemas/DependencyStatus'

    DependencyStatus:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
          description: 依赖名称
          enum: [postgres, gitea, minio]
          example: postgres
        status:
          type: string
          enum: [UP, DEGRADED, DOWN]
          example: UP
        latencyMs:
          type: integer
          format: int64
          description: 探测延迟（毫秒）
          example: 12

    AssetType:
      type: string
      description: 资产类型稳定枚举
      enum: [MODEL, DATASET]

    Visibility:
      type: string
      description: 可见性稳定枚举
      enum: [PRIVATE, INTERNAL, PUBLIC]

    AssetStatus:
      type: string
      description: 资产目录条目状态稳定枚举
      enum: [ACTIVE, DEPRECATED, ARCHIVED]

    ModelProfile:
      type: object
      description: 模型画像
      properties:
        framework: { type: string, example: pytorch }
        task: { type: string, example: text-generation }
        architecture: { type: string }

    DatasetProfile:
      type: object
      description: 数据集画像
      properties:
        format: { type: string, example: parquet }
        modality: { type: string, example: text }

    CreateAssetRequest:
      type: object
      required: [type, namespace, name, visibility]
      properties:
        type: { $ref: '#/components/schemas/AssetType' }
        namespace:
          type: string
          description: 命名空间（小写 slug）
          example: nlp
        name:
          type: string
          description: 名称（小写 slug），namespace+type+name 唯一
          example: qwen-domain-7b
        displayName: { type: string, example: 领域问答模型 }
        description: { type: string }
        visibility: { $ref: '#/components/schemas/Visibility' }
        owners:
          type: array
          items: { type: string }
          example: [team-nlp]
        tags:
          type: array
          items: { type: string }
          example: [text-generation]
        license: { type: string, example: Apache-2.0 }
        model: { $ref: '#/components/schemas/ModelProfile' }
        dataset: { $ref: '#/components/schemas/DatasetProfile' }

    UpdateAssetRequest:
      type: object
      description: 更新可变元数据；坐标（namespace/type/name）不可变
      properties:
        displayName: { type: string }
        description: { type: string }
        visibility: { $ref: '#/components/schemas/Visibility' }
        owners:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }
        license: { type: string }
        model: { $ref: '#/components/schemas/ModelProfile' }
        dataset: { $ref: '#/components/schemas/DatasetProfile' }

    AssetView:
      type: object
      description: 资产详情视图（非持久化实体）
      required: [assetId, type, namespace, name, visibility, status]
      properties:
        assetId: { type: string, example: ast_01J... }
        type: { $ref: '#/components/schemas/AssetType' }
        namespace: { type: string }
        name: { type: string }
        displayName: { type: string }
        description: { type: string }
        visibility: { $ref: '#/components/schemas/Visibility' }
        status: { $ref: '#/components/schemas/AssetStatus' }
        owners:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }
        license: { type: string }
        model:
          allOf:
            - $ref: '#/components/schemas/ModelProfile'
          nullable: true
        dataset:
          allOf:
            - $ref: '#/components/schemas/DatasetProfile'
          nullable: true
        repository:
          type: object
          nullable: true
          properties:
            fullName: { type: string }
            htmlUrl: { type: string }
            cloneUrl: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AssetSummary:
      type: object
      description: 资产检索摘要（小体积）
      required: [assetId, type, namespace, name, visibility, status]
      properties:
        assetId: { type: string }
        type: { $ref: '#/components/schemas/AssetType' }
        namespace: { type: string }
        name: { type: string }
        displayName: { type: string }
        description: { type: string }
        visibility: { $ref: '#/components/schemas/Visibility' }
        status: { $ref: '#/components/schemas/AssetStatus' }
        owners:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }
        license: { type: string }
        framework: { type: string }
        task: { type: string }
        format: { type: string }
        modality: { type: string }
        updatedAt: { type: string, format: date-time }

    CursorPageAssetSummary:
      type: object
      description: 资产摘要游标分页
      required: [items, hasMore]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AssetSummary' }
        nextCursor:
          type: string
          nullable: true
          description: 下一页游标，null 表示末页
        hasMore:
          type: boolean
