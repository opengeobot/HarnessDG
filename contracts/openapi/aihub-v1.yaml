            application/json:
              schema: { $ref: '#/components/schemas/JsonRpcResponse' }
        '400': { description: Invalid Request }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        平台签发的短期访问 JWT。JWT 使用非对称签名和 kid；资源级权限由后端实时判断，
        不以 JWT 内角色替代 RBAC/ACL/资源状态校验。

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 当前 Principal 范围内唯一的写请求幂等键。
      schema:
        type: string
        minLength: 8
        maxLength: 128

  responses:
    ErrorResponse:
      description: 统一失败响应
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    ApiResponse:
      type: object
      description: 统一成功响应包装
      required:
        - requestId
        - traceId
        - timestamp
      properties:
        data:
          description: 业务数据载荷，结构由具体接口定义
          type: [object, array, string, number, integer, boolean, 'null']
        requestId:
          type: string
          description: 请求标识，回显 X-Request-Id
          example: req_01J0000000000000000000000
        traceId:
          type: string
          description: 分布式追踪标识
          example: 4bf92f3577b34da6a3ce929d0e0e4736
        timestamp:
          type: string
          format: date-time
          description: 服务端 UTC 时间戳
          example: '2026-06-29T08:00:00Z'

    ApiError:
      type: object
      description: 统一失败响应
      required:
        - code
        - message
        - retryable
        - requestId
        - traceId
      properties:
        code:
          type: string
          description: 稳定的语义错误码，分支判断只依赖此字段
          example: ASSET_VERSION_CONFLICT
        message:
          type: string
          description: 默认（可本地化）错误消息，不用于分支判断
          example: Version already exists
        i18nKey:
          type: string
          description: 国际化文案 Key
          example: error.asset.versionConflict
        details:
          type: object
          description: 附加上下文，结构由错误码定义
          additionalProperties: true
        retryable:
          type: boolean
          description: 是否可重试；仅当为 true 时 Agent 才应按退避策略重试
          example: false
        requestId:
          type: string
          example: req_01J0000000000000000000000
        traceId:
          type: string
          example: 4bf92f3577b34da6a3ce929d0e0e4736

    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 128

    RefreshTokenRequest:
      type: object
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          format: password
          writeOnly: true
          description: 非浏览器客户端提交；浏览器优先使用 Secure/HttpOnly/SameSite Cookie。

    ClientCredentialTokenRequest:
      type: object
      additionalProperties: false
      required: [grantType, subjectId, credential]
      properties:
        grantType:
          type: string
          const: client_credentials
        subjectId:
          type: string
          description: Agent、Service 或 API Client 的稳定业务 ID。
        credential:
          type: string
          format: password
          writeOnly: true

    TokenPair:
      type: object
      required: [tokenType, accessToken, expiresIn, refreshExpiresIn, principal]
      properties:
        tokenType:
          type: string
          const: Bearer
        accessToken:
          type: string
          description: 默认 15 分钟有效；客户端不得写入持久化浏览器存储。
        refreshToken:
          type: string
          description: 默认 7 天有效并在每次刷新时轮换；浏览器响应可仅通过安全 Cookie 返回。
        expiresIn:
          type: integer
          description: 访问 JWT 剩余秒数。
          example: 900
        refreshExpiresIn:
          type: integer
          description: 刷新 JWT 剩余秒数。
          example: 604800
        principal:
          $ref: '#/components/schemas/CurrentPrincipal'

    PrincipalType:
      type: string
      enum: [USER, AGENT, SERVICE, API_CLIENT, WORKER]

    CurrentPrincipal:
      type: object
      required: [principalId, principalType, subject, roles, scopes, locale]
      properties:
        principalId: { type: string, pattern: '^prn_' }
        userId:
          type: [string, 'null']
          pattern: '^usr_'
        principalType: { $ref: '#/components/schemas/PrincipalType' }
        subject: { type: string }
        displayName: { type: [string, 'null'] }
        organizationId: { type: [string, 'null'] }
        roles:
          type: array
          items: { type: string }
        scopes:
          type: array
          items: { type: string }
        locale: { type: string, example: zh-CN }
        forcePasswordChange: { type: boolean, default: false }

    PrincipalStatus:
      type: string
      enum: [ACTIVE, LOCKED, DISABLED]

    PrincipalSummary:
      type: object
      required: [principalId, principalType, subject, status]
      properties:
        principalId: { type: string, pattern: '^prn_' }
        principalType: { $ref: '#/components/schemas/PrincipalType' }
        subject: { type: string }
        displayName: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/PrincipalStatus' }

    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          writeOnly: true
        newPassword:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 128

    UserStatus:
      type: string
      enum: [PENDING_ACTIVATION, ACTIVE, LOCKED, DISABLED]

    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [username, displayName, temporaryPassword]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: '^[a-zA-Z0-9._-]+$'
        displayName: { type: string, minLength: 1, maxLength: 128 }
        email: { type: [string, 'null'], format: email }
        locale: { type: string, default: zh-CN }
        temporaryPassword:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 128

    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName: { type: string, minLength: 1, maxLength: 128 }
        email: { type: [string, 'null'], format: email }
        locale: { type: string }

    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [temporaryPassword]
      properties:
        temporaryPassword:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 128

    UserView:
      type: object
      required: [userId, principalId, username, displayName, status, locale, createdAt, updatedAt]
      properties:
        userId: { type: string, pattern: '^usr_' }
        principalId: { type: string, pattern: '^prn_' }
        username: { type: string }
        displayName: { type: string }
        email: { type: [string, 'null'], format: email }
        locale: { type: string }
        status: { $ref: '#/components/schemas/UserStatus' }
        forcePasswordChange: { type: boolean }
        lastLoginAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PageResultUser:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/UserView' }
        page: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1 }
        total: { type: integer, format: int64, minimum: 0 }

    CreateAgentRequest:
      type: object
      additionalProperties: false
      required: [displayName, agentType, maxSensitivityLevel, scopes]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 128 }
        agentType: { type: string, maxLength: 64 }
        vendor: { type: [string, 'null'], maxLength: 64 }
        maxSensitivityLevel: { type: integer, minimum: 0 }
        scopes:
          type: array
          uniqueItems: true
          items: { type: string }

    AgentView:
      type: object
      required: [agentId, principalId, displayName, agentType, status, maxSensitivityLevel, scopes, toolAllowlist]
      properties:
        agentId: { type: string, pattern: '^agt_' }
        principalId: { type: string, pattern: '^prn_' }
        displayName: { type: string }
        agentType: { type: string }
        vendor: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/PrincipalStatus' }
        maxSensitivityLevel: { type: integer, minimum: 0 }
        scopes:
          type: array
          items: { type: string }
        toolAllowlist:
          type: array
          items: { type: string }

    CreatedAgent:
      allOf:
        - $ref: '#/components/schemas/AgentView'
        - type: object
          required: [credential]
          properties:
            credential:
              type: string
              format: password
              description: 仅创建成功响应返回一次；服务端只保存摘要。

    UpdateAgentToolAllowlistRequest:
      type: object
      additionalProperties: false
      required: [tools]
      properties:
        tools:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: '^[a-z][a-z0-9_]{2,127}$'

    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,62}[a-z0-9]$'
        name: { type: string, minLength: 1, maxLength: 128 }
        giteaOrganization: { type: [string, 'null'], maxLength: 128 }

    OrganizationView:
      type: object
      required: [organizationId, code, name, status, createdAt]
      properties:
        organizationId: { type: string, pattern: '^org_' }
        code: { type: string }
        name: { type: string }
        giteaOrganization: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/PrincipalStatus' }
        createdAt: { type: string, format: date-time }

    AddOrganizationMemberRequest:
      type: object
      additionalProperties: false
      required: [principalId]
      properties:
        principalId: { type: string, pattern: '^prn_' }

    OrganizationMemberView:
      type: object
      required: [organizationId, principalId, joinedAt]
      properties:
        organizationId: { type: string, pattern: '^org_' }
        principalId: { type: string, pattern: '^prn_' }
        joinedAt: { type: string, format: date-time }

    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,62}[a-z0-9]$'
        name: { type: string, minLength: 1, maxLength: 128 }

    ProjectView:
      type: object
      required: [projectId, organizationId, code, name, status, createdAt]
      properties:
        projectId: { type: string, pattern: '^prj_' }
        organizationId: { type: string, pattern: '^org_' }
        code: { type: string }
        name: { type: string }
        status: { $ref: '#/components/schemas/PrincipalStatus' }
        createdAt: { type: string, format: date-time }

    CreateTeamRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        description: { type: [string, 'null'] }

    UpdateTeamRequest:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        description: { type: [string, 'null'] }
        status:
          type: string
          enum: [ACTIVE, DISABLED]

    TeamView:
      type: object
      required: [teamId, organizationId, name, status, createdAt]
      properties:
        teamId: { type: string, pattern: '^team_' }
        organizationId: { type: string, pattern: '^org_' }
        name: { type: string }
        description: { type: [string, 'null'] }
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        createdAt: { type: string, format: date-time }

    AddTeamMemberRequest:
      type: object
      additionalProperties: false
      required: [principalId]
      properties:
        principalId: { type: string, pattern: '^prn_' }
        role:
          type: string
          enum: [OWNER, MEMBER]
