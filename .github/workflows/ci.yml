# ============================================================================
# 功能: AIHub CI 权威验收工作流。串联后端 (./mvnw verify)、前端
#       (pnpm lint/typecheck/build) 与 Compose 配置 (docker compose config)。
#       这是唯一权威验收逻辑，PowerShell 本地脚本不得产生不同判定。
# 时间: 2026-06-29
# 作者: AxeXie
# ============================================================================
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (mvnw verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvnw verify
        run: ./mvnw -B verify

  frontend:
    name: Frontend (lint / typecheck / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build

  compose:
    name: Compose config check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/compose
    steps:
      - uses: actions/checkout@v4
      - name: Prepare .env
        run: cp .env.example .env
      - name: docker compose config
        run: docker compose config --quiet
