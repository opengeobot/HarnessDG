# ============================================================================
# 功能: AIHub CI 权威验收工作流。串联后端 (./mvnw verify)、前端
#       (pnpm lint/typecheck/build) 与 Compose 配置 (docker compose config)。
#       这是唯一权威验收逻辑，PowerShell 本地脚本不得产生不同判定。
# 时间: 2026-06-29
# 作者: AxeXie
# ============================================================================
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (mvnw verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvnw verify
        run: ./mvnw -B verify

  frontend:
    name: Frontend (lint / typecheck / test / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  compose:
    name: Compose config check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/compose
    steps:
      - uses: actions/checkout@v4
      - name: Prepare .env
        run: cp .env.example .env
      - name: docker compose config
        run: docker compose config --quiet

  spec-gate:
    name: AI Spec Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # PowerShell Core 在 ubuntu-latest runner 已预装；此处显式验证版本以确保可复现。
      - name: Verify PowerShell
        shell: bash
        run: pwsh --version
      - name: Validate Spec
        shell: pwsh
        run: ./tools/validate-spec.ps1

  contracts:
    name: Contracts (OpenAPI lint / breaking-change)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # diff 需要基线版本，拉取完整历史以便对比 base ref。
          fetch-depth: 0
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      # 契约 lint 为强制门禁：Redocly recommended 规则集，任何 error 阻断流水线。
      - name: OpenAPI lint
        run: >-
          npx --yes @redocly/cli@latest lint
          --config contracts/openapi/redocly.yaml
          contracts/openapi/aihub-v1.yaml
      # breaking-change 检查：与 PR base ref（或 push 前一提交）对比契约差异。
      # breaking change (error 级别) 仅在 PR 到 main 时强制阻断，其他分支仅警告。
      - name: OpenAPI breaking-change diff
        run: |
          BASE_REF="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "${BASE_REF}" ] || [ "${BASE_REF}" = "0000000000000000000000000000000000000000" ]; then
            echo "无可用基线提交，跳过 breaking-change diff。"
            exit 0
          fi
          git show "${BASE_REF}:contracts/openapi/aihub-v1.yaml" > /tmp/aihub-base.yaml 2>/dev/null || {
            echo "基线中不存在契约文件，视为新增，跳过 diff。"; exit 0;
          }
          IS_MAIN_PR="${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' }}"
          if [ "${IS_MAIN_PR}" = "true" ]; then
            npx --yes @redocly/cli@latest diff /tmp/aihub-base.yaml contracts/openapi/aihub-v1.yaml --fail-on-breaking
          else
            npx --yes @redocly/cli@latest diff /tmp/aihub-base.yaml contracts/openapi/aihub-v1.yaml --fail-on-breaking || echo "Breaking change detected (non-blocking for non-main PR)"
          fi

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  mcp-contract:
    name: MCP contract (tools.yaml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PyYAML
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml
      - name: Validate tools.yaml structure
        run: ./contracts/mcp/validate-tools.sh
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: McpToolCatalog contract tests
        working-directory: backend
        run: ./mvnw -B -Dtest=McpToolCatalogContractTest,McpToolCatalogTest test

  verify-schema:
    name: Verify schema (V04/V28 subset)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aihub
          POSTGRES_PASSWORD: ci-test-postgres
          POSTGRES_DB: aihub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aihub -d aihub"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Apply Flyway migrations
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}/backend/src/main/resources/db/migration:/flyway/sql" \
            flyway/flyway:10-alpine \
            -url=jdbc:postgresql://localhost:5432/aihub \
            -user=aihub \
            -password=ci-test-postgres \
            -connectRetries=30 \
            migrate
      - name: Run verify-schema.sh
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: aihub
          POSTGRES_PASSWORD: ci-test-postgres
          POSTGRES_DB: aihub
        run: ./deploy/compose/scripts/verify-schema.sh

  compose-e2e:
    name: Compose E2E (verify.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 全栈构建较重；PR 上暂为可选，main push 为强制。见 docs/runbooks/verify-case-mapping.md
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    defaults:
      run:
        working-directory: deploy/compose
    steps:
      - uses: actions/checkout@v4
      - name: Prepare .env
        run: cp .env.example .env
      - name: Start stack and wait for health
        run: docker compose up -d --build --wait
      - name: Run verify.sh
        run: ./scripts/verify.sh

  task-card-gate:
    name: Task Card Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate changed task cards
        shell: pwsh
        run: |
          $base = "${{ github.event.pull_request.base.sha }}"
          if ([string]::IsNullOrWhiteSpace($base) -or $base -eq '0000000000000000000000000000000000000000') {
            $base = "${{ github.event.before }}"
          }
          if ([string]::IsNullOrWhiteSpace($base) -or $base -eq '0000000000000000000000000000000000000000') {
            Write-Host "无可用基线提交，跳过 Task Card 变更检测。"
            exit 0
          }
          $files = git diff --name-only --diff-filter=ACMR "${base}" HEAD -- 'docs/ai-spec/tasks/TASK-*.md'
          if (-not $files) {
            Write-Host "无 Task Card 变更，跳过。"
            exit 0
          }
          foreach ($f in $files) {
            Write-Host "校验 ${f} ..."
            ./docs/ai-spec/tools/validate-task-card.ps1 -TaskPath $f -CheckChangedPaths
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  perf-smoke:
    name: Perf smoke (search P95, optional)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    defaults:
      run:
        working-directory: deploy/compose
    steps:
      - uses: actions/checkout@v4
      - name: Prepare .env
        run: cp .env.example .env
      - name: Start stack
        run: docker compose up -d --build --wait
      - name: Login and run perf-smoke
        run: |
          TOKEN="$(curl -sf -X POST -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"change-me-admin-01"}' \
            http://localhost:8080/api/v1/auth/login | sed -nE 's/.*"accessToken"\s*:\s*"([^"]+)".*/\1/p')"
          ACCESS_TOKEN="${TOKEN}" BASE_URL=http://localhost:8080 ./scripts/perf-smoke.sh
