# HarnessDG Application Configuration
# 功能：Spring Boot 主配置文件
# 时间：2026-05-07
# 作者：AxeXie

server:
  port: 8080

spring:
  application:
    name: harnessdg
  datasource:
    url: jdbc:postgresql://localhost:5432/harnessdg
    username: harness
    password: harness_dev
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: true

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: true
      logic-not-delete-value: false
      id-type: auto

# SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# HarnessDG 自定义配置
harnessdg:
  security:
    jwt-secret: harnessdg-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256
    token-expire-seconds: 3600
    refresh-expire-seconds: 604800
  agent:
    endpoint: http://localhost:8088
    timeout-ms: 30000

# 日志配置
logging:
  level:
    com.harnessdg: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-}] %-5level %logger{36} - %msg%n"
