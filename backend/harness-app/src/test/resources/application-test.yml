# 测试环境配置
# 功能：单元测试和集成测试专用配置
# 时间：2026-05-08
# 作者：AxeXie

server:
  port: 0  # 随机端口，避免冲突

spring:
  datasource:
    url: jdbc:tc:postgresql:15:///testdb
    username: test
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  flyway:
    enabled: false  # 测试中不使用 Flyway，避免迁移

harnessdg:
  security:
    jwt-secret: test-secret-key-for-unit-test-must-be-at-least-32-chars-long
    token-expire-seconds: 3600
  agent:
    endpoint: http://localhost:8088
    timeout-ms: 5000
  integration:
    dagster:
      endpoint: http://localhost:3000
      graphql-path: /graphql
      timeout-ms: 5000
    sea-tunnel:
      endpoint: http://localhost:8080
      api-path: /seatunnel/api/v1
      timeout-ms: 5000
    open-metadata:
      endpoint: http://localhost:8585
      api-path: /api/v1
      api-key: ""
      timeout-ms: 5000
