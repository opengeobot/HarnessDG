#
# 功能: 应用主配置——关闭自动 DDL、配置 Flyway、分层健康检查与多 Profile。
# 时间: 2026-06-29
# 作者: AxeXie
#
spring:
  application:
    name: aihub-backend
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  # 默认数据源占位；各 Profile 覆盖具体连接信息。
  datasource:
    url: ${AIHUB_DB_URL:jdbc:postgresql://localhost:5432/aihub}
    username: ${AIHUB_DB_USER:aihub}
    password: ${AIHUB_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      leak-detection-threshold: 30000
      connection-timeout: 5000
      idle-timeout: 300000
  # Flyway 负责唯一的库结构演进，前向迁移、空库可基线化。
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

# MyBatis-Plus 不反向建表，仅作为查询/映射框架。
mybatis-plus:
  global-config:
    db-config:
      # 主键由业务 ID 生成器提供，禁用框架内置 ID 策略的自动赋值。
      id-type: input
    # 不在启动时执行任何 DDL/Banner 之外的库初始化。
    banner: false
  configuration:
    map-underscore-to-camel-case: true

# Actuator：分层健康检查（liveness / readiness），readiness 含 PostgreSQL 探测；
# 暴露 prometheus/metrics 供运维抓取，敏感端点（env/heapdump）不暴露到 Web。
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
      show-details: when_authorized
  health:
    # 使用自定义的 db 健康指示器替代默认 DataSource 检查，便于精确控制 readiness 行为。
    db:
      enabled: false
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  # Prometheus 抓取步长（秒），与 scrape interval 对齐。
  prometheus:
    metrics:
      export:
        step: 30s

server:
  port: ${SERVER_PORT:8080}

# 平台业务配置（部署期注入）。Gitea 仓库开通默认关闭，便于无 Gitea 的开发/测试环境使用 Noop 开通器。
aihub:
  public-base-url: ${AIHUB_PUBLIC_BASE_URL:http://localhost:8080}
  gitea:
    enabled: ${AIHUB_GITEA_ENABLED:false}
    base-url: ${AIHUB_GITEA_BASE_URL:}
    token: ${AIHUB_GITEA_TOKEN:}
    default-branch: ${AIHUB_GITEA_DEFAULT_BRANCH:main}
    # Webhook HMAC 签名密钥（生产环境必填，fail-closed 策略下为空将拒绝所有 Gitea 事件）
    webhook-secret: ${AIHUB_GITEA_WEBHOOK_SECRET:}
  # 认证签名密钥（部署期注入 Secret）。测试 Profile 无须配置，由实现按 dev-only 临时密钥兜底。
  security:
    jwt:
      issuer: ${AIHUB_JWT_ISSUER:aihub-platform}
      audience: ${AIHUB_JWT_AUDIENCE:aihub-clients}
      key-id: ${AIHUB_JWT_KEY_ID:}
      private-key-pem: ${AIHUB_JWT_PRIVATE_KEY_PEM:}
      public-key-pem: ${AIHUB_JWT_PUBLIC_KEY_PEM:}
      access-token-ttl: ${AIHUB_JWT_ACCESS_TTL:PT15M}
      refresh-token-ttl: ${AIHUB_JWT_REFRESH_TTL:P7D}
      pat-token-ttl: ${AIHUB_JWT_PAT_TTL:P90D}
    # 浏览器刷新 JWT Cookie 配置。生产默认 Secure；本地/测试 http 可置 false。
    cookie:
      name: ${AIHUB_REFRESH_COOKIE_NAME:aihub_refresh}
      secure: ${AIHUB_REFRESH_COOKIE_SECURE:true}
      same-site: ${AIHUB_REFRESH_COOKIE_SAMESITE:Strict}
      path: ${AIHUB_REFRESH_COOKIE_PATH:/api/v1/auth}
  # 首个管理员引导（部署期注入）。默认空：不创建管理员，仅打印 INFO 提示。
  # 口令来源优先 password-file（Secret 文件），其次 password（环境变量）。口令绝不入 Git/日志。
  bootstrap:
    admin:
      username: ${AIHUB_BOOTSTRAP_ADMIN_USERNAME:}
      display-name: ${AIHUB_BOOTSTRAP_ADMIN_DISPLAY_NAME:平台管理员}
      password: ${AIHUB_BOOTSTRAP_ADMIN_PASSWORD:}
      password-file: ${AIHUB_BOOTSTRAP_ADMIN_PASSWORD_FILE:}
  # MinIO 对象存储配置
  minio:
    endpoint: ${AIHUB_MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${AIHUB_MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${AIHUB_MINIO_SECRET_KEY:minioadmin}
    secure: ${AIHUB_MINIO_SECURE:false}
    external-endpoint: ${AIHUB_MINIO_EXTERNAL_ENDPOINT:}
    dvc-access-key: ${AIHUB_MINIO_DVC_ACCESS_KEY:}
    dvc-secret-key: ${AIHUB_MINIO_DVC_SECRET_KEY:}
    quota-bytes: ${AIHUB_MINIO_QUOTA_BYTES:0}
    quota-warning-percent: ${AIHUB_MINIO_QUOTA_WARNING_PERCENT:80}
  # 预览 Worker 内容解析上限（进程级内存/CPU 由容器 cgroup 约束，见 docs/runbooks/ops.md）
  preview:
    max-rows: ${AIHUB_PREVIEW_MAX_ROWS:100}
    max-cols: ${AIHUB_PREVIEW_MAX_COLS:50}
    max-bytes: ${AIHUB_PREVIEW_MAX_BYTES:1048576}
  # 应用内告警定时检查间隔（毫秒）
  alert:
    check-interval: ${AIHUB_ALERT_CHECK_INTERVAL:300000}
  # Agent/MCP 主体级限流（令牌桶）
  agent:
    rate-limit:
      requests-per-minute: ${AIHUB_AGENT_RATE_LIMIT_RPM:60}
      burst: ${AIHUB_AGENT_RATE_LIMIT_BURST:10}
  # 限流存储后端：memory（默认，单进程）| redis（多实例；Compose 未部署 Redis 时保持 memory）
  rate-limit:
    backend: ${AIHUB_RATE_LIMIT_BACKEND:memory}
    redis-host: ${AIHUB_RATE_LIMIT_REDIS_HOST:localhost}
    redis-port: ${AIHUB_RATE_LIMIT_REDIS_PORT:6379}
  # 邮件外发渠道（默认关闭；启用需配置 SMTP 凭据，见 docs/runbooks/notification-channels.md）
  notification:
    email:
      enabled: ${AIHUB_NOTIFICATION_EMAIL_ENABLED:false}
      from: ${AIHUB_NOTIFICATION_EMAIL_FROM:noreply@aihub.local}
      host: ${AIHUB_NOTIFICATION_EMAIL_HOST:localhost}
      port: ${AIHUB_NOTIFICATION_EMAIL_PORT:587}
      username: ${AIHUB_NOTIFICATION_EMAIL_USERNAME:}
      password: ${AIHUB_NOTIFICATION_EMAIL_PASSWORD:}
      start-tls: ${AIHUB_NOTIFICATION_EMAIL_STARTTLS:true}

---
#
# compose Profile：Docker Compose 一体化开发/验收环境。
#
spring:
  config:
    activate:
      on-profile: compose
  datasource:
    url: ${AIHUB_DB_URL:jdbc:postgresql://postgres:5432/aihub}
    username: ${AIHUB_DB_USER:aihub}
    password: ${AIHUB_DB_PASSWORD:}
# 运行日志统一输出 ECS JSON 结构化格式，便于 Loki/OpenSearch 采集。
logging:
  structured:
    format:
      console: ecs

---
#
# api Profile：仅承载 REST/MCP 在线请求的实例角色。
#
spring:
  config:
    activate:
      on-profile: api

---
#
# worker Profile：承载可靠后台任务的实例角色（不对外暴露业务端口语义）。
#
spring:
  config:
    activate:
      on-profile: worker

---
#
# test Profile：供 Testcontainers 集成测试使用，数据源由容器动态注入。
#
spring:
  config:
    activate:
      on-profile: test
  flyway:
    enabled: true
    clean-disabled: true

aihub:
  gitea:
    enabled: false
