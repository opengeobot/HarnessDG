# 功能: 前端容器内 nginx 静态资源配置 (SPA history fallback)
# 时间: 2026-06-29
# 作者: AxeXie
# 说明: 仅负责提供静态资源；/api、/mcp、/git 等网关路由在 deploy/compose 的反向代理统一处理。

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 静态资源缓存（TASK-P0BR-073：目录名随 vite build.assetsDir='static'，
    # 与 SPA 业务路由 /assets/:assetId... 分名，避免前缀 location 遮蔽深链整页加载）
    location /static/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # SPA 路由回退：未命中文件一律返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
